<h2 style="margin: 18px 0 0; font-size: 22px; font-weight: 800">1. Informações gerais</h2><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">1.1 – O Entendendo o Jogo preza pela privacidade e respeito aos seus usuários e clientes, por isso desenvolvemos esta Política de Privacidade, a fim de mostrar nosso compromisso integral em proteger seus dados pessoais, conforme a Lei Federal n. 12.965 de 23 de abril de 2014 (Marco Civil da Internet), com a Lei Federal n. 13.709, de 14 de agosto de 2018 (Lei de Proteção de Dados Pessoais – LGPD) e com o Regulamento UE n. 2016/679 de 27 de abril de 2016 (Regulamento Geral Europeu de Proteção de Dados Pessoais – RGDP).</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">1.2 – Esta Política de Privacidade poderá ser atualizada em decorrência de eventual atualização normativa, razão pela qual se convida o usuário a consultar periodicamente esta seção.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">1.3 – Solicitamos informações pessoais apenas quando realmente precisamos delas para lhe fornecer um serviço. Fazemo-lo por meios justos e legais, com o seu conhecimento e consentimento.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">1.4 – Apenas retemos as informações coletadas pelo tempo necessário para fornecer o serviço solicitado. Quando armazenamos dados, protegemos dentro de meios comercialmente aceitáveis para evitar perdas e roubos, bem como acesso, divulgação, cópia, uso ou modificação não autorizados.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">1.5 – Não compartilhamos informações de identificação pessoal publicamente ou com terceiros, exceto quando exigido por lei.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">1.6 – O nosso site pode ter links para sites externos que não são operados por nós. Esteja ciente de que não temos controle sobre o conteúdo e práticas desses sites e não podemos aceitar responsabilidade por suas respectivas políticas de privacidade.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">1.7 – O uso continuado de nosso site será considerado como aceitação de nossas práticas em torno de privacidade e informações pessoais. Se você tiver alguma dúvida sobre como lidamos com dados do usuário e informações pessoais, entre em contato conosco.</p><h2 style="margin: 18px 0 0; font-size: 22px; font-weight: 800">2. Direitos do usuário</h2><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">2.1 – O site se compromete a cumprir as normas previstas no LGPD, em respeito aos seguintes princípios:</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">2.1.1 – Os dados pessoais do usuário serão processados de forma lícita, leal, ética e transparente (licitude, lealdade e transparência);</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">2.1.2 – Os dados pessoais do usuário serão coletados apenas para finalidades determinadas, explícitas e legítimas, não podendo ser tratados posteriormente de uma forma incompatível com essas finalidades (limitação das finalidades);</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">2.1.3 – Os dados pessoais do usuário serão coletados de forma adequada, pertinente e limitada às necessidades do objetivo para os quais eles são processados (minimização dos dados);</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">2.1.4 – Os dados pessoais do usuário serão exatos e atualizados sempre que necessário, de maneira que os dados inexatos sejam apagados ou retificados quando possível (exatidão);</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">2.1.5 – Os dados pessoais do usuário serão conservados de uma forma que permita a identificação dos titulares dos dados apenas durante o período necessário para as finalidades para as quais são tratados (limitação da conservação);</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">2.1.6 – Os dados pessoais do usuário serão tratados de forma segura, protegidos do tratamento não autorizado ou ilícito e contra a sua perda, destruição ou danificação acidental, adotando as medidas técnicas ou organizativas adequadas (integridade e confidencialidade).</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">2.2 – O usuário do site possui os seguintes direitos, conferidos pela Lei Geral de Proteção de Dados Pessoais e pelo LGPD:</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">2.2.1 – Direito de confirmação e acesso: é o direito do usuário de obter do site a confirmação de que os dados pessoais que lhe digam respeito são ou não objeto de tratamento e, se for esse o caso, o direito de acessar os seus dados pessoais;</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">2.2.2 – Direito de retificação: é o direito do usuário de obter do site, sem demora injustificada, a retificação dos dados pessoais inexatos que lhe digam respeito;</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">2.2.3 – Direito à eliminação dos dados (direito ao esquecimento): é o direito do usuário de ter seus dados apagados do site;</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">2.2.4 – Direito à limitação do tratamento dos dados: é o direito do usuário de limitar o tratamento de seus dados pessoais, podendo obtê-la quando contesta a exatidão dos dados, quando o tratamento for ilícito, quando o site não precisar mais dos dados para as finalidades propostas e quando tiver se oposto ao tratamento dos dados e em caso de tratamento de dados desnecessários;</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">2.2.5 – Direito de oposição: é o direito do usuário de, a qualquer momento, se opor por motivos relacionados com a sua situação particular, ao tratamento dos dados pessoais que lhe digam respeito, podendo se opor ainda ao uso de seus dados pessoais para definição de perfil de marketing (profiling);</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">2.2.6 – Direito de portabilidade dos dados: é o direito do usuário de receber os dados pessoais que lhe digam respeito e que tenha fornecido ao site, num formato estruturado, de uso corrente e de leitura automática, e o direito de transmitir esses dados a outro site;</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">2.2.7 – Direito de não ser submetido a decisões automatizadas: é o direito do usuário de não ficar sujeito a nenhuma decisão tomada exclusivamente com base no tratamento automatizado, incluindo a definição de perfis (profiling), que produza efeitos na sua esfera jurídica ou que o afete significativamente de forma similar.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">2.2.8 – O usuário poderá exercer os seus direitos por meio de comunicação escrita enviada ao e-mail: (entendendoojogo@gmail.com) com o assunto “LGDP https://entendendoojogo.com.br/”, especificando:</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">Nome completo ou razão social, número do CPF (Cadastro de Pessoas Físicas, da Receita Federal do Brasil) ou CNPJ (Cadastro Nacional de Pessoa Jurídica, da Receita Federal do Brasil) e endereço de e-mail do usuário e, se for o caso, do seu representante;</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">Direito que deseja exercer junto ao site;</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">Data do pedido e assinatura do usuário;</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">Todo documento que possa demonstrar ou justificar o exercício de seu direito.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">O usuário será informado em caso de retificação ou eliminação dos seus dados.</p><h2 style="margin: 18px 0 0; font-size: 22px; font-weight: 800">3. Dever do usuário</h2><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">3.1 – Durante a utilização do site, a fim de resguardar e de proteger os direitos de terceiros, o usuário do site deverá fornecer somente seus dados pessoais, e não os de terceiros.</p><h2 style="margin: 18px 0 0; font-size: 22px; font-weight: 800">4. Tipos de dados dos usuários e tratamentos</h2><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">4.1 – Para a execução de contrato de compra e venda ou de prestação de serviços eventualmente firmado entre o site e o usuário, poderão ser coletados e armazenados outros dados relacionados ou necessários a sua execução, incluindo o teor de eventuais comunicações tidas com o usuário.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">4.2 – Não serão coletados dados sensíveis dos usuários, assim entendidos aqueles definidos nos arts. 9º e 10 do RGPD e nos arts. 11 e seguintes da Lei de Proteção de Dados Pessoais. Assim, dentre outros, não haverá coleta dos seguintes dados:</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">dados que revelem a origem racial ou étnica, as opiniões políticas, as convicções religiosas ou filosóficas, ou a filiação sindical do usuário;</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">dados genéticos;</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">dados biométricos para identificar uma pessoa de forma inequívoca;</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">dados relativos à saúde do usuário;</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">dados relativos à vida sexual ou à orientação sexual do usuário;</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">dados relacionados a condenações penais ou a infrações ou com medidas de segurança conexas.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">Dados pessoais coletados e/ou fornecidos para a Entendendo o Jogo, por qualquer meio, ainda que públicos, que:</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">identifiquem, ou que, quando usadas em combinação com outros dados possibilite a identificação do indivíduo;</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">ou por meio das quais os dados ou informações de contato de uma pessoa física possam ser derivadas. Os Dados Pessoais podem estar em qualquer mídia ou formato, inclusive registros eletrônicos ou computadorizados, bem como em arquivos baseados em papel.</p><h3 style="margin: 8px 0 0; font-size: 18px; font-weight: 700">4.3 – Fundamento jurídico para o tratamento dos dados pessoais:</h3><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">4.3.1 – Ao utilizar os serviços do site, o usuário está consentindo com a presente Política de Privacidade.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">4.3.2 – O usuário tem o direito de retirar seu consentimento a qualquer momento, não comprometendo a licitude do tratamento de seus dados pessoais antes da retirada. Devendo solicitar a retirada através do e-mail: entendendoojogo@gmail.com</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">4.3.3 – O consentimento dos relativamente ou absolutamente incapazes, especialmente de crianças menores de 16 (dezesseis) anos, apenas poderá ser feito, respectivamente, se devidamente assistidos ou representados.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">4.3.4 – O tratamento de dados pessoais sem o consentimento do usuário apenas será realizado em razão de interesse legítimo ou para as hipóteses previstas em lei, ou seja, dentre outras, as seguintes:</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">para o cumprimento de obrigação legal ou regulatória pelo controlador;</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">para a realização de estudos por órgão de pesquisa, garantida, sempre que possível, a anonimização dos dados pessoais;</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">quando necessário para a execução de contrato ou de procedimentos preliminares relacionados a contrato do qual seja parte o usuário, a pedido do titular dos dados;</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">para o exercício regular de direitos em processo judicial, administrativo ou arbitral, esse último nos termos da Lei nº 9.307, de 23 de setembro de 1996 (Lei de Arbitragem);</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">para a proteção da vida ou da incolumidade física do titular dos dados ou de terceiros;</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">para a tutela da saúde, em procedimento realizado por profissionais da área da saúde ou por entidades sanitárias;</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">quando necessário para atender aos interesses legítimos do controlador ou de terceiros, exceto no caso de prevalecerem direitos e liberdades fundamentais do titular dos dados que exijam a proteção dos dados pessoais;</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">para a proteção do crédito, inclusive quanto ao disposto na legislação pertinente</p><h2 style="margin: 18px 0 0; font-size: 22px; font-weight: 800">5.  Finalidades e tratamento dos dados pessoais</h2><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">5.1 – Os dados pessoais do usuário coletados pelo site têm por finalidade facilitar, agilizar e cumprir os compromissos estabelecidos com o usuário e a fazer cumprir as solicitações realizadas por meio do preenchimento de formulários.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">5.2 – Os dados pessoais poderão ser utilizados também com uma finalidade comercial, para personalizar o conteúdo oferecido ao usuário, bem como para dar subsídio ao site para a melhora da qualidade e funcionamento de seus serviços.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">5.3 – O site recolhe os dados do usuário para que seja realizada definição de perfis (profiling), ou seja, tratamento automatizado de dados pessoais que consista em utilizar estes dados para avaliar certos aspectos pessoais do usuário, principalmente para analisar ou prever características relacionadas ao seu desempenho profissional, a sua situação econômica, saúde, preferências pessoais, interesses, fiabilidade, comportamento, localização ou deslocamento.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">5.4 – A coleta de dados relacionados ou necessários à execução de um contrato de compra e venda ou de prestação de serviços eventualmente firmado com o usuário terá a finalidade de conferir às partes segurança jurídica, além de facilitar e viabilizar a conclusão do negócio.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">5.5 – O tratamento de dados pessoais para finalidades não previstas nesta Política de Privacidade somente ocorrerá mediante comunicação prévia ao usuário, sendo que, em qualquer caso, os direitos e obrigações aqui previstos permanecerão aplicáveis.</p><h2 style="margin: 18px 0 0; font-size: 22px; font-weight: 800">6. Prazo de conservação dos dados pessoais</h2><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">6.1 – Os dados pessoais do usuário serão conservados por um período não superior ao exigido para cumprir os objetivos em razão dos quais eles são processados.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">6.2 – O período de conservação dos dados são definidos de acordo com os seguintes critérios:</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">6.2.1 – Os dados serão armazenados pelo tempo necessário para a prestação dos serviços fornecidos pelo site, que podem variar de 1 a 36 meses, de acordo com o status do pedido e/ou solicitação do cliente.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">6.2.2 – Os dados pessoais dos usuários apenas poderão ser conservados após o término de seu tratamento nas seguintes hipóteses:</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">para o cumprimento de obrigação legal ou regulatória pelo controlador;</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">para estudo por órgão de pesquisa, garantida, sempre que possível, a anonimização dos dados pessoais;</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">para a transferência a terceiro, desde que respeitados os requisitos de tratamento de dados dispostos na legislação;</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">para uso exclusivo do controlador, vedado seu acesso por terceiro, e desde que anonimizados os dados.</p><h2 style="margin: 18px 0 0; font-size: 22px; font-weight: 800">7. Destinatários e transferência dos dados pessoais</h2><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">7.1 – Os dados pessoais do usuário poderão ser compartilhados com as seguintes pessoas ou empresas fornecedoras terceirizadas do Entendendo o Jogo: Hotmart.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">7.1.1 – Os fornecedores terceirizados usados por nós irão apenas coletar, usar e divulgar suas informações conforme necessário para permitir que eles realizem os serviços que eles nos fornecem. Entretanto, certos fornecedores de serviços terceirizados, tais como gateways de pagamento e outros processadores de transação de pagamento, têm suas próprias políticas de privacidade com respeito à informação que somos obrigados a fornecer para eles sobre suas transações relacionadas com compras. Para esses fornecedores, recomendamos que você leia suas políticas de privacidade para que você possa entender a maneira na qual suas informações pessoais serão usadas por esses fornecedores.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">7.1.2 – Certos fornecedores podem ser localizados em ou possuir instalações que são localizadas em jurisdições diferentes que você ou nós. Assim, se você quer continuar com uma transação que envolve os serviços de um fornecedor de serviço terceirizado, então suas informações podem tornar-se sujeitas às leis da(s) jurisdição(ões) nas quais o fornecedor de serviço ou suas instalações estão localizados. Como um exemplo, se você está localizado no Canadá e sua transação é processada por um gateway de pagamento localizado no Brasil, então suas informações pessoais usadas para completar aquela transação podem estar sujeitas à divulgação sob a legislação do Brasil. Uma vez que você deixa o site da nossa loja ou seja redirecionado para um aplicativo ou site de terceiros, você não será mais regido por essa Política de Privacidade ou pelos Termos de Serviço do nosso site.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">7.1.3 – A transferência apenas poderá ser feita para outro país caso o país ou território em questão ou a organização internacional em causa assegurem um nível de proteção adequado dos dados do usuário.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">7.1.4 – Caso não haja nível de proteção adequado, o site se compromete a garantir a proteção dos seus dados de acordo com as regras mais rigorosas, por meio de cláusulas contratuais específicas para determinada transferência, cláusulas-padrão contratuais, normas corporativas globais ou selos, certificados e códigos de conduta regularmente emitidos.</p><h2 style="margin: 18px 0 0; font-size: 22px; font-weight: 800">8. Do tratamento dos dados pessoais</h2><h3 style="margin: 8px 0 0; font-size: 18px; font-weight: 700">8.1 – Do responsável pelo tratamento dos dados (data controller)</h3><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">8.1.1 – O controlador, responsável pelo tratamento dos dados pessoais do usuário, é a pessoa física ou jurídica, a autoridade pública, a agência ou outro organismo que, individualmente ou em conjunto com outras, determina as finalidades e os meios de tratamento de dados pessoais.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">Neste site, o responsável pelo tratamento dos dados pessoais coletados é Italo Bartole Resende, que poderá ser contactado pelo e-mail: entendendoojogo@gmail.com.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">8.1.2 – O responsável pelo tratamento dos dados se encarregará diretamente do tratamento dos dado pessoais do usuário.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">8.2 – Do encarregado de proteção de dados (data protection officer)</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">8.2.1 – O encarregado de proteção de dados (data protection officer) é o profissional encarregado de informar, aconselhar e controlar o responsável pelo tratamento dos dados, bem como os trabalhadores que tratem os dados, a respeito das obrigações do site nos termos do RGDP, da Lei de Proteção de Dados Pessoais e de outras disposições de proteção de dados presentes na legislação nacional e internacional, em cooperação com a autoridade de controle competente.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">Neste site o encarregado de proteção de dados (data protection officer) é Italo Bartole Resende, que poderá ser contactado pelo e-mail: entendendoojogo@gmail.com.</p><h3 style="margin: 8px 0 0; font-size: 18px; font-weight: 700">8.3 – Segurança no tratamento dos dados pessoais do usuário</h3><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">8.3.1 – O site se compromete a aplicar as medidas técnicas e organizativas aptas a proteger os dados pessoais de acessos não autorizados e de situações de destruição, perda, alteração, comunicação ou difusão de tais dados.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">8.3.2 – Para a garantia da segurança, serão adotadas soluções que levem em consideração: as técnicas adequadas; os custos de aplicação; a natureza, o âmbito, o contexto e as finalidades do tratamento; e os riscos para os direitos e liberdades do usuário.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">8.3.3 – O site utiliza certificado SSL (Secure Socket Layer) que garante que os dados pessoais se transmitam de forma segura e confidencial, de maneira que a transmissão dos dados entre o servidor e o usuário, e em retroalimentação, ocorra de maneira totalmente cifrada ou encriptada.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">8.3.4 – O site se exime de responsabilidade por culpa exclusiva de terceiros, como em caso de ataque de hackers ou crackers, ou culpa exclusiva do usuário, como no caso em que ele mesmo transfere seus dados a terceiros. O site se compromete, ainda, a comunicar o usuário em prazo adequado caso ocorra algum tipo de violação da segurança de seus dados pessoais que possa lhe causar um alto risco para seus direitos e liberdades pessoais.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">8.3.5 – A violação de dados pessoais é uma violação de segurança que provoque, de modo acidental ou ilícito, a destruição, a perda, a alteração, a divulgação ou o acesso não autorizados a dados pessoais transmitidos, conservados ou sujeitos a qualquer outro tipo de tratamento.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">8.3.6 – O site se compromete a tratar os dados pessoais do usuário com confidencialidade, dentro dos limites legais.</p><h2 style="margin: 18px 0 0; font-size: 22px; font-weight: 800">9. Dados de navegação (cookies)</h2><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">9.1 – Cookies são pequenos arquivos de texto enviados pelo site ao computador do usuário e que nele ficam armazenados, com informações relacionadas à navegação do site.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">9.2 – Por meio dos cookies, pequenas quantidades de informação são armazenadas pelo navegador do usuário para que nosso servidor possa lê-las posteriormente. Podem ser armazenados, por exemplo, dados sobre o dispositivo utilizado pelo usuário, bem como seu local e horário de acesso ao site.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">9.3 – Os cookies não permitem que qualquer arquivo ou informação sejam extraídos do disco rígido do usuário, não sendo possível, ainda, que, por meio deles, se tenha acesso a informações pessoais que não tenham partido do usuário ou da forma como utiliza os recursos do site.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">9.4 – É importante ressaltar que nem todo cookie contém informações que permitem a identificação do usuário, sendo que determinados tipos de cookies podem ser empregados simplesmente para que o site sejam carregado corretamente ou para que suas funcionalidades funcionem do modo esperado.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">9.5 – As informações eventualmente armazenadas em cookies que permitam identificar um usuário são consideradas dados pessoais. Dessa forma, todas as regras previstas nesta Política de Privacidade também lhes são aplicáveis.</p><h3 style="margin: 8px 0 0; font-size: 18px; font-weight: 700">9.6 – Cookies do site:</h3><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">9.6.1 – Os cookies do site são aqueles enviados ao computador ou dispositivo do usuário e administrador exclusivamente pelo site.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">9.6.2 – As informações coletadas por meio destes cookies são utilizadas para melhorar e personalizar a experiência do usuário, sendo que alguns cookies podem, por exemplo, ser utilizados para lembrar as preferências e escolhas do usuário, bem como para o oferecimento de conteúdo personalizado.</p><h3 style="margin: 8px 0 0; font-size: 18px; font-weight: 700">9.7 – Cookies de terceiros:</h3><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">9.7.1 – Alguns de nossos parceiros podem configurar cookies nos dispositivos dos usuário que acessam nosso site.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">9.7.2 – Estes cookies, em geral, visam possibilitar que nossos parceiros possam oferecer seu conteúdo e seus serviços ao usuário que acessa nosso site de forma personalizada, por meio da obtenção de dados de navegação extraídos a partir de sua interação com o site.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">9.7.3 – O usuário poderá obter mais informações sobre os cookies de terceiro e sobre a forma como os dados obtidos a partir dele são tratados, além de ter acesso à descrição dos cookies utilizados e de suas características, acessando o seguinte link: Google Analytics: https://developers.google.com/analytics/devguides/collection/gajs/cookie-usage”</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">As entidades encarregadas da coleta dos cookies poderão ceder as informações obtidas a terceiros.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">9.7.4 – Ferramentas utilizadas atualmente no site: (a) Google Analytics 4, do Google, para medir visitas, páginas acessadas e cliques, de forma agregada, e entender como o site é usado; e (b) Pixel da Meta (Facebook e Instagram), para medir a eficácia de anúncios e permitir a exibição de anúncios mais relevantes nas plataformas da Meta.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">9.7.5 – Essas ferramentas só são carregadas depois que o usuário clica em “Aceitar” no aviso de cookies exibido no site. Se o usuário clicar em “Recusar”, ou não fizer nenhuma escolha, elas não são carregadas e nenhum dado de navegação é enviado ao Google ou à Meta por meio delas.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">9.7.6 – Quando autorizadas, essas ferramentas podem registrar, por exemplo, as páginas visitadas, o tipo de dispositivo e navegador, a localização aproximada, a origem da visita e ações no site, como cliques nos botões de compra (que levam à Hotmart), nos links de WhatsApp, de acesso à EOJHub e no download de materiais gratuitos. O Entendendo o Jogo não envia a essas ferramentas o nome, o e-mail ou outros dados digitados em formulários.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">9.7.7 – A escolha do usuário fica salva no próprio navegador. O consentimento pode ser revogado ou alterado a qualquer momento pelo link “Preferências de cookies”, no rodapé de todas as páginas do site, ou apagando os dados de navegação do navegador.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">9.7.8 – O tratamento dos dados pelo Google e pela Meta segue as políticas de privacidade dessas empresas: Google — https://policies.google.com/privacy ; Meta — https://www.facebook.com/privacy/policy/ .</p><h3 style="margin: 8px 0 0; font-size: 18px; font-weight: 700">9.8 – Cookies de redes sociais:</h3><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">9.8.1 – O site utiliza plugins de redes sociais, que permitem acessá-las a partir do site. Assim, ao fazê-lo, os cookies utilizados por elas poderão ser armazenados no navegador do usuário.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">9.8.2 – Cada rede social possui sua própria política de privacidade e de proteção de dados pessoais, sendo as pessoas físicas ou jurídicas que as mantêm responsáveis pelos dados coletados e pelas práticas de privacidade adotadas.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">9.8.3 – O usuário pode pesquisar, junto às redes sociais, informações sobre como seus dados pessoais são tratados. A título informativo, disponibilizamos os seguintes links, a partir dos quais poderão ser consultadas as políticas de privacidade e de cookies adotadas por algumas das principais redes sociais: Facebook, Twitter, Instagram, Youtube.</p><h3 style="margin: 8px 0 0; font-size: 18px; font-weight: 700">9.9 – Gestão dos cookies e configurações do navegador:</h3><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">9.9.1 – O usuário poderá se opor ao registro de cookies pelo site, bastando que desative esta opção no seu próprio navegador ou aparelho.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">9.9.2 – A desativação dos cookies no entanto, pode afetar a disponibilidade de algumas ferramentas e funcionalidades do site, comprometendo seu correto e esperado funcionamento. Outra consequência possível é remoção das preferências do usuário que eventualmente tiverem sido salvas, prejudicando sua experiência.</p><h2 style="margin: 18px 0 0; font-size: 22px; font-weight: 800">10. Das alterações</h2><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">10.1 – A presente versão desta Política de Privacidade foi atualizada pela última vez em 15 de março de 2023.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">10.2 – O editor se reserva o direito de modificar, a qualquer momento o site as presentes normas, especialmente para adaptá-las às evoluções do site, seja pela disponibilização de novas funcionalidades, seja pela supressão ou modificação daquelas já existentes.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">10.3 – O usuário será explicitamente notificado em caso de alteração desta política.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">10.4 – Ao utilizar o serviço após eventuais modificações, o usuário demonstra sua concordância com as novas normas. Caso discorde de alguma das modificações, deverá interromper, imediatamente o acesso ao site e apresentar a sua ressalva ao serviço de atendimento, se assim o desejar.</p><h2 style="margin: 18px 0 0; font-size: 22px; font-weight: 800">11. Do Direito aplicável e do foro</h2><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">Para a solução das controvérsias decorrentes do presente instrumento, será aplicado integralmente a esta política à Lei da República Federativa do Brasil.</p>
