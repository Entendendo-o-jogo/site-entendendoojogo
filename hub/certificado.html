<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { loading: true, erro: '', copiado: false }; }
  componentDidMount() {
    var self = this, cod = EOJB.param('c');
    if (EOJB.param('exemplo')) return this.setState({ loading: false, exemplo: true, ct: { codigo: 'EOJ-EXEMPLO', nome: 'Nome Completo do Aluno', curso: 'Jogo de Posição', carga_horaria: 10, aulas: 97, emitido_em: new Date().toISOString() } });
    if (!cod) return this.setState({ loading: false, erro: 'Certificado não encontrado.' });
    EOJB.ready.then(function () { return EOJH.verCertificado(cod); }).then(function (ct) {
      if (!ct) return self.setState({ loading: false, erro: 'Não encontramos um certificado com este código.' });
      document.title = 'Certificado — ' + ct.curso + ' — ' + ct.nome;
      self.setState({ loading: false, ct: ct });
    }).catch(function (e) { self.setState({ loading: false, erro: EOJB.msg(e) }); });
  }
  renderVals() {
    var self = this, st = this.state, ct = st.ct, v = { loading: st.loading, erro: st.erro, tem: !!ct };
    if (!ct) return v;
    var d = new Date(ct.emitido_em), url = 'https://entendendoojogo.com.br/hub/certificado?c=' + ct.codigo;
    v.nome = ct.nome; v.curso = ct.curso; v.codigo = ct.codigo;
    v.detalhe = ct.carga_horaria ? ', com carga horária de ' + ct.carga_horaria + (ct.carga_horaria === 1 ? ' hora' : ' horas') : '';
    v.data = 'Concluído em ' + d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' });
    v.exemplo = !!st.exemplo;
    var tr = ct.tipo === 'trilha';
    v.frase = tr ? 'concluiu com êxito a trilha' : 'concluiu com êxito o curso';
    v.perfilTxt = tr ? (ct.perfil ? ' (' + ct.perfil + '), com ' + ct.aulas + ' aulas' : ', com ' + ct.aulas + ' aulas') : '';
    v.subtitulo = tr ? 'de conclusão de trilha' : 'de conclusão de curso';
    setTimeout(function () { var q = document.querySelector('[data-qr]'); if (q && window.EOJQR && q.getAttribute('data-c') !== ct.codigo) { q.innerHTML = EOJQR.svg(url); q.setAttribute('data-c', ct.codigo); var sv = q.firstChild; if (sv) { sv.setAttribute('width', '84'); sv.setAttribute('height', '84'); } } }, 0);
    v.imprimir = function () { window.print(); };
    v.linkedin = 'https://www.linkedin.com/profile/add?startTask=CERTIFICATION_NAME&name=' + encodeURIComponent(ct.curso) + '&organizationName=' + encodeURIComponent('Entendendo o Jogo') +
      '&issueYear=' + d.getFullYear() + '&issueMonth=' + (d.getMonth() + 1) + '&certUrl=' + encodeURIComponent(url) + '&certId=' + ct.codigo;
    v.copiarTxt = st.copiado ? 'Link copiado' : 'Copiar link';
    v.copiar = function () { (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(function () { self.setState({ copiado: true }); }).catch(function () { prompt('Copie o link:', url); }); };
    return v;
  }
}
EOJ.mount(typeof Component !== 'undefined' ? Component : null);
</script>
