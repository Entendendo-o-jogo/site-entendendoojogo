<h1 style="margin: 0; font-weight: 800; font-size: 42px; line-height: 1.1">Ataques à última linha do adversário (parte 1)</h1>
<p style="margin: 0; font-size: 15px; color: #555555">Por <strong style="color: #111111">Ítalo Resende</strong> · 29 de abril de 2023 · 4 min de leitura</p>
<div style="position: relative; width: 100%; aspect-ratio: 21 / 9; border-radius: 16px; overflow: hidden; background: radial-gradient(120% 90% at 50% 40%, #1E2A36 0%, #111111 70%); color: #FFFFFF"><svg viewBox="0 0 160 90" preserveAspectRatio="xMidYMid slice" style="position: absolute; inset: 0; width: 100%; height: 100%" aria-hidden="true"><defs><marker id="ar" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#A1C4E6"></path></marker></defs><g fill="none" stroke="#A1C4E6" stroke-opacity="0.2" stroke-width="0.6"><rect x="6" y="6" width="148" height="78"></rect><line x1="80" y1="6" x2="80" y2="84"></line><circle cx="80" cy="45" r="11"></circle><rect x="6" y="26" width="20" height="38"></rect><rect x="134" y="26" width="20" height="38"></rect></g><g stroke="#A1C4E6" stroke-opacity="0.35" stroke-width="0.5" stroke-dasharray="1.5 1.5"><line x1="6" y1="20" x2="154" y2="20"></line><line x1="6" y1="32" x2="154" y2="32"></line><line x1="6" y1="58" x2="154" y2="58"></line><line x1="6" y1="70" x2="154" y2="70"></line><line x1="56" y1="6" x2="56" y2="84"></line><line x1="104" y1="6" x2="104" y2="84"></line></g><rect x="104" y="32" width="50" height="26" fill="#A1C4E6" fill-opacity="0.12"></rect><circle cx="30" cy="13" r="2.2" fill="#A1C4E6" fill-opacity="0.95"></circle><circle cx="34" cy="45" r="2.2" fill="#A1C4E6" fill-opacity="0.95"></circle><circle cx="28" cy="77" r="2.2" fill="#A1C4E6" fill-opacity="0.95"></circle><circle cx="70" cy="26" r="2.2" fill="#A1C4E6" fill-opacity="0.95"></circle><circle cx="68" cy="64" r="2.2" fill="#A1C4E6" fill-opacity="0.95"></circle><circle cx="120" cy="13" r="2.2" fill="#A1C4E6" fill-opacity="0.95"></circle><circle cx="128" cy="26" r="2.2" fill="#A1C4E6" fill-opacity="0.95"></circle><circle cx="132" cy="64" r="2.2" fill="#A1C4E6" fill-opacity="0.95"></circle><circle cx="120" cy="77" r="2.2" fill="#A1C4E6" fill-opacity="0.95"></circle><circle cx="140" cy="45" r="2.2" fill="#A1C4E6" fill-opacity="0.95"></circle><circle cx="112" cy="40" r="1.8" fill="#FFFFFF" fill-opacity="0.55"></circle><circle cx="116" cy="52" r="1.8" fill="#FFFFFF" fill-opacity="0.55"></circle><circle cx="96" cy="34" r="1.8" fill="#FFFFFF" fill-opacity="0.55"></circle><circle cx="96" cy="56" r="1.8" fill="#FFFFFF" fill-opacity="0.55"></circle><circle cx="86" cy="45" r="1.8" fill="#FFFFFF" fill-opacity="0.55"></circle></svg><div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(17,17,17,0) 30%, rgba(17,17,17,0.9) 100%)"></div><div style="position: absolute; left: 36px; right: 36px; bottom: 36px; display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #A1C4E6">Texto tático</span><span style="font-size: 34px; font-weight: 800; line-height: 1.12; text-transform: uppercase">Ataques à última linha do adversário (parte 1)</span></div></div>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">O Manchester City é uma equipe que possui alguns padrões de ataque bem definidos e que possuem um alto grau de eficiência. Uma das dinâmicas mais eficientes que eles utilizam, são as corridas nas costas da última linha (principalmente nas costas dos laterais), para criar situações de cruzamento e finalização. Estas corridas levam em considerações alguns aspectos, mas iremos focar em 2 deles aqui: a capacidade de entrar no espaço, por parte do receptor (parte 1 do texto) e a capacidade de manipular o adversário, por parte do passador (parte 2 do texto).</p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Antes de falarmos dos desmarques, que serão mais aprofundados daqui a pouco, podemos explorar alguns aspectos que são gerais nos 2 textos que utilizaremos para falar desse tema. O primeiro aspecto a se considerar, é o sentido do passe antes de a bola entrar em profundidade (que pode ser lido nas outras matérias), que mexe com o perfil corporal dos adversários no momento da trajetória do passe. Podemos observar na imagem abaixo, como os jogadores adversários tendem a girar o quadril para o lado da bola e aumentarem o campo cego para determinado espaço.</p>
<figure style="margin: 8px 0; display: flex; flex-direction: column; gap: 8px"><img src="/assets/3534f91082f50077ee814115cc14e26a.jpg" alt="" style="width: 100%; height: auto; display: block; border-radius: 10px; border: 1px solid #E2E2E2"></figure>
<figure style="margin: 8px 0; display: flex; flex-direction: column; gap: 8px"><img src="/assets/1e80281b08a46557b07b439ba44f2844.jpg" alt="" style="width: 100%; height: auto; display: block; border-radius: 10px; border: 1px solid #E2E2E2"></figure>
<figure style="margin: 8px 0; display: flex; flex-direction: column; gap: 8px"><img src="/assets/1e80281b08a46557b07b439ba44f2844.jpg" alt="" style="width: 100%; height: auto; display: block; border-radius: 10px; border: 1px solid #E2E2E2"></figure>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Observem na sequência de imagens, como o quadril do defensor se girou para a bola, no momento em que a bola é passada na amplitude. Isso permite com que o De Bruyne observe e ataque o espaço sem que ele seja percebido no mesmo tempo em que o adversário controla a profundidade – observem na última imagem como o defensor percebe o De Bruyne, mas não consegue iniciar a corrida, por se tratar de 2 ações muito difíceis de serem realizadas simultaneamente.</p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Esta dinâmica também possui uma particularidade que também pode ser vantajosa para quem ataca, que é a coordenação de coberturas por parte de quem defende (o zagueiro do lado cobre o lateral ou volante faz essa cobertura?). Essa coordenação, por mais que treinada e estimulada, é difícil de ser realizada no jogo, porque podem possuir algumas fixações em outros setores, que dificultam essas ações. Além disso, o sentido de onde vem a cobertura, pode dificultar o corte, como é o caso da cobertura feita pelo volante, que vem de uma zona que dificulta o bloqueio do cruzamento (que é a zona diagonal de trás de quem faz o desmarque).</p>
<figure style="margin: 8px 0; display: flex; flex-direction: column; gap: 8px"><img src="/assets/97bbc4d3c49de60963f0cbe8ba9036bb.jpg" alt="" style="width: 100%; height: auto; display: block; border-radius: 10px; border: 1px solid #E2E2E2"></figure>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Na imagem acima, observem como o Haaland prende a atenção do zagueiro do lado da bola, o que faz com que ele perca algum tempo para sair na cobertura do De Bruyne, oferecendo tempo suficiente para ele realizar o domínio e cruzamento (conforme ilustrado na imagem abaixo).</p>
<figure style="margin: 8px 0; display: flex; flex-direction: column; gap: 8px"><img src="/assets/6de77305f3e6ee3e0fd553323a25d0c1.jpg" alt="" style="width: 100%; height: auto; display: block; border-radius: 10px; border: 1px solid #E2E2E2"></figure>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Nesta primeira parte, portanto, falaremos dos aspectos que envolvem os desmarques e como eles podem ser pensados para gerarem mais benefícios em prol dos jogadores que fazem este movimento – já entendendo a importância de perceber o giro de quadril gerado pela origem do passe, que vai ser fundamental para os outros aspectos.</p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Um fator que é de extrema importância nas corridas, é o timing de início da corrida relacionado com a posição inicial do jogador que vai realizar o desmarque, principalmente porque é uma zona de alto risco de impedimento. As imagens abaixo ilustram muito bem isso. Na primeira imagem, com a bola ainda coberta e impossibilitada de ser jogada para a profundidade, devido à posição do Mahrez, o De Bruyne arrasta o marcador para uma posição que vai aumentar o espaço das costas, para que ele consiga ter mais espaço campo cego do oponente.</p>
<figure style="margin: 8px 0; display: flex; flex-direction: column; gap: 8px"><img src="/assets/5d6af025ae77d2573004091f7ae7c584.jpg" alt="" style="width: 100%; height: auto; display: block; border-radius: 10px; border: 1px solid #E2E2E2"></figure>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Quando a bola é trazida, mesmo que muito pouco, para dentro (perna boa do Mahrez), o De Bruyne, agora com mais espaço, inicia o movimento de ruptura, um pouco adiantado em relação à decisão do adversário, que só vai reagir à ação do belga. Resultado? Espaço nas costas suficientes para a realização da ação.</p>
<figure style="margin: 8px 0; display: flex; flex-direction: column; gap: 8px"><img src="/assets/efbf31a959789269018e212adbfd4fbb.jpg" alt="" style="width: 100%; height: auto; display: block; border-radius: 10px; border: 1px solid #E2E2E2"></figure>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Observem nesse outro exemplo, em que a bola já está dominada, mas De Bruyne ainda não atacou o espaço, porque o adversário ainda não está totalmente atraído.</p>
<figure style="margin: 8px 0; display: flex; flex-direction: column; gap: 8px"><img src="/assets/faf8167ef0ea8c9892cc917f4dcdcdfe.jpg" alt="" style="width: 100%; height: auto; display: block; border-radius: 10px; border: 1px solid #E2E2E2"></figure>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Quando a atração, de fato acontece, o belga acelera o movimento, para aproveitar o máximo de espaço e tempo que poderia ter nesse tipo de situação.</p>
<figure style="margin: 8px 0; display: flex; flex-direction: column; gap: 8px"><img src="/assets/bb69f11579eb2d297daa753512fb8989.jpg" alt="" style="width: 100%; height: auto; display: block; border-radius: 10px; border: 1px solid #E2E2E2"></figure>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Devido aos fatores vantajosos para quem ataca e difíceis de serem cobertos por parte de quem defende, essa dinâmica de ataque às costas da última linha são dinâmicas que podem ser treinadas e estimuladas para aumentarem o repertório de quem ataca e, consequentemente, as chances de sucesso da equipe que busca o gol.</p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">No próximo texto, abordaremos mais sobre as intenções dos jogadores que possuem a bola nesse tipo de situação.</p>
