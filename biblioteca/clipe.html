        (ja ? EOJB.remover(p.id, c.id) : EOJB.adicionar(p.id, c.id)).then(function () { self.aviso(ja ? 'Removido de “' + p.nome + '”' : 'Adicionado a “' + p.nome + '”'); return self.recarregar(); }).catch(function (e) { self.aviso(EOJB.msg(e)); self.recarregar(); });
      } }; });
    v.novaPl = this._nova; v.setNovaPl = function (e) { self._nova = e.target.value; };
    v.criarPl = function () {
      var nome = (self._nova || '').trim(); if (!nome) return self.aviso('Dê um nome para a playlist.');

    };
    // Ficha
    v.ficha = [['Tipo', c.tipo], ['Resultado', c.resultado], ['Subtema', c.subtema], ['Momento', c.momento], ['Fase', c.fase], ['Posição', c.posicao], ['Equipe', c.equipe], ['Conceito', c.conceito],
      ['Nível', c.nivel], ['Gênero', c.genero], ['Câmera', c.camera], ['Duração', c.duracao]].filter(function (x) { return x[1]; }).map(function (x) { return { k: x[0], v: EOJB.t(x[1]) }; });
    return v;
  }
}

</script>
