<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { loading: true, erro: '', tema: '' }; }
  componentDidMount() {
    var self = this, slug = EOJB.param('c');
    if (!slug) return this.setState({ loading: false, erro: 'Curso não encontrado.' });
    EOJB.ready.then(function () { return Promise.all([EOJH.curso(slug), EOJH.matriculas(), EOJH.progresso()]); }).then(function (r) {

      EOJH.meuCertificado(r[0].id).then(function (ct) { if (ct) self.setState({ cert: ct.codigo }); }).catch(function () {});

    var st = this.state, c = st.c, v = { loading: st.loading, erro: st.erro, tem: !!c };

<p style="margin: 0; flex: 1 1 320px">Usamos cookies de análise e de marketing (Google Analytics e Meta) para entender como o site é usado, melhorar o conteúdo e mostrar anúncios relevantes. Você pode aceitar ou recusar. <a href="/privacidade" style="color: #A1C4E6">Política de privacidade</a></p>
<div style="display: flex; gap: 10px; flex: 0 0 auto">
<button type="button" data-eoj-cookies="recusado" style="font: inherit; font-weight: 600; background: transparent; color: #FFFFFF; border: 1px solid #555555; border-radius: 8px; padding: 10px 16px; cursor: pointer">Recusar</button>
<button type="button" data-eoj-cookies="aceito" style="font: inherit; font-weight: 700; background: #A1C4E6; color: #111111; border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer">Aceitar</button>
</div>
</div>
<script>
(function () {
  var box = document.getElementById('eoj-consent');
  var v = null; try { v = localStorage.getItem('eoj-cookies'); } catch (e) {}
  if (!v) { box.hidden = false; box.style.display = 'flex'; }
  window.eojCookies = function () { box.hidden = false; box.style.display = 'flex'; };
  box.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-eoj-cookies]'); if (!b) return;
    var c = b.getAttribute('data-eoj-cookies');
    try { localStorage.setItem('eoj-cookies', c); } catch (e) {}
    box.hidden = true; box.style.display = 'none';
    if (c === 'aceito') window.eojLoadGA();
    else if (window.__eojMkt) { try { location.reload(); } catch (e) {} }
  });
})();
</script>
</body>
</html>
