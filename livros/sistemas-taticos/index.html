<h2 id="sobre-t" style="margin: 0; font-family: Montserrat, sans-serif; font-weight: 800; font-size: 36px; line-height: 1.05; text-transform: uppercase">Por dentro da obra</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(440px, 1fr)); gap: 20px; align-items: start"><div style="background: #FFFFFF; border: 1px solid #E2E2E2; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 12px"><h3 style="margin: 0; font-size: 19px; font-weight: 800; text-transform: uppercase">Como nasceu a ideia</h3><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">O livro “Sistemas Táticos” nasceu da paixão compartilhada pelos autores, do domínio profundo do assunto e do desejo contínuo de registrar visões próprias e analisar os métodos de grandes treinadores.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">Após o sucesso de público e vendas da primeira obra, Situações Táticas de Jogo: Fase Ofensiva, a chama pelo registro de novos estudos permaneceu mais viva do que nunca. A certeza de que um novo livro viria era absoluta, e conteúdo não faltava. O verdadeiro desafio era o tempo — escasso diante da rotina desgastante do futebol —, mas que foi conquistado dia após dia pelo desejo ardente de escrever.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">Embora o público tenha pedido em peso uma sequência focada estritamente na fase defensiva, os autores decidiram priorizar outro tema que fascina a comunidade do futebol: os sistemas táticos. Buscando ir além da utopia teórica, o objetivo central desta obra é trazer uma abordagem prática e aplicável no dia a dia. Por isso, o livro não apenas detalha as plataformas de jogo, mas desvenda dinamicamente o confronto entre sistemas ofensivos e defensivos, cobrindo conceitos essenciais de ambas as fases do jogo.</p></div><div style="background: #FFFFFF; border: 1px solid #E2E2E2; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 12px"><h3 style="margin: 0; font-size: 19px; font-weight: 800; text-transform: uppercase">Tecnologia em prol do conhecimento: QR Codes</h3><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">Desde a primeira publicação, a experiência do leitor tem sido a prioridade máxima. Por isso, este novo livro mantém o formato interativo que conecta teoria e prática.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">Vídeos ilustrativos: o leitor tem acesso a análises em vídeo com marcações visuais e legendas dinâmicas, detalhando cada sistema tático abordado.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">Acesso prático: cada capítulo conta com um ou mais QR Codes. Basta apontar a câmera do celular ou tablet para ir direto aos vídeos correspondentes.</p></div><div style="background: #FFFFFF; border: 1px solid #E2E2E2; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 12px"><h3 style="margin: 0; font-size: 19px; font-weight: 800; text-transform: uppercase">Prefácio de Eduardo Barroca</h3><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">A escolha do prefaciador partiu do desejo de contar com alguém que compartilhasse os mesmos princípios dos autores: a busca pela evolução do futebol brasileiro, o desenvolvimento pessoal, a difusão do conhecimento e o domínio tático.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">Além de ser um estudioso da bola e treinador consolidado no mercado, Barroca também é autor de livro publicado e uma grande referência para profissionais que, assim como os autores, não trilharam o caminho de jogadores profissionais, mas conquistaram espaço no futebol através do estudo obstinado.</p></div></div>
