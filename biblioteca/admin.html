<section style="background: #111111; color: #FFFFFF; border-top: 1px solid #2A2A2A"><div style="max-width: 1240px; margin: 0 auto; padding: 44px 32px 48px; display: flex; flex-direction: column; gap: 18px"><div style="display: flex; flex-direction: column; gap: 8px"><p style="margin: 0; color: #A1C4E6; font-weight: 600; font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase">Biblioteca EOJ · painel</p><h1 style="margin: 0; font-weight: 800; font-size: 44px; line-height: 1; text-transform: uppercase">Painel de clipes</h1></div><p style="margin: 0; font-size: 16px; color: #CFCFCF; max-width: 720px">Suba o vídeo no Vimeo (privacidade “Não listado” ou “Ocultar do Vimeo” com incorporação liberada para entendendoojogo.com.br), cole o link aqui e preencha os filtros.</p></div></section><div style="max-width: 1100px; margin: 0 auto; padding: 36px 32px 90px; display: flex; flex-direction: column; gap: 30px"><sc-if value="{{loading}}" hint-placeholder-val="{{ false }}"><p role="status" style="margin: 0; padding: 40px 0; color: #555555; font-size: 15px">Carregando…</p></sc-if><sc-if value="{{erro}}" hint-placeholder-val="{{ false }}"><p role="alert" style="margin: 0; background: #FCEDEC; color: #8C1D18; border-radius: 10px; padding: 14px 16px; font-size: 15px">{{erro}}</p></sc-if><sc-if value="{{negado}}" hint-placeholder-val="{{ false }}"><div style="background: #FFFFFF; border: 1px solid #E2E2E2; border-radius: 12px; padding: 28px; display: flex; flex-direction: column; gap: 12px"><p style="margin: 0; font-size: 16px">{{negadoMsg}}</p><a href="/biblioteca/entrar?volta=%2Fbiblioteca%2Fadmin" style="font: inherit; font-size: 15px; font-weight: 700; background: #A1C4E6; color: #111111; border: 0; border-radius: 8px; padding: 13px 20px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; align-self: flex-start">Entrar</a></div></sc-if><sc-if value="{{ok}}" hint-placeholder-val="{{ true }}"><section style="background: #FFFFFF; border: 1px solid #E2E2E2; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 14px"><h2 style="margin: 0; font-size: 20px; font-weight: 800; text-transform: uppercase">Importar da pasta do Vimeo</h2><p style="margin: 0; font-size: 15px; line-height: 1.55; color: #555555">Traz de uma vez todos os vídeos da pasta que ainda não estão na Biblioteca. Eles entram <strong>ocultos</strong>: confira os filtros de cada um e clique em “Publicar”. O nome do arquivo já preenche parte dos filtros: começando com sistema (ex.: 4-3-3) vira “Sistemas táticos”; começando com posição (ex.: Lateral) vira “Tática individual”.</p><div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end"><label class="bib-lb" style="flex: 1 1 320px">Link da pasta da Biblioteca no Vimeo<input class="bib-in" name="pasta" type="text" placeholder="https://vimeo.com/user/…/folder/12345678" value="{{pasta}}" onInput="{{setPasta}}"></label><button type="button" onClick="{{importar}}" style="font: inherit; font-size: 15px; font-weight: 700; background: #A1C4E6; color: #111111; border: 0; border-radius: 8px; padding: 13px 20px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px">{{impBtn}}</button></div><sc-if value="{{impMsg}}" hint-placeholder-val="{{ false }}"><p role="status" style="margin: 0; font-size: 15px; background: #E6EFF8; color: #3A6894; border-radius: 8px; padding: 12px 14px">{{impMsg}}</p></sc-if></section><form onSubmit="{{salvar}}" style="background: #FFFFFF; border: 1px solid #E2E2E2; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 18px"><h2 style="margin: 0; font-size: 20px; font-weight: 800; text-transform: uppercase">{{formTitulo}}</h2><div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end"><label class="bib-lb" style="flex: 1 1 320px">Link do vídeo no Vimeo<input class="bib-in" name="link" type="text" placeholder="https://vimeo.com/123456789/abcdef1234" value="{{f.link}}" onInput="{{set}}"></label><button type="button" onClick="{{buscar}}" style="font: inherit; font-size: 15px; font-weight: 600; background: #FFFFFF; color: #111111; border: 1.5px solid #CCCCCC; border-radius: 8px; padding: 12px 18px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px">Buscar dados do Vimeo</button></div><sc-if value="{{f.thumb}}" hint-placeholder-val="{{ false }}"><img src="{{f.thumb}}" alt="Miniatura do vídeo" style="width: 240px; max-width: 100%; border-radius: 8px"></sc-if><div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px"><label class="bib-lb">Título<input class="bib-in" name="titulo" type="text" placeholder="Ex.: Saída de 3 com lateral por dentro" value="{{f.titulo}}" onInput="{{set}}"></label><label class="bib-lb">Duração<input class="bib-in" name="duracao" type="text" placeholder="Ex.: 0:42" value="{{f.duracao}}" onInput="{{set}}"></label><label class="bib-lb">Fase<input class="bib-in" name="fase" type="text" list="dl-fase" placeholder="Ex.: Construção" value="{{f.fase}}" onInput="{{set}}"></label><datalist id="dl-fase"><sc-for list="{{dl.fase}}" as="d" hint-placeholder-count="0"><option value="{{d}}"></option></sc-for></datalist><label class="bib-lb">Conceito<input class="bib-in" name="conceito" type="text" list="dl-conceito" placeholder="Ex.: Terceiro homem" value="{{f.conceito}}" onInput="{{set}}"></label><datalist id="dl-conceito"><sc-for list="{{dl.conceito}}" as="d" hint-placeholder-count="0"><option value="{{d}}"></option></sc-for></datalist><label class="bib-lb">Posição<input class="bib-in" name="posicao" type="text" list="dl-posicao" placeholder="Ex.: Lateral" value="{{f.posicao}}" onInput="{{set}}"></label><datalist id="dl-posicao"><sc-for list="{{dl.posicao}}" as="d" hint-placeholder-count="0"><option value="{{d}}"></option></sc-for></datalist><label class="bib-lb">Nível<input class="bib-in" name="nivel" type="text" list="dl-nivel" placeholder="Ex.: Profissional" value="{{f.nivel}}" onInput="{{set}}"></label><datalist id="dl-nivel"><sc-for list="{{dl.nivel}}" as="d" hint-placeholder-count="0"><option value="{{d}}"></option></sc-for></datalist><label class="bib-lb">Equipe<input class="bib-in" name="equipe" type="text" list="dl-equipe" placeholder="Ex.: Equipe A" value="{{f.equipe}}" onInput="{{set}}"></label><datalist id="dl-equipe"><sc-for list="{{dl.equipe}}" as="d" hint-placeholder-count="0"><option value="{{d}}"></option></sc-for></datalist></div><fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px"><legend style="padding: 0; margin-bottom: 8px; font-size: 14px; font-weight: 600">Momento do jogo</legend><div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{op.momento}}" as="o" hint-placeholder-count="3"><button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="font: inherit; font-size: 14px; cursor: pointer; padding: 8px 12px; border-radius: 99px; border: 1.5px solid {{o.border}}; background: {{o.bg}}; color: {{o.fg}}">{{o.label}}</button></sc-for></div></fieldset><fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px"><legend style="padding: 0; margin-bottom: 8px; font-size: 14px; font-weight: 600">Subtema</legend><div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{op.subtema}}" as="o" hint-placeholder-count="3"><button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="font: inherit; font-size: 14px; cursor: pointer; padding: 8px 12px; border-radius: 99px; border: 1.5px solid {{o.border}}; background: {{o.bg}}; color: {{o.fg}}">{{o.label}}</button></sc-for></div></fieldset><fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px"><legend style="padding: 0; margin-bottom: 8px; font-size: 14px; font-weight: 600">Tipo de vídeo</legend><div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{op.tipo}}" as="o" hint-placeholder-count="3"><button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="font: inherit; font-size: 14px; cursor: pointer; padding: 8px 12px; border-radius: 99px; border: 1.5px solid {{o.border}}; background: {{o.bg}}; color: {{o.fg}}">{{o.label}}</button></sc-for></div></fieldset><fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px"><legend style="padding: 0; margin-bottom: 8px; font-size: 14px; font-weight: 600">Resultado</legend><div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{op.resultado}}" as="o" hint-placeholder-count="3"><button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="font: inherit; font-size: 14px; cursor: pointer; padding: 8px 12px; border-radius: 99px; border: 1.5px solid {{o.border}}; background: {{o.bg}}; color: {{o.fg}}">{{o.label}}</button></sc-for></div></fieldset><fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px"><legend style="padding: 0; margin-bottom: 8px; font-size: 14px; font-weight: 600">Câmera</legend><div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{op.camera}}" as="o" hint-placeholder-count="3"><button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="font: inherit; font-size: 14px; cursor: pointer; padding: 8px 12px; border-radius: 99px; border: 1.5px solid {{o.border}}; background: {{o.bg}}; color: {{o.fg}}">{{o.label}}</button></sc-for></div></fieldset><fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px"><legend style="padding: 0; margin-bottom: 8px; font-size: 14px; font-weight: 600">Gênero</legend><div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{op.genero}}" as="o" hint-placeholder-count="3"><button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="font: inherit; font-size: 14px; cursor: pointer; padding: 8px 12px; border-radius: 99px; border: 1.5px solid {{o.border}}; background: {{o.bg}}; color: {{o.fg}}">{{o.label}}</button></sc-for></div></fieldset><label class="bib-lb">Descrição (opcional)<textarea class="bib-in" name="descricao" rows="4" onInput="{{set}}">{{f.descricao}}</textarea></label><label style="display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600"><input type="checkbox" name="publicado" data-checked="{{pub}}" onChange="{{setPub}}" style="width: 20px; height: 20px">Publicado (visível no acervo)</label><sc-if value="{{ferr}}" hint-placeholder-val="{{ false }}"><p role="alert" style="margin: 0; font-size: 14px; color: #8C1D18">{{ferr}}</p></sc-if><div style="display: flex; flex-wrap: wrap; gap: 10px"><button type="submit" style="font: inherit; font-size: 15px; font-weight: 700; background: #A1C4E6; color: #111111; border: 0; border-radius: 8px; padding: 13px 20px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px">{{btnSalvar}}</button><sc-if value="{{editando}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{novo}}" style="font: inherit; font-size: 15px; font-weight: 600; background: #FFFFFF; color: #111111; border: 1.5px solid #CCCCCC; border-radius: 8px; padding: 12px 18px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px">Cancelar edição</button></sc-if></div></form><section style="display: flex; flex-direction: column; gap: 12px"><h2 style="margin: 0; font-size: 20px; font-weight: 800; text-transform: uppercase">Clipes cadastrados ({{n}})</h2><sc-if value="{{vazio}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; color: #555555">Nenhum clipe ainda. Cadastre o primeiro acima.</p></sc-if><sc-for list="{{lista}}" as="c" hint-placeholder-count="3"><div style="background: #FFFFFF <script>
var CAMPOS = ['link', 'titulo', 'duracao', 'fase', 'conceito', 'posicao', 'nivel', 'equipe', 'momento', 'subtema', 'tipo', 'resultado', 'camera', 'genero', 'descricao', 'thumb'];
var OPCOES = {
  momento: ['Org. ofensiva', 'Org. defensiva', 'Transição ofensiva', 'Transição defensiva', 'Bolas paradas'],
  subtema: ['Sistemas táticos', 'Tática individual', 'Comportamento por posição', 'Bolas paradas'],
  tipo: ['Clipe separado', 'Compilado'], resultado: ['Positivo', 'Negativo'], camera: ['Câmera tática', 'Câmera da TV'], genero: ['Masculino', 'Feminino']
};
function vazio() { var f = { id: null, publicado: true }; CAMPOS.forEach(function (k) { f[k] = ''; }); f.tipo = 'Clipe separado'; f.camera = 'Câmera tática'; f.genero = 'Masculino'; return f; }
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { loading: true, erro: '', negado: '', lista: [], ferr: '', toast: '', busy: false, v: 0, imp: false, impMsg: '' }; this.f = vazio(); try { this._pasta = localStorage.getItem('eoj-pasta-vimeo') || ''; } catch (e) { this._pasta = ''; } }
  componentDidMount() {
    var self = this;
    EOJB.ready.then(function () {
      if (!EOJB.user) return self.setState({ loading: false, negado: 'Entre com a sua conta de administrador para cadastrar clipes.' });
      if (!EOJB.isAdmin()) return self.setState({ loading: false, negado: 'Sua conta não tem permissão de administrador. Peça a liberação ao Ítalo.' });
      return self.carregar();
    }).catch(function (e) { self.setState({ loading: false, erro: EOJB.msg(e) }); });
  }
  carregar() { var self = this; return EOJB.clipes(true).then(function (l) { self.setState({ loading: false, lista: l }); }); }
  aviso(t) { var self = this; this.setState({ toast: t }); clearTimeout(this._t); this._t = setTimeout(function () { self.setState({ toast: '' }); }, 3500); }
  renderVals() {
    var self = this, st = this.state, f = this.f;
    function uniq(k) { return st.lista.map(function (c) { return c[k]; }).filter(function (x, i, a) { return x && a.indexOf(x) === i; }).sort(); }
    var op = {};
    Object.keys(OPCOES).forEach(function (k) {
      op[k] = OPCOES[k].map(function (l) { var on = f[k] === l;
        return { label: l, pressed: on ? 'true' : 'false', bg: on ? '#111111' : '#FFFFFF', fg: on ? '#FFFFFF' : '#111111', border: on ? '#111111' : '#CCCCCC',
          pick: function () { f[k] = on ? '' : l; self.setState({ v: st.v + 1 }); } }; });
    });
    var dl = {}; ['fase', 'conceito', 'posicao', 'nivel', 'equipe'].forEach(function (k) { dl[k] = uniq(k); });
    var lista = st.lista.map(function (c) {
      return { titulo: c.titulo, thumb: c.thumb || '', url: '/biblioteca/clipe?id=' + c.id,
        info: [c.momento, c.subtema, c.equipe, c.camera, c.duracao].filter(Boolean).join(' · '),
        status: c.publicado ? 'PUBLICADO' : 'OCULTO', stColor: c.publicado ? '#1E5B2C' : '#8C1D18', altLabel: c.publicado ? 'Ocultar' : 'Publicar',
        editar: function () {
          var n = vazio(); CAMPOS.forEach(function (k) { n[k] = c[k] || ''; }); n.id = c.id; n.publicado = c.publicado;
          n.link = 'https://vimeo.com/' + c.vimeo_id + (c.vimeo_hash ? '/' + c.vimeo_hash : '');
          self.f = n; self.setState({ ferr: '', v: st.v + 1 }); window.scrollTo({ top: 0, behavior: 'smooth' });
        },
        alternar: function () { EOJB.salvarClipe({ id: c.id, publicado: !c.publicado }).then(function () { self.aviso(c.publicado ? 'Clipe ocultado' : 'Clipe publicado'); return self.carregar(); }).catch(function (e) { self.aviso(EOJB.msg(e)); }); },
        excluir: function () { if (confirm('Excluir o clipe “' + c.titulo + '”? Ele sai do acervo e das playlists dos alunos. O vídeo continua no Vimeo.')) EOJB.excluirClipe(c.id).then(function () { self.aviso('Clipe excluído'); return self.carregar(); }).catch(function (e) { self.aviso(EOJB.msg(e)); }); } };
    });
    return {
      loading: st.loading, erro: st.erro, negado: !!st.negado, negadoMsg: st.negado, ok: !st.loading && !st.negado && !st.erro, toast: st.toast,
      f: f, op: op, dl: dl, pub: f.publicado ? 'true' : 'false', ferr: st.ferr, editando: !!f.id,
      formTitulo: f.id ? 'Editar clipe' : 'Novo clipe', btnSalvar: st.busy ? 'Salvando…' : f.id ? 'Salvar alterações' : 'Cadastrar clipe',
      set: function (e) { f[e.target.name] = e.target.value; },
      setPub: function (e) { f.publicado = e.target.checked; },
      novo: function () { self.f = vazio(); self.setState({ ferr: '', v: st.v + 1 }); },
      buscar: function () {
        var vm = EOJB.lerVimeo(f.link); if (!vm) return self.setState({ ferr: 'Não reconheci o link. Cole o endereço do vídeo, ex.: https://vimeo.com/123456789' });
        self.setState({ ferr: '' });
        EOJB.oembed(vm.id, vm.hash).then(function (d) {
          if (!f.titulo && d.title) f.titulo = d.title;
          if (d.duration) f.duracao = EOJB.dur(d.duration);
          if (d.thumbnail_url) f.thumb = d.thumbnail_url.replace(/_\d+x\d+/, '_640x400');
          self.setState({ v: st.v + 1 }); self.aviso('Dados do Vimeo carregados');
        }).catch(function () { self.setState({ ferr: 'O Vimeo não devolveu os dados deste vídeo. Confira se o link está certo e se a incorporação está liberada. Você pode preencher título e duração à mão.' }); });
      },
      salvar: function () {
        if (st.busy) return;
        var vm = EOJB.lerVimeo(f.link);
        if (!vm) return self.setState({ ferr: 'Cole o link do vídeo no Vimeo.' });
        if (!(f.titulo || '').trim()) return self.setState({ ferr: 'Dê um título ao clipe.' });
        var d = { id: f.id || undefined, vimeo_id: vm.id, vimeo_hash: vm.hash || null, publicado: !!f.publicado };
        CAMPOS.forEach(function (k) { if (k !== 'link') d[k] = (f[k] || '').trim() || null; });
        if (!d.id) delete d.id;
        self.setState({ busy: true, ferr: '' });
        EOJB.salvarClipe(d).then(function () { var era = !!f.id; self.f = vazio(); self.setState({ busy: false }); self.aviso(era ? 'Clipe atualizado' : 'Clipe cadastrado'); return self.carregar(); })
          .catch(function (e) { self.setState({ busy: false, ferr: EOJB.msg(e) }); });
      },
      lista: lista, n: lista.length, vazio: lista.length === 0,
      pasta: this._pasta, setPasta: function (e) { self._pasta = e.target.value; try { localStorage.setItem('eoj-pasta-vimeo', self._pasta); } catch (x) {} },
      impBtn: st.imp ? 'Importando…' : 'Importar vídeos novos', impMsg: st.impMsg,
      importar: function () {
        if (st.imp) return;
        var m = String(self._pasta || '').match(/folder\/(\d+)/) || String(self._pasta || '').match(/^\s*(\d+)\s*$/);
        if (!m) return self.setState({ impMsg: 'Cole o link da pasta, ex.: https://vimeo.com/user/123/folder/12345678' });
        self.setState({ imp: true, impMsg: 'Lendo a pasta no Vimeo…' });
        var ja = {}; st.lista.forEach(function (c) { ja[c.vimeo_id] = true; });
        EOJB.videosDaPasta(m[1]).then(function (vs) {
          var novos = vs.filter(function (v) { return v.id && !ja[v.id]; });
          if (!novos.length) return self.setState({ imp: false, impMsg: vs.length + ' vídeos na pasta, nenhum novo para importar.' });
          var linhas = novos.map(function (v) {
            var c = EOJB.lerNome(v.nome);
            c.vimeo_id = v.id; c.vimeo_hash = v.hash || null; c.duracao = v.duracao ? EOJB.dur(v.duracao) : null; c.thumb = v.thumb || null; c.publicado = false;
            return c;
          });
          return EOJB.inserirVarios(linhas).then(function () {
            self.setState({ imp: false, impMsg: linhas.length + (linhas.length === 1 ? ' vídeo importado' : ' vídeos importados') + ' como ocultos. Revise os filtros de cada um (Editar) e clique em “Publicar”.' });
            return self.carregar();
          });
        }).catch(function (e) {
          var msg = { sem_token: 'A chave do Vimeo ainda não foi configurada no Supabase.', admin: 'Só administradores podem importar.', login: 'Sua sessão expirou. Entre de novo.', pasta: 'Pasta não informada.' }[e.codigo]
            || (/vimeo 404/.test(e.message) ? 'Pasta não encontrada no Vimeo. Confira o link.' : 'Não foi possível ler a pasta agora. Tente de novo em instantes.');
          self.setState({ imp: false, impMsg: msg });
        });
      }
    };
  }
}
EOJ.mount(typeof Component !== 'undefined' ? Component : null);
</script>
