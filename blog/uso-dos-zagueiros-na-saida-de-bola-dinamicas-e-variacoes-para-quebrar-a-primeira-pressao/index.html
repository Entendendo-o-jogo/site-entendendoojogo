<h1 style="margin: 0; font-weight: 800; font-size: 42px; line-height: 1.1">Uso dos zagueiros na saída de bola: dinâmicas e variações para quebrar a primeira pressão</h1>
<p style="margin: 0; font-size: 15px; color: #555555">Por <strong style="color: #111111">Ítalo Resende</strong> · 5 de outubro de 2026 · 5 min de leitura</p>
<img src="/assets/c23bfa98e8f1d270eb5296e482c59d26.jpg" alt="" style="width: 100%; height: auto; display: block; border-radius: 14px">
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Este é um tema que foi debatido em uma das Masterclasses do PLANO BASIC do EOJhub.</p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Há uma transformação profunda na função do zagueiro. Do futebol antigo ao moderno, essa posição passou por uma revolução nos mais diversos aspectos, do físico ao tático. Antigamente, o que se esperava dessa posição era que a força prevalecesse: a função era apenas destruir jogadas e não deixar o atacante fazer nada. Hoje, os zagueiros são construtores e iniciadores do jogo, os primeiros armadores da equipe.</p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Se pensarmos num quadro mais recente dos últimos anos, a saída de bola padrão segue um certo roteiro: quando a bola chega ao goleiro, os zagueiros dão amplitude, alargam o campo e abrem a linha de passe para fora, gerando apoio lateral na largura e ficando, defensivamente, atrás da linha da bola. É uma solução coerente, segura e que pode ser contrária à progressão. Isso gera menos pontos de passe para o ataque porque sua maior intenção é abrir o corredor central para que os médios venham dar suporte por dentro. A ocupação desse espaço lateral merece, contudo, certo questionamento e observação.</p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Algumas equipes europeias vêm construindo uma ideia diferente. Em vez de os zagueiros realizarem o movimento de andar para trás e dar amplitude lateral, eles agora exploram o jogo em progressão invadindo o meio pelas costas de quem pressiona, principalmente em situações de recomeço com bola para trás.</p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">A equipe espanhola do Elche, no jogo contra o Barcelona, utilizou-se de tal conceito. No momento de saída de bola, os dois zagueiros estão por dentro, o primeiro tem a posse da bola e tempo para pensar, o segundo, observando o comportamento do companheiro, já faz o movimento de invasão de meio para receber a bola em progressão, ganhando vantagem sobre o marcador e quebrando a primeira linha defensiva dos catalães.</p>
<figure style="margin: 8px 0; display: flex; flex-direction: column; gap: 8px"><img src="/assets/73f3b67d7defca159d435aaa9cb7168d.jpg" alt="" style="width: 100%; height: auto; display: block; border-radius: 10px; border: 1px solid #E2E2E2"></figure>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Imagem 1 – Uso dos zagueiros na saída por dentro, utilizando o meio do campo.</p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Perceba a diferença no quesito campo visual: quem chega de frente ao espaço enxerga, ao mesmo tempo, a trajetória da bola e o próprio espaço que vai ocupar, o que facilita a decisão do passe seguinte, enquanto no cenário anterior que comentamos (busca do médio pelo meio) quem recua enxerga apenas a bola e tem menor campo de visão. A saída pelo meio facilita um cenário de vantagem na linha seguinte do campo.</p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Em um outro momento dessa mesma ideia de início de jogo é possível notar o encaixe entre temporização e observação. O zagueiro pela direita percebe que o goleiro recebe a bola com certo tempo para pensar (o atacante do Barcelona ainda está um pouco longe) e o defensor oposto fornece a primeira linha de passe por dentro. Ele instantaneamente nota a zona do campo que pode invadir para receber em progressão, superando a primeira linha do Barcelona. Possivelmente numa saída tradicional (zagueiros abertos), o atacante da equipe blaugrana que fizesse o movimento de subida de fora para dentro, explorando a perna boa do goleiro, já conseguiria excluir qualquer possibilidade de saída curta.</p>
<figure style="margin: 8px 0; display: flex; flex-direction: column; gap: 8px"><img src="/assets/c29b1763ed9c91df754bcfc94a696743.jpg" alt="" style="width: 100%; height: auto; display: block; border-radius: 10px; border: 1px solid #E2E2E2"></figure>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Imagem 2 – O zagueiro oposto realiza a invasão de meio percebendo a linha de passe do seu companheiro com o goleiro.</p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Mais um detalhe que pode ser explorado nesse tipo de saída é o passe longo para os flancos. O uso dos dois “beques” por dentro abre uma linha de passe mais profunda e oportuna para os laterais, que conseguem receber a bola à frente, numa zona média do campo, favorecendo a verticalidade do jogo.</p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Imagem 3 – Com os zagueiros por dentro, os laterais acabam gerando uma nova linha de passe por fora na amplitude, recebendo a bola na zona média do campo.</p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Uma abordagem distinta de saída que também merece destaque: a busca no pé. O movimento lembra muito as saídas de bola do futsal, em que o fixo vai buscar a bola “no pé” do goleiro, faz o primeiro passe e anda, atacando o espaço vazio, em vantagem sobre o defensor. No momento inicial podemos perceber que a marcação está encaixada com os dois atacantes marcando os dois defensores, no momento em que o zagueiro vai buscar a bola no pé do goleiro.</p>
<figure style="margin: 8px 0; display: flex; flex-direction: column; gap: 8px"><img src="/assets/c66f71eb05d32dd2357cb6796e152be4.jpg" alt="" style="width: 100%; height: auto; display: block; border-radius: 10px; border: 1px solid #E2E2E2"></figure>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Imagem 4 – Zagueiro indo buscar a bola no pé do goleiro para gerar aproximação e atração dos defensores.</p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">No instante seguinte, esse mesmo jogador anda nas costas dos dois atacantes num movimento ensaiado e recebe com campo aberto, em vantagem sobre os defensores. Além disso, os atacantes da equipe contrária acabam possivelmente em zona de impedimento: foram atraídos para perto do goleiro e ficaram à frente do penúltimo defensor. A manobra transforma um problema defensivo aparente, a aproximação de três adversários em torno da bola, em um mecanismo de vantagem.</p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Imagem 5 – O defensor invade o espaço vazio pelas costas dos atacantes recebendo em progressão. Note que os atacantes ficam em zona de impedimento.</p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Em resumo, três pontos de observação devem ser destacados sobre as abordagens apresentadas. Em primeiro lugar, esse modo de uso dos zagueiros acaba gerando mais jogadores à frente da linha da bola, com possibilidade concreta de uma vantagem como 10 contra 8 no restante do campo. Segundo: a equipe fica mais compacta no campo, já que os jogadores do meio precisam descer menos para criar. Terceiro: os atacantes ficam com tendência a impedimento e não têm o costume de pressionar esse tipo de situação. Além disso, pode-se destacar ainda um último detalhe: a temporização é primordial; é ela que vai definir a variação no ritmo de deslocamento do defensor e as novas possibilidades de desmarque.</p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Com todos os conceitos e abordagens apresentadas, é sempre bom lembrar que a saída de bola não é um manual fechado: cada equipe precisa encontrar o modelo que faz sentido para as suas peças.</p>
