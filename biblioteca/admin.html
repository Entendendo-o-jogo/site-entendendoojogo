<section style="background: #111111; color: #FFFFFF; border-top: 1px solid #2A2A2A"><div style="max-width: 1240px; margin: 0 auto; padding: 44px 32px 48px; display: flex; flex-direction: column; gap: 18px"><div style="display: flex; flex-direction: column; gap: 8px"><p style="margin: 0; color: #A1C4E6; font-weight: 600; font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase">Biblioteca EOJ · painel</p><h1 style="margin: 0; font-weight: 800; font-size: 44px; line-height: 1; text-transform: uppercase">Painel de clipes</h1></div><p style="margin: 0; font-size: 16px; color: #CFCFCF; max-width: 720px">Suba o vídeo no Vimeo (privacidade “Não listado” ou “Ocultar do Vimeo” com incorporação liberada para entendendoojogo.com.br), cole o link aqui e preencha os filtros.</p></div></section><div style="max-width: 1100px; margin: 0 auto; padding: 36px 32px 90px; display: flex; flex-direction: column; gap: 30px"><sc-if value="{{loading}}" hint-placeholder-val="{{ false }}"><p role="status" style="margin: 0; padding: 40px 0; color: #555555; font-size: 15px">Carregando…</p></sc-if><sc-if value="{{erro}}" hint-placeholder-val="{{ false }}"><p role="alert" style="margin: 0; background: #FCEDEC; color: #8C1D18; border-radius: 10px; padding: 14px 16px; font-size: 15px">{{erro}}</p></sc-if><sc-if value="{{negado}}" hint-placeholder-val="{{ false }}"><div style="background: #FFFFFF; border: 1px solid #E2E2E2; border-radius: 12px; padding: 28px; display: flex; flex-direction: column; gap: 12px"><p style="margin: 0; font-size: 16px">{{negadoMsg}}</p><a href="/biblioteca/entrar?volta=%2Fbiblioteca%2Fadmin" style="font: inherit; font-size: 15px; font-weight: 700; background: #A1C4E6; color: #111111; border: 0; border-radius: 8px; padding: 13px 20px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; align-self: flex-start">Entrar</a></div></sc-if><sc-if value="{{ok}}" hint-placeholder-val="{{ true }}"><section style="background: #FFFFFF; border: 1px solid #E2E2E2; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 14px"><div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px"><h2 style="margin: 0; font-size: 20px; font-weight: 800; text-transform: uppercase">Contas <span style="color: #555555; font-weight: 600">({{nContas}})</span></h2><button type="button" onClick="{{baixarCsv}}" style="font: inherit; font-size: 15px; font-weight: 600; background: #FFFFFF; color: #111111; border: 1.5px solid #CCCCCC; border-radius: 8px; padding: 12px 18px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px">Baixar planilha (CSV)</button></div><p style="margin: 0; font-size: 15px; color: #555555">{{contasResumo}}</p><div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{porFuncao}}" as="f" hint-placeholder-count="3"><span style="font-size: 13px; background: #E6EFF8; color: #3A6894; padding: 6px 11px; border-radius: 99px">{{f.nome}} · <strong>{{f.n}}</strong></span></sc-for></div><label class="bib-lb" style="max-width: 420px">Buscar por nome ou e-mail<input class="bib-in" name="buscaConta" type="search" value="{{buscaConta}}" onInput="{{setBuscaConta}}"></label><div style="overflow-x: auto; border: 1px solid #E2E2E2; border-radius: 8px; max-height: 420px; overflow-y: auto"><div style="min-width: 760px; font-size: 14px"><div style="display: grid; grid-template-columns: 1.3fr 1.6fr 1.2fr 0.8fr 1fr 0.5fr 0.6fr; gap: 10px; padding: 9px 12px; align-items: center; background: #F6F6F6; font-weight: 700"><span>Nome</span><span>E-mail</span><span>Atua como</span><span>Cadastro</span><span>Último acesso</span><span>Salvos</span><span>Playlists</span></div><sc-for list="{{contasLista}}" as="c" hint-placeholder-count="3"><div style="display: grid; grid-template-columns: 1.3fr 1.6fr 1.2fr 0.8fr 1fr 0.5fr 0.6fr; gap: 10px; padding: 9px 12px; align-items: center; border-top: 1px solid #EFEFEF"><span style="font-weight: 600">{{c.nome}}</span><span style="overflow-wrap: anywhere">{{c.email}}</span><span>{{c.funcao}}</span><span style="white-space: nowrap">{{c.cadastro}}</span><span style="white-space: nowrap">{{c.acesso}}</span><span>{{c.favoritos}}</span><span>{{c.playlists}}</span></div></sc-for></div></div><p style="margin: 0; font-size: 13px; color: #777777">Dados pessoais: use só para falar com os alunos sobre a Biblioteca e o EOJ, como diz a política de privacidade.</p></section><section id="pedidos" style="background: #FFFFFF; border: 1px solid #E2E2E2; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 14px; scroll-margin-top: 100px"><h2 style="margin: 0; font-size: 20px; font-weight: 800; text-transform: uppercase">Pedidos dos alunos <span style="color: #555555; font-weight: 600">({{nPedAbertos}} em aberto)</span></h2><p style="margin: 0; font-size: 14px; color: #555555">Os alunos pedem vídeos na Minha área. Ao cadastrar um clipe que atende um pedido, marque o pedido no formulário: o aluno recebe um aviso com o link.</p><sc-if value="{{semPed}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; font-size: 15px; color: #555555">Nenhum pedido em aberto.</p></sc-if><ul style="list-style: none; margin: 0; padding: 0"><sc-for list="{{pedAbertos}}" as="pd" hint-placeholder-count="2"><li style="display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 12px 0; border-top: 1px solid #EFEFEF"><span style="flex: 1 1 360px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px">{{pd.texto}}</span><span style="font-size: 13px; color: #555555">{{pd.quem}} · {{pd.quando}}</span></span><button type="button" onClick="{{pd.arquivar}}" style="font: inherit; font-size: 14px; font-weight: 600; color: #4A79A6; background: none; border: 0; padding: 8px 4px; cursor: pointer">Encerrar sem vídeo</button></li></sc-for></ul></section><section style="background: #FFFFFF; border: 1px solid #E2E2E2; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 14px"><h2 style="margin: 0; font-size: 20px; font-weight: 800; text-transform: uppercase">Importar da pasta do Vimeo</h2><p style="margin: 0; font-size: 15px; line-height: 1.55; color: #555555">Traz de uma vez todos os vídeos da pasta que ainda não estão na Biblioteca. Eles entram <strong>ocultos</strong>: confira os filtros de cada um e clique em “Publicar”. O nome do arquivo já preenche parte dos filtros: começando com sistema (ex.: 4-3-3) vira “Sistemas táticos”; começando com posição (ex.: Lateral) vira “Tática individual”. Palavras de fase também preenchem os filtros: bolas paradas (arremesso lateral, escanteio, falta frontal, falta lateral — com “ofensivo” ou “defensivo”), organização ofensiva (saída de bola, construção, finalização) e organização defensiva (bloco alto, bloco médio, bloco baixo). A última parte do nome (depois do último “_”) vira a Equipe; se for um jogador, escreva “jogador” antes (ex.: …_jogador Yamal) ou use um jogador já cadastrado, e ela vai para o campo Jogador.</p><div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end"><label class="bib-lb" style="flex: 1 1 320px">Link da pasta da Biblioteca no Vimeo<input class="bib-in" name="pasta" type="text" placeholder="https://vimeo.com/user/…/folder/12345678" value="{{pasta}}" onInput="{{setPasta}}"></label><button type="button" onClick="{{importar}}" style="font: inherit; font-size: 15px; font-weight: 700; background: #A1C4E6; color: #111111; border: 0; border-radius: 8px; padding: 13px 20px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px">{{impBtn}}</button></div><sc-if value="{{impMsg}}" hint-placeholder-val="{{ false }}"><p role="status" style="margin: 0; font-size: 15px; background: #E6EFF8; color: #3A6894; border-radius: 8px; padding: 12px 14px">{{impMsg}}</p></sc-if></section><section style="display: flex; flex-direction: column; gap: 6px"><div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px"><h2 style="margin: 0; font-size: 20px; font-weight: 800; text-transform: uppercase">Clipes cadastrados ({{n}})</h2><sc-if value="{{temOcultos}}" hint-placeholder-val="{{ false }}"><div style="display: flex; flex-wrap: wrap; gap: 10px"><button type="button" onClick="{{revisarOcultos}}" style="font: inherit; font-size: 15px; font-weight: 600; background: #FFFFFF; color: #111111; border: 1.5px solid #CCCCCC; border-radius: 8px; padding: 12px 18px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px">Revisar os ocultos um a um</button><button type="button" onClick="{{publicarTodos}}" style="font: inherit; font-size: 15px; font-weight: 700; background: #A1C4E6; color: #111111; border: 0; border-radius: 8px; padding: 13px 20px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px">{{pubTodosBtn}}</button></div></sc-if></div><div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center"><div style="flex: 1 1 380px; display: flex; align-items: center; gap: 10px; background: #FFFFFF; border: 1.5px solid #CCCCCC; border-radius: 10px; padding: 0 14px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#555555" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg><input type="search" value="{{bq}}" onInput="{{onBusca}}" onChange="{{onBusca}}" placeholder="Buscar clipe por título, equipe, jogador, momento, fase…" aria-label="Buscar clipes" style="flex: 1 1 auto; min-width: 0; border: 0; outline: none; font: inherit; font-size: 15px; padding: 13px 0; background: transparent"></div><select value="{{bst}}" onChange="{{onBst}}" aria-label="Mostrar" style="font: inherit; font-size: 15px; padding: 12px       audLista: (st.aud ? st.aud.alvo : []).map(function (v) {
        var priv = { disable: 'Somente incorporado', unlisted: 'Não listado', password: 'Senha', nobody: 'Privado', users: 'Privado', contacts: 'Privado' }[v.view] || v.view;
        return { nome: v.nome, info: [v.pastaNome || 'sem pasta', priv, v.embed === 'whitelist' ? 'domínios já restritos' : 'incorpora em qualquer lugar', v.download ? 'download ligado' : ''].filter(Boolean).join(' · ') };
      }),
      auditar: function () {
        if (st.audBusy || st.protBusy) return;
        var m = String(self._pasta || '').match(/folder\/(\d+)/);
        if (!m) return self.setState({ audMsg: 'Cole primeiro o link da pasta da Biblioteca em “Importar da pasta do Vimeo”, para ela ficar de fora.' });
        self.setState({ audBusy: true, audMsg: 'Lendo todos os vídeos da conta no Vimeo…', aud: null, protDone: false });
        EOJB.auditarVimeo(m[1]).then(function (d) {
          self.setState({ audBusy: false, aud: d, audMsg: d.alvo.length ? d.alvo.length + ' de ' + d.total + ' vídeos ainda podem ser incorporados em qualquer site ou têm download ligado. Confira a lista abaixo.' : 'Tudo certo: os ' + d.total + ' vídeos já estão protegidos (fora os públicos e a Biblioteca).' });
        }).catch(function (e) { self.setState({ audBusy: false, audMsg: e.codigo === 'admin' ? 'Só administradores.' : 'Não foi possível ler o Vimeo agora. Tente de novo em instantes.' }); });
      },
      proteger: function () {
        if (st.protBusy || !st.aud) return;
        var ids = st.aud.alvo.map(function (v) { return v.id; });
        if (!confirm('Proteger ' + ids.length + ' vídeos? Eles vão tocar só no EOJHub e o download será desligado.')) return;
        var feitos = 0, falhas = [], i = 0;
        self.setState({ protBusy: true, protN: 0, audMsg: 'Protegendo… não feche esta página.' });
        function passo() {
          if (i >= ids.length) {
            self.setState({ protBusy: false, protDone: true, audMsg: feitos + ' vídeos protegidos.' + (falhas.length ? '\n' + falhas.length + ' com erro (rode “Verificar vídeos” de novo para tentar só esses).' : '') });
            return;
          }
          var lote = ids.slice(i, i + 10);
          EOJB.protegerVimeo(lote).then(function (d) {
            if (!d.feitos.length && d.falhas.some(function (f) { return /vimeo 40[13]/.test(f.erro); })) {
              var det = (d.falhas[0] && d.falhas[0].erro) || '';
              return self.setState({ protBusy: false, audMsg: 'O Vimeo recusou a alteração (' + feitos + '/' + ids.length + ' feitos). Normalmente é a chave sem a permissão “Edit”.\nResposta do Vimeo: ' + det });
            }
            feitos += d.feitos.length; i += d.feitos.length;
            var lim = d.falhas.filter(function (f) { return f.erro === 'limite'; }).length;
            d.falhas.filter(function (f) { return f.erro !== 'limite'; }).forEach(function (f) { falhas.push(f); i++; });
            self.setState({ protN: feitos });
            setTimeout(passo, lim ? 60000 : 800);
            if (lim) self.setState({ audMsg: 'O Vimeo pediu uma pausa. Continuando em 1 minuto… (' + feitos + '/' + ids.length + ')' });
          }).catch(function (e) { self.setState({ protBusy: false, audMsg: 'Parou em ' + feitos + '/' + ids.length + '. ' + (e.codigo === 'falha' ? 'Confira se a chave do Vimeo tem a permissão “Edit”.' : 'Tente de novo em instantes.') }); });
        }
        passo();
      },
      pasta: this._pasta, setPasta: function (e) { self._pasta = e.target.value; try { localStorage.setItem('eoj-pasta-vimeo', self._pasta); } catch (x) {} },
      impBtn: st.imp ? 'Importando…' : 'Importar vídeos novos', impMsg: st.impMsg,
      importar: function () {
        if (st.imp) return;
        var m = String(self._pasta || '').match(/folder\/(\d+)/) || String(self._pasta || '').match(/^\s*(\d+)\s*$/);
        if (!m) return self.setState({ impMsg: 'Cole o link da pasta, ex.: https://vimeo.com/user/123/folder/12345678' });
        self.setState({ imp: true, impMsg: 'Lendo a pasta no Vimeo…' });
        var ja = {}, jogs = []; st.lista.forEach(function (c) { ja[c.vimeo_id] = true; if (c.jogador && jogs.indexOf(c.jogador) < 0) jogs.push(c.jogador); });
        EOJB.videosDaPasta(m[1]).then(function (vs) {
          var novos = vs.filter(function (v) { return v.id && !ja[v.id]; });
          if (!novos.length) return self.setState({ imp: false, impMsg: vs.length + ' vídeos na pasta, nenhum novo para importar.' });
          var linhas = novos.map(function (v) {
            var c = EOJB.lerNome(v.nome, jogs);
            c.vimeo_id = v.id; c.vimeo_hash = v.hash || null; c.duracao = v.duracao ? EOJB.dur(v.duracao) : null; c.thumb = v.thumb || null; c.publicado = false;
            return c;
          });
          return EOJB.inserirVarios(linhas).then(function () {
            self.setState({ imp: false, impMsg: linhas.length + (linhas.length === 1 ? ' vídeo importado' : ' vídeos importados') + ' como ocultos. Revise os filtros (Editar) e publique um a um ou todos de uma vez no botão “Publicar todos os ocultos”, em Clipes cadastrados.' });
            return self.carregar();
          });
        }).catch(function (e) {
          var msg = { sem_token: 'A chave do Vimeo ainda não foi configurada no Supabase.', admin: 'Só administradores podem importar.', login: 'Sua sessão expirou. Entre de novo.', pasta: 'Pasta não informada.' }[e.codigo]
            || (/vimeo 404/.test(e.message) ? 'Pasta não encontrada no Vimeo. Confira o link.' : 'Não foi possível ler a pasta agora. Tente de novo em instantes.');
          self.setState({ imp: false, impMsg: msg });
        });
      }
    };
  }
}
EOJ.mount(typeof Component !== 'undefined' ? Component : null);
</script>

<button type="button" data-eoj-cookies="aceito" style="font: inherit; font-weight: 700; background: #A1C4E6; color: #111111; border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer">Aceitar</button>

<script>
(function () {
  var box = document.getElementById('eoj-consent');
  var v = null; try { v = localStorage.getItem('eoj-cookies'); } catch (e) {}
  if (!v) { box.hidden = false; box.style.display = 'flex'; }
  window.eojCookies = function () { box.hidden = false; box.style.display = 'flex'; };
  box.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-eoj-cookies]'); if (!b) return;
    var c = b.getAttribute('data-eoj-cookies');
    try { localStorage.setItem('eoj-cookies', c); } catch (e) {}
    box.hidden = true; box.style.display = 'none';
    if (c === 'aceito') window.eojLoadGA();
    else if (window.__eojMkt) { try { location.reload(); } catch (e) {} }
  });
})();
</script>
