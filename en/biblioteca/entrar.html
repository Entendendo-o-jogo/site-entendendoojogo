<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    var m = EOJB.param('modo');
    this.state = { gate: m === 'cadastro' ? 'cadastro' : 'entrar', nova: m === 'nova-senha', ok: false, nsErr: '' };
    this._ns = '';
  }
  componentDidMount() {
    var self = this;
    EOJB.sb.auth.onAuthStateChange(function (ev) { if (ev === 'PASSWORD_RECOVERY') self.setState({ nova: true }); });
    EOJB.ready.then(function () { self.setState({ ok: true }); });
  }
  renderVals() {
    var self = this, st = this.state;
    var volta = EOJB.param('volta') || EOJB.u('/biblioteca/acervo');
    if (!/^\/[^\/]/.test(volta)) volta = EOJB.u('/biblioteca/acervo');
    var g = EOJB.gate(this, function () { location.href = volta; });
    var logado = st.ok && !!EOJB.user && !st.nova;
    var v = {
      titulo: st.nova ? 'Create a new password' : st.gate === 'cadastro' ? 'Create your account' : st.gate === 'esqueci' ? 'Reset your password' : 'Sign in to your account',
      logado: logado, nome: EOJB.nome(), nova: st.nova, form: st.ok && !logado && !st.nova,
      ns: this._ns, setNs: function (e) { self._ns = e.target.value; }, nsErr: st.nsErr,
      salvarSenha: function () {
        if ((self._ns || '').length < 6) return self.setState({ nsErr: 'A senha precisa ter pelo menos 6 caracteres.' });
        EOJB.novaSenha(self._ns).then(function () { location.href = EOJB.u('/biblioteca/acervo'); }).catch(function (e) { self.setState({ nsErr: EOJB.msg(e) }); });
