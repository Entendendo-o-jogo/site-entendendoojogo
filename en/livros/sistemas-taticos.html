<section aria-labelledby="sobre-t">
<div style="max-width: 1240px; margin: 0 auto; padding: 72px 32px; display: flex; flex-direction: column; gap: 32px">
<p style="margin: 0; color: #4A79A6; font-weight: 600; font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase">About the book</p>
<h2 id="sobre-t" style="margin: 0; font-family: Montserrat, sans-serif; font-weight: 800; font-size: 36px; line-height: 1.05; text-transform: uppercase">Inside the book</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(440px, 1fr)); gap: 20px; align-items: start"><div style="background: #FFFFFF; border: 1px solid #E2E2E2; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 12px"><h3 style="margin: 0; font-size: 19px; font-weight: 800; text-transform: uppercase">How the idea was born</h3><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">The book “Sistemas Táticos” was born from the authors' shared passion, their deep command of the subject and an ongoing wish to record their own views and analyse the methods of great coaches.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">After the popular and commercial success of their first book, Situações Táticas de Jogo: Fase Ofensiva, the drive to record new studies was stronger than ever. A new book was certain to come, and there was no shortage of content. The real challenge was time — scarce amid football's draining routine — but it was won day by day through a burning desire to write.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">Although readers widely asked for a sequel focused strictly on the defensive phase, the authors chose to prioritise another topic that fascinates the football community: tactical systems. Going beyond theoretical utopia, the book's central aim is a practical approach you can apply every day. So it doesn't just detail playing structures, it dynamically unpacks the match-up between attacking and defensive systems, covering key concepts of both phases of the game.</p></div><div style="background: #FFFFFF; border: 1px solid #E2E2E2; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 12px"><h3 style="margin: 0; font-size: 19px; font-weight: 800; text-transform: uppercase">Technology serving knowledge: QR codes</h3><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">Since the first book, the reader's experience has been the top priority. That's why this new book keeps the interactive format that connects theory and practice.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">Illustrative videos: readers get video analyses with visual markings and dynamic captions detailing each tactical system covered.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">Practical access: every chapter has one or more QR codes. Just point your phone or tablet camera to go straight to the matching videos.</p></div><div style="background: #FFFFFF; border: 1px solid #E2E2E2; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 12px"><h3 style="margin: 0; font-size: 19px; font-weight: 800; text-transform: uppercase">Foreword by Eduardo Barroca</h3><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">The choice of foreword writer came from wanting someone who shares the authors' principles: the pursuit of progress in Brazilian football, personal development, spreading knowledge and tactical mastery.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">Besides being a dedicated student of the game and an established coach, Barroca is also a published author and a major reference for professionals who, like the authors, did not come through as professional players but earned their place in football through relentless study.</p></div></div>
</div>
</section>
