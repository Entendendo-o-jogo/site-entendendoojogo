      txtPedido: this._ped || '', setPedido: function (e) { self._ped = e.target.value; },
      pedir: function () { var t = (self._ped || '').trim(); if (t.length < 3) return self.aviso('Escribe tu pedido.'); EOJB.pedir(t).then(function () { self._ped = ''; self.aviso('Pedido enviado. Te avisaremos aquí cuando entre el vídeo.'); return self.carregar(); }).catch(function (e) { self.aviso(EOJB.msg(e)); }); },
      pedidos: (st.pedidos || []).map(function (p) { var at = p.status === 'atendido';
        return { texto: p.texto, quando: quando(p.criado_em), status: at ? 'Atendido' : p.status === 'arquivado' ? 'Cerrado' : 'En análisis', bg: at ? '#E3F1E6' : '#F0F0F0', fg: at ? '#1E5B2C' : '#555555',
          link: at && p.clipe_id ? EOJB.u('/biblioteca/clipe?id=') + p.clipe_id : '', podeApagar: p.status === 'aberto',
