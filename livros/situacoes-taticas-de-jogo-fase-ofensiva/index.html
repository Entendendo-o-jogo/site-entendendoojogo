<h1 style="margin: 0; font-weight: 800; font-size: 50px; line-height: 1.02; text-transform: uppercase">Situações Táticas de Jogo: Fase Ofensiva</h1>
<p style="margin: 0; color: #A1C4E6; font-weight: 700; font-size: 17px; text-transform: uppercase; letter-spacing: 0.04em">Italo Resende e Vinicius Xavier · prefácio de Paulo Calçade</p>
<p style="margin: 0; font-size: 18px; line-height: 1.6; color: #CFCFCF; max-width: 600px">O primeiro livro da coletânea: as situações táticas da fase ofensiva, da primeira fase de construção à ocupação da área.</p>
<div style="display: flex; flex-wrap: wrap; gap: 20px; margin-top: 4px"><div style="border-top: 2px solid #A1C4E6; padding-top: 12px; display: flex; flex-direction: column; gap: 2px; min-width: 150px; flex: 1 1 150px"><span style="font-weight: 800; font-size: 20px">4 capítulos</span><span style="font-size: 14px; color: #CFCFCF">da construção à ocupação da área</span></div><div style="border-top: 2px solid #A1C4E6; padding-top: 12px; display: flex; flex-direction: column; gap: 2px; min-width: 150px; flex: 1 1 150px"><span style="font-weight: 800; font-size: 20px">QR Codes</span><span style="font-size: 14px; color: #CFCFCF">com vídeos em cada capítulo</span></div><div style="border-top: 2px solid #A1C4E6; padding-top: 12px; display: flex; flex-direction: column; gap: 2px; min-width: 150px; flex: 1 1 150px"><span style="font-weight: 800; font-size: 20px">Futebol brasileiro</span><span style="font-size: 14px; color: #CFCFCF">em todos os exemplos em vídeo</span></div></div>

<section aria-labelledby="sobre-t">
<div style="max-width: 1240px; margin: 0 auto; padding: 72px 32px; display: flex; flex-direction: column; gap: 32px">
<p style="margin: 0; color: #4A79A6; font-weight: 600; font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase">Sobre o livro</p>
<h2 id="sobre-t" style="margin: 0; font-family: Montserrat, sans-serif; font-weight: 800; font-size: 36px; line-height: 1.05; text-transform: uppercase">Por dentro da obra</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(440px, 1fr)); gap: 20px; align-items: start"><div style="background: #FFFFFF; border: 1px solid #E2E2E2; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 12px"><h3 style="margin: 0; font-size: 19px; font-weight: 800; text-transform: uppercase">Sobre a ideia de escrever um livro</h3><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">O livro surgiu na pandemia. Italo Resende havia lançado o curso “Situações de Jogo”, e Vinicius Xavier, um dos alunos, sempre discutia com ele situações do curso e do jogo. As conversas rendiam debates que duravam dias.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">Numa dessas conversas surgiu a ideia do livro. Os autores assistiram a muitos jogos em busca de situações, dinâmicas, vantagens, desvantagens e pormenores de cada uma. O conteúdo ficou tão robusto que o projeto virou uma coletânea, e esta é a primeira obra.</p></div><div style="background: #FFFFFF; border: 1px solid #E2E2E2; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 12px"><h3 style="margin: 0; font-size: 19px; font-weight: 800; text-transform: uppercase">Tecnologia em prol do conhecimento: QR Codes</h3><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">Mais do que o conteúdo escrito, o leitor tem acesso a vídeos ilustrativos com ainda mais detalhes sobre as situações táticas discutidas no texto.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">Em cada capítulo há um ou mais QR Codes. Basta apontar a câmera do celular para ver os vídeos relacionados ao que acabou de ler e fixar o conteúdo com exemplos reais.</p></div><div style="background: #FFFFFF; border: 1px solid #E2E2E2; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 12px"><h3 style="margin: 0; font-size: 19px; font-weight: 800; text-transform: uppercase">Valorização do futebol brasileiro</h3><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">Para fazer parte do movimento de melhora do futebol nacional, todos os vídeos dos QR Codes foram retirados de partidas que envolvem uma equipe brasileira ou a seleção brasileira.</p></div><div style="background: #FFFFFF; border: 1px solid #E2E2E2; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 12px"><h3 style="margin: 0; font-size: 19px; font-weight: 800; text-transform: uppercase">Prefácio de Paulo Calçade</h3><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">A ideia era que o prefácio fosse escrito por alguém relevante no futebol brasileiro, que valorizasse o consumo e a produção de conhecimento no país. Paulo Calçade, jornalista da ESPN, estudioso do futebol e crítico de grande valor nesse movimento, foi o nome ideal.</p></div></div>
</div>

px; border-left: 2px solid #E2E2E2">2.1. Como favorecer o aparecimento de situações de jogo por dentro</li><li style="break-inside: avoid; font-size: 15px; line-height: 1.5; color: #333333; padding: 4px 0 4px 14px; border-left: 2px solid #E2E2E2">2.1.1 Utilização do entrelinhas através da intralinha</li><li style="break-inside: avoid; font-size: 15px; line-height: 1.5; color: #333333; padding: 4px 0 4px 14px; border-left: 2px solid #E2E2E2">2.1.2. Criação do entrelinhas e utilização do intralinha</li><li style="break-inside: avoid; font-size: 15px; line-height: 1.5; color: #333333; padding: 4px 0 4px 14px; border-left: 2px solid #E2E2E2">2.1.3. Criação do intralinha para utilização do entrelinhas</li><li style="break-inside: avoid; font-size: 15px; line-height: 1.5; color: #333333; padding: 4px 0 4px 14px; border-left: 2px solid #E2E2E2">2.1.4. Explorar a linha média por fora para utilização do entrelinhas</li><li style="break-inside: avoid; font-size: 15px; line-height: 1.5; color: #333333; padding: 4px 0 4px 14px; border-left: 2px solid #E2E2E2">2.2. Como favorecer o aparecimento de situações de jogo por fora</li><li style="break-inside: avoid; font-size: 15px; line-height: 1.5; color: #333333; padding: 4px 0 4px 14px; border-left: 2px solid #E2E2E2">2.2.1. Circulação</li><li style="break-inside: avoid; font-size: 15px; line-height: 1.5; color: #333333; padding: 4px 0 4px 14px; border-left: 2px solid #E2E2E2">2.2.2. Inversões longas</li><li style="break-inside: avoid; font-size: 15px; line-height: 1.5; color: #333333; padding: 4px 0 4px 14px; border-left: 2px solid #E2E2E2">2.2.3. Apoio frontal (desmarque de apoio)</li><li style="break-inside: avoid; font-size: 15px; line-height: 1.5; color: #333333; padding: 4px 0 4px 14px; border-left: 2px solid #E2E2E2">2.2.4. Apoio frontal com tabela</li><li style="break-inside: avoid; font-size: 15px; line-height: 1.5; color: #333333; padding: 4px 0 4px 14px; border-left: 2px solid #E2E2E2">Ultrapassagens (por fora e por dent
