<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { loading: true, erro: '', clipes: {}, favIds: [], pls: [], toast: '', mov: null, baixando: null }; this._nova = ''; }
  componentDidMount() {
    var self = this;
    EOJB.ready.then(function () {
      if (!EOJB.user) { location.replace('/biblioteca/entrar?volta=' + encodeURIComponent('/biblioteca/minha-area')); return; }
      return self.carregar().then(function () { if (location.hash === '#playlists') setTimeout(function () { var el = document.getElementById('playlists'); if (el) el.scrollIntoView({ behavior: 'smooth' }); }, 200); });
    }).catch(function (e) { self.setState({ loading: false, erro: EOJB.msg(e) }); });
  }
  carregar() {
    var self = this;
    return Promise.all([EOJB.clipes(), EOJB.favIds(), EOJB.playlists()]).then(function (r) {
      var m = {}; r[0].forEach(function (c) { m[c.id] = c; });
      self.setState({ loading: false, clipes: m, favIds: r[1], pls: r[2] });
    });
  }
  aviso(t) { var self = this; this.setState({ toast: t }); clearTimeout(this._t); this._t = setTimeout(function () { self.setState({ toast: '' }); }, 3500); }
  renderVals() {
    var self = this, st = this.state, M = st.clipes;
    function item(c, tirar, label, origem) {
      var chave = (origem ? origem.id : 'fav') + ':' + c.id, aberto = st.mov === chave;
      var destinos = st.pls.filter(function (p) { return !origem || p.id !== origem.id; }).map(function (p) {
        return { nome: p.nome, ir: function () {
          var ja = (p.playlist_clipes || []).some(function (x) { return x.clipe === c.id; });
          var passo = ja ? Promise.resolve() : EOJB.adicionar(p.id, c.id);
          passo.then(function () { return origem ? EOJB.remover(origem.id, c.id) : null; })
            .then(function () { self.setState({ mov: null }); self.aviso((origem ? 'Movido para “' : 'Adicionado a “') + p.nome + '”'); return self.carregar(); })
            .catch(function (e) { self.aviso(EOJB.msg(e)); });
        } };
      });
      return { titulo: c.titulo, thumb: c.thumb || '', url: '/biblioteca/clipe?id=' + c.id, tirar: tirar, tirarLabel: label,
        temMover: origem ? true : st.pls.length > 0, moverLabel: origem ? 'Trocar de playlist' : 'Adicionar a uma playlist',
        moverPergunta: origem ? 'Mover para qual playlist?' : 'Adicionar a qual playlist?',
        movendo: aberto, movendoAttr: aberto ? 'true' : 'false', destinos: destinos, semDestino: destinos.length === 0,
        abrirMover: function () { self.setState({ mov: aberto ? null : chave }); }, fecharMover: function () { self.setState({ mov: null }); } };
    }
    var favs = st.favIds.filter(function (id) { return M[id]; }).map(function (id) {
      return item(M[id], function () { EOJB.favoritar(id, false).then(function () { self.aviso('Removido dos favoritos'); return self.carregar(); }).catch(function (e) { self.aviso(EOJB.msg(e)); }); }, 'Remover');
    });
    var pls = st.pls.map(function (p) {
      var itens = (p.playlist_clipes || []).slice().sort(function (a, b) { return a.ordem - b.ordem; }).filter(function (x) { return M[x.clipe]; }).map(function (x) {
        return item(M[x.clipe], function () { EOJB.remover(p.id, x.clipe).then(function () { return self.carregar(); }).catch(function (e) { self.aviso(EOJB.msg(e)); }); }, 'Tirar da playlist', p);
      });
      var ids = itens.length ? (p.playlist_clipes || []).slice().sort(function (a, b) { return a.ordem - b.ordem; }).filter(function (x) { return M[x.clipe]; }).map(function (x) { return x.clipe; }) : [];
      var baixandoEsta = st.baixando && st.baixando.id === p.id;
      return { nome: p.nome, n: itens.length === 1 ? '1 clipe' : itens.length + ' clipes', itens: itens, vazia: itens.length === 0,
        podeBaixar: itens.length > 0, baixarLabel: baixandoEsta ? 'Baixando ' + st.baixando.n + '/' + ids.length + '…' : 'Baixar todos (' + itens.length + ')',
        baixar: function () {
          if (st.baixando) return;
          if (ids.length > 1 && !confirm('Baixar os ' + ids.length + ' clipes de “' + p.nome + '”? Os arquivos vão sendo baixados um por um. Se o navegador perguntar, permita baixar vários arquivos.')) return;
          self.setState({ baixando: { id: p.id, n: 0 } });
          EOJB.baixarVarios(ids, function (n) { self.setState({ baixando: { id: p.id, n: n } }); }).then(function (r) {
            self.setState({ baixando: null });
            self.aviso(r.falhas ? r.feitos + ' baixados · ' + r.falhas + ' não puderam ser baixados' : (r.feitos === 1 ? 'Download iniciado' : r.feitos + ' downloads iniciados'));
          });
        },
        renomear: function () { var n = prompt('Novo nome da playlist:', p.nome); if (n && n.trim()) EOJB.renomearPlaylist(p.id, n.trim()).then(function () { return self.carregar(); }).catch(function (e) { self.aviso(EOJB.msg(e)); }); },
        excluir: function () { if (confirm('Excluir a playlist “' + p.nome + '”? Os clipes continuam no acervo.')) EOJB.excluirPlaylist(p.id).then(function () { self.aviso('Playlist excluída'); return self.carregar(); }).catch(function (e) { self.aviso(EOJB.msg(e)); }); } };
    });
    var f = EOJB.perfil && EOJB.perfil.funcao;
    return {
      loading: st.loading, erro: st.erro, logged: !st.loading && !!EOJB.user, toast: st.toast,
      nome: EOJB.nome(), funcao: f ? ' · ' + f : '', admin: EOJB.isAdmin(),
      sair: function () { EOJB.sair().then(function () { location.href = '/biblioteca/acervo'; }); },
      favs: favs, nFav: favs.length, semFav: favs.length === 0,
      pls: pls, nPl: pls.length, semPl: pls.length === 0,
      novaPl: this._nova, setNovaPl: function (e) { self._nova = e.target.value; },
      criarPl: function () { var n = (self._nova || '').trim(); if (!n) return self.aviso('Dê um nome para a playlist.'); EOJB.novaPlaylist(n).then(function () { self._nova = ''; self.aviso('Playlist criada'); return self.carregar(); }).catch(function (e) { self.aviso(EOJB.msg(e)); }); }
    };
  }
}
EOJ.mount(typeof Component !== 'undefined' ? Component : null);
</script>
