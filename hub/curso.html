  constructor(props) { super(props); this.state = { loading: true, erro: '' }; }
  componentDidMount() {
    var self = this, slug = EOJB.param('c');
    if (!slug) return this.setState({ loading: false, erro: 'Curso não encontrado.' });
    EOJB.ready.then(function () { return Promise.all([EOJH.curso(slug), EOJH.matriculas(), EOJH.progresso()]); }).then(function (r) {
      if (!r[0]) return self.setState({ loading: false, erro: 'Curso não encontrado ou ainda não publicado.' });
      document.title = r[0].titulo + ' — Área do aluno EOJ';
      self.setState({ loading: false, c: r[0], acc: EOJH.acessos([r[0]], r[1]), prog: EOJH.mapaProgresso(r[2]) });
    }).catch(function (e) { self.setState({ loading: false, erro: EOJB.msg(e) }); });
  }
  renderVals() {
    var st = this.state, c = st.c, v = { loading: st.loading, erro: st.erro, tem: !!c };
    if (!c) return v;
