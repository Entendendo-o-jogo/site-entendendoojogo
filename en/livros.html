<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { nome: '', email: '', ok: false, sending: false, erro: '' }; }
  renderVals() {
    var self = this, st = this.state;
    var URL_LISTA = 'https://script.google.com/macros/s/AKfycbxmodmm8q1bcH-zWhGvC9ZopHqLj6fFKRUpFRNfrKkzp7qWgxb1GUGI491oZmBPyQ22Kw/exec';
    return {
      nome: st.nome, email: st.email, ok: st.ok, form: !st.ok, erro: st.erro,
      primeiro: (st.nome || '').trim().split(' ')[0],
      btn: st.sending ? 'Sending…' : 'Get my e-book',
      onNome: function (ev) { self.setState({ nome: ev.target.value, erro: '' }); },
      onEmail: function (ev) { self.setState({ email: ev.target.value, erro: '' }); },
      enviar: function (ev) {
        if (ev && ev.preventDefault) ev.preventDefault();
        var nm = (st.nome || '').trim(), em = (st.email || '').trim();
        if (nm.length < 2) { self.setState({ erro: 'Enter your name.' }); return; }
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) { self.setState({ erro: 'Enter a valid email.' }); return; }
        if (st.sending) return;
        self.setState({ sending: true, erro: '' });
        var body = new URLSearchParams({ email: em, nome: nm, origem: 'E-book bolas paradas Copa 2026 (EN) | Nome: ' + nm });
        fetch(URL_LISTA, { method: 'POST', mode: 'no-cors', body: body })
          .then(function () { self.setState({ ok: true, sending: false }); })
          .catch(function () { self.setState({ sending: false, erro: 'We could not send it right now. Please try again in a moment.' }); });
      }
    };
  }
}
EOJ.mount(typeof Component !== 'undefined' ? Component : null);
</script>
