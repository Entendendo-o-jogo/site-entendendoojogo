<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">Estes são os termos de uso e condições de serviço do “EntendendooJogo”, que tem por finalidade estabelecer as condições gerais de uso e compra de produtos e serviços do cliente do site Entendendo o Jogo.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">Ao acessar o site Entendendo o Jogo, você concorda em cumprir estes termos de uso e condições de serviço, todas as leis e regulamentos aplicáveis e concorda que é responsável pelo cumprimento de todas as leis locais aplicáveis. Se você não concordar com algum desses termos, está proibido de usar ou acessar este site. Os materiais contidos neste site são protegidos pelas leis de direitos autorais e marcas comerciais aplicáveis.</p><h2 style="margin: 18px 0 0; font-size: 22px; font-weight: 800">1 – Confidencialidade dos dados e informações</h2><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">1.1 – É de responsabilidade do Entendendo o Jogo a preservação da confidencialidade de todos os dados e informações fornecidos pelo cliente no processo de compra e/ou cadastro. O site foi desenvolvido sobre a plataforma WordPress e monitorado pela equipe de tecnologia do Entendendo o Jogo, e seguimos todas as recomendações de segurança fornecida por eles.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">1.2 – Em caso de compras e cadastros iniciados, você estará concordando com nosso Termo de Contrato e com os termos e condições de uso das empresas terceirizadas que mediam as formas de pagamento.</p><h2 style="margin: 18px 0 0; font-size: 22px; font-weight: 800">2. Política de entrega de produtos</h2><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">2.1 – Os nossos produtos são digitais e serão enviados ao cliente conforme especificado no site, por meio eletrônico com acesso via e-mail cadastrado quando no momento da compra/cadastro. Os clientes não receberão qualquer tipo de envio físico para sua residência ou qualquer outro lugar.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">2.1.1 – Após a finalização do pedido, não é possível alterar a forma de pagamento e/ou forma de envio, solicitar adiantamento ou, ainda, prioridade da entrega.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">2.1.2 – O prazo de entrega do serviço informado durante o procedimento de compra do Produto leva em consideração o processo de comprovantes e emissão da nota fiscal e outros procedimentos necessários.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">2.2– O cliente dispõe de Serviço de Atendimento ao Cliente (SAC) para sanar suas dúvidas, solucionar eventuais solicitações ou reclamações a respeito do seu pedido ou de qualquer conteúdo disponibilizado no site. O SAC poderá ser acionado por meio do e-mail entendendoojogo@gmail.com, pelo Instagram “@entendendoojogo” ou pelo whatsapp + 55 31 996552502.</p><h2 style="margin: 18px 0 0; font-size: 22px; font-weight: 800">3. Links para outros sites</h2><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">3.1 – O conteúdo de quaisquer sites que o cliente acessar a partir dos links indicados e disponibilizados pelo Entendendo o Jogo está totalmente fora do controle do próprio Entendendo o Jogo, sendo que o acesso e a permanência em tais sites se darão pela própria conta e risco do cliente. A inclusão destes links na página do Entendendo o Jogo não implica o endosso ou anuência a quaisquer produtos, serviços, conteúdo, informação ou materiais oferecidos por, ou acessível ao cliente nos sites de terceiros. O Entendendo o Jogo não será responsabilizado por qualquer eventual dano ou ocorrido e não assume qualquer obrigação com respeito a qualquer material contido em qualquer outro site. Quaisquer opiniões ou recomendações expressas nos outros sites são unicamente aquelas dos provedores independentes e não são, tampouco representam, as opiniões ou recomendações do Entendendo o Jogo.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">3.2 – Todos os direitos autorais e marcas comerciais acessíveis através dos links dos sites de terceiros são de propriedade dos respectivos donos dos sites ou dos seus licenciadores.</p><h2 style="margin: 18px 0 0; font-size: 22px; font-weight: 800">4. Direitos autorais</h2><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">4.1 – O conteúdo publicado no site do Entendendo o Jogo e outros trabalhos de autoria encontrados no site da empresa como parte dos produtos e serviços oferecidos estão protegidos pelas leis e tratados de direitos autorais nacionais e internacionais, assim como outras leis e tratados de propriedade intelectual. O conteúdo é licenciado, não vendido. O cliente não pode fazer cópias não autorizadas ou usar nenhum conteúdo, exceto como especificado neste site e de acordo com as leis aplicáveis.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">4.2 – O cliente não pode tentar reconfigurar, desmontar ou fazer engenharia reversa no site, nos produtos e serviços e/ou no conteúdo disponibilizado pelo Entendendo o Jogo. Todos os direitos autorais dos produtos e serviços (incluindo, mas não se limitando a imagens, fotografias, animações, vídeos, áudio, música, texto e layout incorporados nos produtos e serviços) são de propriedade do Entendendo o Jogo. O cliente concorda em cumprir com todas as leis de proteção dos direitos autorais relacionadas ao uso dos produtos e serviços.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">4.3 – O Entendendo o Jogo reserva-se o direito de tomar as medidas que julgar apropriadas, a seu exclusivo critério, a fim de proteger os direitos autorais de seus produtos e serviços, além das condições previstas nestes Termos de Uso.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">4.4 – O cliente concorda em não reproduzir, duplicar, copiar, vender, revender ou explorar com quaisquer fins comerciais, qualquer porção do conteúdo disponibilizado pelo Entendendo o Jogo, nem fazer uso do site ou do acesso para o fim de vendas de bens ou serviços, ou a promoção de uma companhia, bem ou serviço.</p><h2 style="margin: 18px 0 0; font-size: 22px; font-weight: 800">5- Marcas</h2><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">5.1 – Nenhum cliente está autorizado a utilizar nenhuma marca e/ou sinais distintivos encontrados no site, nos conteúdos disponibilizados e/ou nos serviços do Entendendo o Jogo. O cliente não pode copiar, exibir ou usar nenhuma das marcas comerciais sem consentimento prévio por escrito do seu proprietário. Qualquer uso não autorizado poderá violar as leis de propriedade industrial, leis de privacidade, de propriedade intelectual e ainda estatutos civis e/ou criminais.</p><h3 style="margin: 8px 0 0; font-size: 18px; font-weight: 700">5.2 – Uso de Licença</h3><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">5.2.1 – É concedida permissão para baixar temporariamente uma cópia dos materiais (informações) no site Entendendo o Jogo, apenas para visualização transitória pessoal e não comercial. Esta é a concessão de uma licença, não uma transferência de título e, sob esta licença, você não pode: modificar ou copiar os materiais; usar os materiais para qualquer finalidade comercial ou para exibição pública (comercial ou não comercial); tentar decompilar ou fazer engenharia reversa de qualquer software contido no site Entendendo o Jogo; remover quaisquer direitos autorais ou outras notações de propriedade dos materiais; ou transferir os materiais para outra pessoa ou ‘espelhe’ os materiais em qualquer outro servidor.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">5.2.2 – Esta licença será automaticamente rescindida se você violar alguma dessas restrições e poderá ser rescindida por Entendendo o Jogo a qualquer momento. Ao encerrar a visualização desses materiais ou após o término desta licença, você deve apagar todos os materiais baixados em sua posse, seja em formato eletrônico ou impresso.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">5.2.3 – Todos os direitos e licenças não concedidos expressamente nestes Termos de Uso são reservados aos proprietários dos conteúdos disponibilizados e/ou produtos e serviços da Entendendo o Jogo. Estes Termos de Uso não concedem quaisquer licenças implícitas.</p><h2 style="margin: 18px 0 0; font-size: 22px; font-weight: 800">6. Condições de uso no site</h2><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">6.1 – Comentários e Opiniões: O Entendendo o Jogo não se responsabiliza pelos comentários e opiniões expressas por clientes e usuários na textos do BLOG e nos comentários de Fórum durante os cursos organizados pelo Entendendo o Jogo. Quaisquer comentários ou opiniões expressas no campo de comentários do BLOG ou fórum de cursos do Entendendo o Jogo, são unicamente aquelas dos provedores independentes e não são, tampouco representam, as opiniões ou recomendações do Entendendo o Jogo.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">6.2 – Precisão dos materiais: Os materiais exibidos no site da Entendendo o Jogo podem incluir erros técnicos, tipográficos ou fotográficos. O Entendendo o Jogo não garante que qualquer material em seu site seja preciso, completo ou atual. O Entendendo o Jogo pode fazer alterações nos materiais contidos em seu site a qualquer momento, sem aviso prévio. No entanto, Entendendo o Jogo não se compromete a atualizar os materiais. Todas a imagens que não forem de propriedade do Entendendo o Jogo, terão suas fontes e referências citadas.</p><h2 style="margin: 18px 0 0; font-size: 22px; font-weight: 800">7. Modificações nos Termos de Uso</h2><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">7.1 – O Entendendo o Jogo pode revisar estes termos de uso do site a qualquer momento, sem aviso prévio. Então, por favor, revise-os com frequência. Alterações e esclarecimentos vão surtir efeito imediatamente após sua publicação no site. Ao usar este site, você concorda em ficar vinculado à versão atual desses termos de uso.</p><h2 style="margin: 18px 0 0; font-size: 22px; font-weight: 800">8. Outras informações</h2><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">8.1 – Casos omissos serão analisados pelo Entendendo o Jogo e acordados com o cliente.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">8.2 – As imagens do site são meramente ilustrativas, grátis para uso comercial e atribuição não requerida.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">8.3 – Para sanar qualquer dúvida sobre essas ou outras informações, dar sugestões ou fazer críticas, entre em contato enviando e-mail para entendendoojogo@gmail.com, pelo Instagram “@entendendoojogo” ou pelo whatsapp + 55 31 996552502.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">8.4 – Estes termos e condições são regidos e interpretados de acordo com as leis da República Federativa do Brasil e você se submete irrevogavelmente à jurisdição exclusiva dos tribunais naquele estado ou localidade.</p>
