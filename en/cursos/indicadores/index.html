izing: border-box"><svg width="30" height="24" viewBox="0 0 30 24" aria-hidden="true" style="flex: 0 0 auto"><path d="M0 24V14.4C0 6.2 4.4 1.4 12 0l1.4 3.4C9 4.8 6.8 7.6 6.6 11.4H12V24H0zm17 0V14.4C17 6.2 21.4 1.4 29 0l1 3.4c-4.4 1.4-6.6 4.2-6.8 8H29V24H17z" fill="#A1C4E6"></path></svg><blockquote style="margin: 0; flex: 1 1 auto; font-size: 15px; line-height: 1.65; color: #333333">Understanding football is essential for everyone who works in the sport, referees included. Taking the “Entendendo o Jogo” course has helped me a lot professionally to combine understanding of the game with the laws of football. I highly recommend it.</blockquote><figcaption style="display: flex; align-items: center; gap: 14px; border-top: 1px solid #EDEDED; padding-top: 18px; min-height: 66px"><span style="width: 64px; height: 64px; border-radius: 10px; overflow: hidden; background: #A1C4E6; flex: 0 0 auto; display: block"><img src="/assets/649cfcd45e763e5fd3f250d50d21a678.jpg" alt="Renata Ruel" style="width: 100%; height: 100%; object-fit: cover; object-position: center 20%; display: block; filter: grayscale(1) contrast(1.08); mix-blend-mode: multiply"></span><span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-weight: 700; font-size: 16px; color: #111111">Renata Ruel</span><span style="font-size: 14px; color: #555555">Commentator for ESPN and Star+</span></span></figcaption></figure><figure style="margin: 0; background: #FFFFFF; border: 1px solid #E2E2E2; border-radius: 14px; padding: 26px 26px 22px; display: flex; flex-direction: column; gap: 18px; box-sizing: border-box"><svg width="30" height="24" viewBox="0 0 30 24" aria-hidden="true" style="flex: 0 0 auto"><path d="M0 24V14.4C0 6.2 4.4 1.4 12 0l1.4 3.4C9 4.8 6.8 7.6 6.6 11.4H12V24H0zm17 0V14.4C17 6.2 21.4 1.4 29 0l1 3.4c-4.4 1.4-6.6 4.2-6.8 8H29V24H17z" fill="#A1C4E6"></path></svg><blockquote style="margin: 0; flex: 1 1 auto; font-size: 15px; line-height: 1.65; color: #333333">I recommend t
