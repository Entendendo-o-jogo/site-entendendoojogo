    v.coms = lista.map(function (par) {
      var x = par[0];
      return { autor: x.autor || 'Aluno', professor: !!x.professor, quando: EOJH.quando(x.criado_em), texto: x.texto, recuo: par[1],
        min: x.minuto != null ? EOJB.dur(x.minuto) : '', ir: ir(x.minuto || 0), podeResp: !par[1], podeApagar: x.meu || EOJB.isAdmin(),
        responder: function () { self.setState({ resp: x }); var t = document.getElementById('com'); if (t) { t.scrollIntoView({ behavior: 'smooth', block: 'center' }); t.focus(); } },
        apagar: function () { if (!confirm('Apagar este comentário?')) return; EOJH.apagarComentario(x.id).then(function () { return self.recarregar(); }).catch(function (e) { self.aviso(EOJB.msg(e)); }); } };
    });
    v.semCom = st.coms.length === 0;
    v.respondendo = st.resp ? (st.resp.autor || 'Aluno') : ''; v.cancelarResp = function () { self.setState({ resp: null }); };
    v.txtCom = this._com; v.setCom = function (e) { self._com = e.target.value; };
    v.citar = st.citar ? 'true' : ''; v.setCitar = function (e) { self.setState({ citar: e.target.checked }); };
    v.comentar = function () {
      var t = (self._com || '').trim(); if (!t) return self.aviso('Escreva o comentário antes de publicar.');
      var minuto = st.citar && self._pl ? self._pl.tempo() : null;
      EOJH.comentar(id, t, minuto, st.resp ? st.resp.id : null).then(function () { self._com = ''; self.setState({ resp: null, citar: false }); self.aviso('Comentário publicado'); return self.recarregar(); })
        .catch(function (e) { self.aviso(EOJB.msg(e)); });
    };
    // Anotações
    v.notas = st.notas.map(function (x) {
      return { texto: x.texto, min: x.minuto != null ? EOJB.dur(x.minuto) : '', ir: ir(x.minuto || 0),
        apagar: function () { EOJH.apagarAnotacao(x.id).then(function () { return self.recarregar(); }).catch(function (e) { self.aviso(EOJB.msg(e)); }); } };
    });
    v.txtNota = this._nota; v.setNota = function (e) { self._nota = e.target.value; };
    v.anotar = function () {
      var t = (self._nota || '').trim(); if (!t) return self.aviso('Escreva a anotação antes de salvar.');
      EOJH.anotar(id, t, self._pl ? self._pl.tempo() : null).then(function () { self._nota = ''; self.aviso('Anotação salva'); return self.recarregar(); })
        .catch(function (e) { self.aviso(EOJB.msg(e)); });
    };
    return v;
  }
}
EOJ.mount(typeof Component !== 'undefined' ? Component : null);
</script>
