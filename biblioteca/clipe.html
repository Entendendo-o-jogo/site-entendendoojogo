<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { c: null, loading: true, erro: '', favs: {}, pls: [], rel: [], toast: '', gate: null }; this._nova = ''; }
  componentDidMount() {
    var self = this, id = +EOJB.param('id');
    if (!id) return this.setState({ loading: false, erro: 'Clipe não encontrado.' });
    EOJB.ready.then(function () { return Promise.all([EOJB.clipe(id), EOJB.favIds(), EOJB.playlists(), EOJB.clipes(), EOJB.equipes().catch(function () { return {}; })]); })
      .then(function (r) {
        if (!r[0]) return self.setState({ loading: false, erro: 'Clipe não encontrado ou ainda não publicado.' });
        var f = {}; r[1].forEach(function (x) { f[x] = true; });
        var c = r[0], rel = r[3].filter(function (x) { return x.id !== c.id && (x.subtema === c.subtema || x.conceito === c.conceito); }).slice(0, 3);
        document.title = c.titulo + ' — Biblioteca EOJ';
        self.setState({ c: c, loading: false, favs: f, pls: r[2], rel: rel, esc: r[4] });
        setTimeout(function () { self._pl = EOJB.montarPlayer(c, rel); }, 0);
        if (location.hash === '#playlist') setTimeout(function () { var el = document.getElementById('playlist'); if (el) el.scrollIntoView({ behavior: 'smooth' }); }, 300);
      }).catch(function (e) { self.setState({ loading: false, erro: EOJB.msg(e) }); });
  }
  componentDidUpdate() { if (this._pl) this._pl.posicionar(); }
  aviso(t) { var self = this; this.setState({ toast: t }); clearTimeout(this._t); this._t = setTimeout(function () { self.setState({ toast: '' }); }, 3500); }
  recarregar() { var self = this; return Promise.all([EOJB.favIds(), EOJB.playlists()]).then(function (r) { var f = {}; r[0].forEach(function (x) { f[x] = true; }); self.setState({ favs: f, pls: r[1] }); }); }
  renderVals() {
    var self = this, st = this.state, c = st.c;
    var logged = !!EOJB.user;
    var g = EOJB.gate(this, function () { self.recarregar().then(function () { if (self._depois) { var d = self._depois; self._depois = null; d(); } }); });
    var v = { loading: st.loading, erro: st.erro, tem: !!c, toast: st.toast, logged: logged, anon: !logged,
      abrirEntrar: function () { self.setState({ gate: 'entrar' }); },
      abrirCadastro: function () { self.setState({ gate: 'cadastro', gateTitle: 'Monte playlists com seus clipes' }); } };
    for (var k in g) v[k] = g[k];
    if (!c) return v;
    var fav = !!st.favs[c.id];
    function toggle() {
      var on = !st.favs[c.id], f = Object.assign({}, st.favs); f[c.id] = on; self.setState({ favs: f });
      EOJB.favoritar(c.id, on).then(function () { self.aviso(on ? 'Clipe salvo nos seus favoritos' : 'Clipe removido dos favoritos'); }).catch(function (e) { self.aviso(EOJB.msg(e)); self.recarregar(); });
    }
    function addTo(p) {
      var ja = (p.playlist_clipes || []).some(function (x) { return x.clipe === c.id; });
      (ja ? EOJB.remover(p.id, c.id) : EOJB.adicionar(p.id, c.id)).then(function () { self.aviso(ja ? 'Removido de “' + p.nome + '”' : 'Adicionado a “' + p.nome + '”'); return self.recarregar(); }).catch(function (e) { self.aviso(EOJB.msg(e)); });
    }
    v.titulo = c.titulo; v.descricao = c.descricao || '';
    v.linha = [c.momento, c.fase].filter(Boolean).join(' · ');
    v.meta = [c.equipe, c.treinador, c.competicao, c.temporada].filter(Boolean).join(' · '); v.escudo = (c.equipe && st.esc && st.esc[c.equipe]) || '';
    v.tags = [c.subtema, c.conceito, c.posicao, c.nivel, c.genero, c.tipo, c.resultado, c.camera, c.duracao].filter(Boolean).map(function (x) { return { v: x }; });
    v.favLabel = fav ? 'Salvo nos favoritos' : 'Salvar nos favoritos'; v.favPressed = fav ? 'true' : 'false';
    v.fav = function () { if (!EOJB.user) { self._depois = toggle; return self.setState({ gate: 'cadastro', gateTitle: 'Salve clipes nos seus favoritos' }); } toggle(); };
    v.baixarLabel = st.baixando ? 'Preparando…' : 'Baixar';
    function baixar() {
      if (st.baixando) return; self.setState({ baixando: true });
      EOJB.linkDownload(c.id).then(function (d) { self.setState({ baixando: false }); self.aviso('Download iniciado · MP4 ' + d.altura + 'p'); location.href = d.link; })
        .catch(function (e) { self.setState({ baixando: false }); self.aviso(e.codigo === 'sem_download' || e.codigo === 'sem_token' ? 'Download indisponível para este clipe no momento.' : e.codigo === 'login' ? 'Entre de novo para baixar.' : 'Não foi possível baixar agora. Tente de novo.'); });
    }
    v.baixar = function () { if (!EOJB.user) { self._depois = baixar; return self.setState({ gate: 'cadastro', gateTitle: 'Baixe este clipe grátis' }); } baixar(); };
    v.copiar = function () { var u = location.origin + '/biblioteca/clipe?id=' + c.id; (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(function () { self.aviso('Link copiado'); }).catch(function () { prompt('Copie o link do clipe:', u); }); };
    v.rel = st.rel.map(function (r) { return { titulo: r.titulo, thumb: r.thumb || '', url: '/biblioteca/clipe?id=' + r.id }; }); v.temRel = st.rel.length > 0;
    v.pls = st.pls.map(function (p) { var ja = (p.playlist_clipes || []).some(function (x) { return x.clipe === c.id; });
      return { nome: p.nome, estado: ja ? '✓ Adicionado' : '+ Adicionar', pressed: ja ? 'true' : 'false', bg: ja ? '#E6EFF8' : '#FFFFFF', border: ja ? '#A1C4E6' : '#CCCCCC', add: function () { addTo(p); } }; });
    v.temPls = st.pls.length > 0;
    v.novaPl = this._nova; v.setNovaPl = function (e) { self._nova = e.target.value; };
    v.criarPl = function () {
      var nome = (self._nova || '').trim(); if (!nome) return self.aviso('Dê um nome para a playlist.');
      EOJB.novaPlaylist(nome).then(function (p) { self._nova = ''; return EOJB.adicionar(p.id, c.id).then(function () { self.aviso('Adicionado a “' + nome + '”'); return self.recarregar(); }); }).catch(function (e) { self.aviso(EOJB.msg(e)); });
    };
    return v;
  }
}

</script>
