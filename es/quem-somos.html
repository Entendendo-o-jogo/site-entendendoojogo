<div style="flex: 2 1 560px; display: flex; flex-direction: column; gap: 18px">
<p style="margin: 0; font-size: 17px; line-height: 1.7; color: #333333">Entendendo o Jogo fue creado en 2018, en Instagram, con el objetivo de difundir el conocimiento estudiado y adquirido por Ítalo Resende (fundador de Entendendo o Jogo) en su tiempo libre, de forma más resumida y simple, para que todas las personas interesadas en entender más sobre el fútbol pudieran acceder a ese conocimiento.</p>
<p style="margin: 0; font-size: 17px; line-height: 1.7; color: #333333">A partir de entonces, Entendendo o Jogo se volvió cada vez más influyente en la difusión del conocimiento específico de la táctica del fútbol. Con este crecimiento se convirtió en referencia en cursos y formaciones sobre la parte táctica del juego, cuando lanzó el “Curso de Fútbol: Situaciones de juego” durante la pandemia, que reunió a más de 340 alumnos.</p>
<p style="margin: 0; font-size: 17px; line-height: 1.7; color: #333333">Hoy, Entendendo o Jogo es un espacio de estudio gratuito a través de Instagram y de estudio con inversión a través de los cursos, que siguen principalmente tres temas que son pilares:</p>
<div style="display: flex; flex-wrap: wrap; gap: 10px"><span style="background: #E6EFF8; color: #3A6894; font-weight: 700; font-size: 15px; padding: 10px 16px; border-radius: 99px">Situaciones de juego</span><span style="background: #E6EFF8; color: #3A6894; font-weight: 700; font-size: 15px; padding: 10px 16px; border-radius: 99px">Sistemas tácticos</span><span style="background: #E6EFF8; color: #3A6894; font-weight: 700; font-size: 15px; padding: 10px 16px; border-radius: 99px">Capacidades tácticas individuales</span></div>
</div></div></section>

<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #DDDDDD">Ítalo Resende es asistente técnico de fútbol profesional y ya trabajó como analista de rendimiento. Es licenciado en Educación Física por la Universidad Federal de Viçosa (UFV), especialista en Fútbol por el Núcleo de Investigación y Estudios en Fútbol (NUPEF) y tiene la Licencia PRO de entrenador de la CBF Academy.</p>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #DDDDDD">Fue entrenador de categorías formativas en Estados Unidos, coordinador de análisis de rendimiento en el fútbol profesional del S. C. Aymorés, analista de juego y Head of Analysis de OutlierFC (empresa especializada en análisis individual, con clientes en el Brasileirão Serie A, Premier League, La Liga y otros campeonatos). Fue Head of Analysis en el fútbol profesional del Madura United F.C. (Indonesia) y supervisor técnico/metodológico del Club Athletico Paranaense. Sus dos últimos clubes fueron como asistente técnico del primer equipo de Guarani y de Persija (Indonesia).</p>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #DDDDDD">En 2018 creó Entendendo o Jogo como un canal de comunicación con sus seguidores, para difundir el conocimiento estudiado, como forma de aprendizaje y de intercambio, con una rapidez y dinámica que el seguidor no tendría en otra plataforma.</p>
