<script src="/eoj-runtime.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { email: '', ok: false, sending: false, erro: '' }; }
  renderVals() {
    var self = this, st = this.state;
    var URL_LISTA = 'https://script.google.com/macros/s/AKfycbxmodmm8q1bcH-zWhGvC9ZopHqLj6fFKRUpFRNfrKkzp7qWgxb1GUGI491oZmBPyQ22Kw/exec';
    return {
      email: st.email, ok: st.ok, form: !st.ok, erro: st.erro, btn: st.sending ? 'Enviando…' : 'Quero ser avisado',
      onEmail: function (ev) { self.setState({ email: ev.target.value, erro: '' }); },
      enviar: function () {
        var em = (st.email || '').trim();
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) { self.setState({ erro: 'Digite um e-mail válido.' }); return; }
        if (st.sending) return;
        self.setState({ sending: true, erro: '' });
        var body = new URLSearchParams({ email: em, origem: 'Biblioteca EOJ - em breve' });
        fetch(URL_LISTA, { method: 'POST', mode: 'no-cors', body: body })
          .then(function () { self.setState({ ok: true, sending: false, email: em }); })
          .catch(function () { self.setState({ sending: false, erro: 'Não foi possível enviar agora. Tente de novo em instantes.' }); });
      }
    };
  }
}
EOJ.mount(typeof Component !== 'undefined' ? Component : null);
</script>
