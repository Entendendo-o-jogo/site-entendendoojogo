<article style="max-width: 820px; margin: 0 auto; padding: 40px 32px 56px; display: flex; flex-direction: column; gap: 22px">

<h1 style="margin: 0; font-weight: 800; font-size: 42px; line-height: 1.1">Equilíbrio da linha defensiva em largura</h1>
<p style="margin: 0; font-size: 15px; color: #555555">Por <strong style="color: #111111">Ítalo Resende</strong> · 3 de agosto de 2023 · 6 min de leitura</p>
<img src="/assets/839de2b043cf0a14cd35e16c69462c59.jpg" alt="" style="width: 100%; height: auto; display: block; border-radius: 14px">
<h2 style="margin: 12px 0 0; font-size: 24px; font-weight: 800; line-height: 1.25">Entendam como o posicionamento dos laterais pode influenciar na quebra da linha defensiva</h2>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Os laterais jogam na extremidade da linha defensiva e o posicionamento desses jogadores em relação aos outros jogadores dessa linha pode impactar diretamente nas opções de ataque do adversário. Consideramos então, esse espaço entre o lateral e o restante da linha como “equilíbrio da linha defensiva em largura” (espaço ilustrado na imagem 1). Vários fatores podem influenciar no ganho ou não desse equilíbrio defensivo e nós vamos discutir alguns deles nesse texto.</p>
<figure style="margin: 8px 0; display: flex; flex-direction: column; gap: 8px"><img src="/assets/5948851084e28cdaf69a0e401ada1f98.jpg" alt="" style="width: 100%; height: auto; display: block; border-radius: 10px; border: 1px solid #E2E2E2"><figcaption style="font-size: 14px; color: #555555; line-height: 1.5">Imagem 1: exemplo de lateral que desequilibra a linha defensiva em largura, devido a longa distância adotada.</figcaption></figure>
<figure style="margin: 8px 0; display: flex; flex-direction: column; gap: 8px"><img src="/assets/1e9e00461b5fdde3837f15b2a323a88f.jpg" alt="" style="width: 100%; height: auto; display: block; border-radius: 10px; border: 1px solid #E2E2E2"><figcaption style="font-size: 14px; color: #555555; line-height: 1.5">Imagem 2: mesmo lance do exemplo anterior, visto de outro ângulo.</figcaption></figure>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Antes de qualquer discussão acerca do erro propriamente, precisamos entender o que impacta na equipe, caso aconteça um erro dessa natureza, quando não há a realização do comportamento que é abordado nesse texto. O fator mais importante que temos que considerar nesse momento, é que a posição do lateral nesse momento, tem que ser um posicionamento que coloque ele em condições de proteger a bola (esteja entre a baliza e o gol), quando o passe entrar em profundidade. Essa é a principal referência que podemos utilizar, porque facilita a visualização da realização do comportamento.</p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">No <strong><a href="https://entendendoojogo.com.br/curso/curso-de-futebol-capacidades-taticas-individuais" style="color: #4A79A6; font-weight: 600">Curso de capacidades táticas individuais</a></strong>, módulo 4, discutimos os indicadores de desempenho por posição dos laterais e, ao mencionarmos esses aspectos, definimos algumas referências para observarmos se o indicador de performance foi positivo ou negativo, como mencionamos no parágrafo anterior.</p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">O primeiro aspecto a se considerar quando há o desequilíbrio, é se o desequilíbrio é devido ao demasiado afastamento/aproximação do lateral em relação ao restante da linha. Os dois desequilíbrios são negativos para a defesa, considerando que o desequilíbrio por estar mais próximo da linha do que distante, pode ter menos danos do que quando se posiciona mais aberto, visto que o jogador vai receber a bola por fora do bloco, do que por dentro – apesar de ainda ter algumas possíveis desvantagens.</p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">O desequilíbrio por estar próximo demais da linha defensiva evita com que a bola passe entre jogadores da mesma linha, mas pode distanciar demais o jogador da beirada da linha do jogador que vai receber na amplitude, porque quanto mais próximo da linha defensiva, mais distante da abordagem na beirada o jogador vai estar. Por isso, é importante que ele esteja em uma posição ajustada para buscar evitar o passe por dentro da linha – o que prejudicaria ele a correr para a profundidade – e uma posição que não o distancie muito do jogador na profundidade, visto que um controle bem realizado por fora, dependendo do tempo gasto para chegar a abordagem, pode colocar o jogador que recebeu por fora, nas costas do lateral. Nesse momento, a principal referência que utilizamos para falar do resultado do comportamento, foi batida, o que significa que o indicador de desempenho foi negativo.</p>
<figure style="margin: 8px 0; display: flex; flex-direction: column; gap: 8px"><img src="/assets/618d691db330e4afa176a81b5fdc6feb.jpg" alt="" style="width: 100%; height: auto; display: block; border-radius: 10px; border: 1px solid #E2E2E2"><figcaption style="font-size: 14px; color: #555555; line-height: 1.5">Imagem 3: observem como o espaço é bem equilibrado pelo lateral, visto que a bola está longe do receptor e ele tem tempo suficiente para chegar no receptor a tempo de manter a sua posição entre a bola e a baliza.</figcaption></figure>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">O outro desequilíbrio que pode acontecer, é o jogador estar distante demais da linha defensiva, que permitira a bola entrar nesse espaço e venceria a linha defensiva, fazendo com que o lateral não conseguiria mais passar a linha da bola e desencadeando uma cobertura de algum outro jogador. Por isso, é importante que haja o ajuste de posicionamento do jogador que está por fora da linha e o restante dos seus companheiros setoriais. Muitas vezes, a quebra de linha acontece em um setor que o jogador que recebe pode usar um tempo para realizar a sua ação (finalizar ou cruzar), o que gera uma possibilidade muito positiva para o ataque e muito desvantajosa para a defesa, em termos de tempo.</p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Consideramos isso, porque é importante pensarmos sempre no “preventivo” e no “curativo”. O preventivo seria um comportamento que poderíamos buscar, para evitar com que precisemos curar algum tipo de dano causado pela equipe adversária. Nesse caso, o efeito curativo é muito difícil de ter efeito, o que reforça a importância de termos uma boa capacidade prevenir o desequilíbrio. Isso só reforça a necessidade de um bom posicionamento entre lateral e linha defensiva, para evitar com que a bola chegue na zona de perigo.</p>
<figure style="margin: 8px 0; display: flex; flex-direction: column; gap: 8px"><img src="/assets/7c6fb24a3536d7b2b95d9374a6986d32.jpg" alt="" style="width: 100%; height: auto; display: block; border-radius: 10px; border: 1px solid #E2E2E2"><figcaption style="font-size: 14px; color: #555555; line-height: 1.5">Imagem 4: ilustração da distância desajustada do lateral em relação à linha defensiva, o que possibilita a entrada do passe</figcaption></figure>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Outro aspecto importante de considerarmos no momento do desequilíbrio da linha em largura, é a posição corporal – não é só a distância em relação à última linha, como também o tempo que os laterais vão levar para fechar ou não esse espaço. Isto é, pode ser que o jogador esteja em uma distância adequada, mas com uma posição corporal desajustada, o que diminui o tempo dele para cobrir o espaço mencionado. Nesse momento, a distância foi impactada pela posição corporal e o contrário é verdadeiro: não adianta a postura corporal ser ajustada, com uma distância que impossibilitará o jogador de usar essa postura corporal para cobrir a distância que é muito longa – ou longa o suficiente para ele não conseguir cobrir no intervalo de tempo que ele tem disponível.</p>
<figure style="margin: 8px 0; display: flex; flex-direction: column; gap: 8px"><img src="/assets/ce4aa29c236d2297f511c8a2986dd6be.jpg" alt="" style="width: 100%; height: auto; display: block; border-radius: 10px; border: 1px solid #E2E2E2"><figcaption style="font-size: 14px; color: #555555; line-height: 1.5">Imagem 5: ilustração que mostra a distância bem equilibrada, mas a posição corporal do lateral direito desajustada com a posição da bola, que está mais voltada para o corredor central. Isso significa que o espaço entre ele e a linha será utilizado.</figcaption></figure>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Percebem na imagem 5, que apesar da boa distância (em termos gerais), a posição corporal vai prejudicar o jogador de cobrir o espaço das costas e acabará se tornando vulnerável, em uma situação aparentemente bem equilibrada no espaço.</p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Por fim, é importante lembrarmos que esse espaço é um espaço muito procurado pela equipe que ataca, devido às vantagens já mencionadas acima. Visto que é um espaço bem procurado e quais são os possíveis erros que podem acontecer, agora podemos analisar, avaliar e treinar melhor esses aspectos, para que os espaços defensivos podem ser cada vez menos vulneráveis.</p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Todos os vídeos utilizados nessa postagem em forma de imagens, serão disponibilizados no banco de vídeos do EOJ, que está disponível no link abaixo.</p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Banco de vídeos: <a href="https://drive.google.com/drive/folders/1E6yshgYN1Da23DJ2x8ao7LP-b6_IWVxf?usp=sharing" style="color: #4A79A6; font-weight: 600">https://drive.google.com/drive/folders/1E6yshgYN1Da23DJ2x8ao7LP-b6_IWVxf?usp=sharing</a></p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Esse e outros conteúdos com essa profundidade, foram discutidos, para todas as posições, no Curso de capacidades táticas individuais. No curso, discutimos 8 indicadores de performance por posição, sendo 4 ofensivos e 4 defensivos, de acordo com cada subfase do jogo.  Para acessar o curso, basta acessar o site: <a href="http://www.entendendoojogo.com" style="color: #4A79A6; font-weight: 600">www.entendendoojogo.com</a>.</p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Caso queira ativar o cupom de mais de 50% nesse curso, entre em contato pelo nosso WhatsApp que está disponível no nosso site e solicite o cupom.</p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Em agosto, lançaremos o Curso de capacidades táticas individuais 2.0: análise e treinamento, no qual abordaremos aspectos de intervenção em consultorias táticas individuais e treinamentos individuais, com um case prático do Madura United FC. Fiquem atentos.</p>
