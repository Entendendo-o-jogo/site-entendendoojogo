<div style="display: flex; flex-direction: column; gap: 10px"><details style="background: #FFFFFF; border: 1px solid #E2E2E2; border-radius: 12px; padding: 0 22px"><summary style="cursor: pointer; padding: 20px 0; font-size: 17px; font-weight: 700; list-style-position: outside">¿Dónde resuelvo mis dudas sobre el curso?</summary><p style="margin: 0 0 20px; font-size: 16px; line-height: 1.65; color: #444444">Puedes resolver tus dudas haciendo clic en el ícono de WhatsApp o Instagram al final de la página de inicio de nuestro sitio, o entrando en nuestro Instagram (@entendendoojogo) y enviándonos un mensaje directo o un WhatsApp, disponible en el área de contacto de nuestro perfil.</p></details><details style="background: #FFFFFF; border: 1px solid #E2E2E2; border-radius: 12px; padding: 0 22px"><summary style="cursor: pointer; padding: 20px 0; font-size: 17px; font-weight: 700; list-style-position: outside">¿Puedo ver las clases sin conexión?</summary><p style="margin: 0 0 20px; font-size: 16px; line-height: 1.65; color: #444444">Por ahora no es posible ver las clases sin conexión.</p></details><details style="background: #FFFFFF; border: 1px solid #E2E2E2; border-radius: 12px; padding: 0 22px"><summary style="cursor: pointer; padding: 20px 0; font-size: 17px; font-weight: 700; list-style-position: outside">¿Puedo interactuar con el profesor en las clases en vivo?</summary><p style="margin: 0 0 20px; font-size: 16px; line-height: 1.65; color: #444444">Sí. En todos los cursos con clases en vivo se reservan algunos momentos para resolver dudas e interactuar con los profesores. Si el alumno no puede verla en vivo, puede enviarnos su duda y se la haremos llegar al profesor.</p></details><details style="background: #FFFFFF; border: 1px solid #E2E2E2; border-radius: 12px; padding: 0 22px"><summary style="cursor: pointer; padding: 20px 0; font-size: 17px; font-weight: 700; list-style-position: outside">¿Qué pasa si no asisto a una clase en vivo?</summary><p style="margin: 0 0 20px; font-size: 16px; line-height: 1.65; color: #444444">Todos nuestros cursos tienen clases grabadas que quedan disponibles después, dentro del plazo informado. En los cursos con clases en vivo, el alumno tiene acceso a la clase grabada en un plazo de 48 horas después de su realización.</p></details><details style="background: #FFFFFF; border: 1px solid #E2E2E2; border-radius: 12px; padding: 0 22px"><summary style="cursor: pointer; padding: 20px 0; font-size: 17px; font-weight: 700; list-style-position: outside">¿Cuánto tiempo quedan disponibles los cursos en la plataforma?</summary><p style="margin: 0 0 20px; font-size: 16px; line-height: 1.65; color: #444444">Todos los cursos lanzados hasta 2022 tienen acceso ilimitado a la plataforma: Capacidades Tácticas Individuales; Sistemas Tácticos; Juego de Posición; Aspectos Metodológicos de un Club; Situaciones de Juego; Preparación Física (Módulos 1 y 2). Los cursos lanzados a partir de 2023 tienen acceso durante 12 meses.</p></details><details style="background: #FFFFFF; border: 1px solid #E2E2E2; border-radius: 12px; padding: 0 22px"><summary style="cursor: pointer; padding: 20px 0; font-size: 17px; font-weight: 700; list-style-position: outside">Si me arrepiento de la compra, ¿puedo pedir un reembolso?</summary><p style="margin: 0 0 20px; font-size: 16px; line-height: 1.65; color: #444444">Sí, todos los cursos de Entendendo o Jogo pueden reembolsarse hasta 7 días después de la compra, si necesitas devolverlo.</p></details><details style="background: #FFFFFF; border: 1px solid #E2E2E2; border-radius: 12px; padding: 0 22px"><summary style="cursor: pointer; padding: 20px 0; font-size: 17px; font-weight: 700; list-style-position: outside">¿Los cursos tienen certificado?</summary><p style="margin: 0 0 20px; font-size: 16px; line-height: 1.65; color: #444444">Sí, todos los cursos de Entendendo o Jogo tienen certificado de finalización. El certificado se genera cuando el alumno ve todas las clases de la plataforma y las marca como “vistas”.</p></details></div>
