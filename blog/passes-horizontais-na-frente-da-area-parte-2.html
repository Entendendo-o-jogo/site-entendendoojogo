<h1 style="margin: 0; font-weight: 800; font-size: 42px; line-height: 1.1">Passes horizontais na frente da área (parte 2)</h1>
<p style="margin: 0; font-size: 15px; color: #555555">Por <strong style="color: #111111">Ítalo Resende</strong> · 13 de abril de 2023 · 2 min de leitura</p>
<div style="position: relative; width: 100%; aspect-ratio: 21 / 9; border-radius: 16px; overflow: hidden; background: radial-gradient(120% 90% at 50% 40%, #1E2A36 0%, #111111 70%); color: #FFFFFF"><svg viewBox="0 0 160 90" preserveAspectRatio="xMidYMid slice" style="position: absolute; inset: 0; width: 100%; height: 100%" aria-hidden="true"><defs><marker id="ar" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#A1C4E6"></path></marker></defs><g fill="none" stroke="#A1C4E6" stroke-opacity="0.2" stroke-width="0.6"><rect x="6" y="6" width="148" height="78"></rect><line x1="80" y1="6" x2="80" y2="84"></line><circle cx="80" cy="45" r="11"></circle><rect x="6" y="26" width="20" height="38"></rect><rect x="134" y="26" width="20" height="38"></rect></g><circle cx="12" cy="45" r="2.2" fill="#A1C4E6" fill-opacity="0.95"></circle><circle cx="26" cy="30" r="2.2" fill="#A1C4E6" fill-opacity="0.95"></circle><circle cx="26" cy="60" r="2.2" fill="#A1C4E6" fill-opacity="0.95"></circle><circle cx="44" cy="45" r="2.2" fill="#A1C4E6" fill-opacity="0.95"></circle><circle cx="62" cy="22" r="2.2" fill="#A1C4E6" fill-opacity="0.95"></circle><circle cx="64" cy="68" r="2.2" fill="#A1C4E6" fill-opacity="0.95"></circle><circle cx="100" cy="36" r="2.2" fill="#A1C4E6" fill-opacity="0.95"></circle><circle cx="118" cy="18" r="2.2" fill="#A1C4E6" fill-opacity="0.95"></circle><circle cx="122" cy="60" r="2.2" fill="#A1C4E6" fill-opacity="0.95"></circle><path d="M14 45 L24 32" fill="none" stroke="#A1C4E6" stroke-opacity="0.85" stroke-width="0.8" stroke-dasharray="2.2 1.6" marker-end="url(#ar)"></path><path d="M28 30 Q38 36 42 43" fill="none" stroke="#A1C4E6" stroke-opacity="0.85" stroke-width="0.8" stroke-dasharray="2.2 1.6" marker-end="url(#ar)"></path><path d="M46 44 Q56 30 60 24" fill="none" stroke="#A1C4E6" stroke-opacity="0.85" stroke-width="0.8" stroke-dasharray="2.2 1.6" marker-end="url(#ar)"></path><path d="M64 22 Q84 26 98 35" fill="none" stroke="#A1C4E6" stroke-opacity="0.85" stroke-width="0.8" stroke-dasharray="2.2 1.6" marker-end="url(#ar)"></path><path d="M102 35 Q112 24 116 20" fill="none" stroke="#A1C4E6" stroke-opacity="0.85" stroke-width="0.8" stroke-dasharray="2.2 1.6" marker-end="url(#ar)"></path><circle cx="40" cy="30" r="1.8" fill="#FFFFFF" fill-opacity="0.5"></circle><circle cx="52" cy="56" r="1.8" fill="#FFFFFF" fill-opacity="0.5"></circle><circle cx="78" cy="40" r="1.8" fill="#FFFFFF" fill-opacity="0.5"></circle><circle cx="88" cy="60" r="1.8" fill="#FFFFFF" fill-opacity="0.5"></circle><circle cx="110" cy="46" r="1.8" fill="#FFFFFF" fill-opacity="0.5"></circle><circle cx="130" cy="36" r="1.8" fill="#FFFFFF" fill-opacity="0.5"></circle></svg><div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(17,17,17,0) 30%, rgba(17,17,17,0.9) 100%)"></div><div style="position: absolute; left: 36px; right: 36px; bottom: 36px; display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #A1C4E6">Texto tático</span><span style="font-size: 34px; font-weight: 800; line-height: 1.12; text-transform: uppercase">Passes horizontais na frente da área (parte 2)</span></div></div>
<figure style="margin: 8px 0; display: flex; flex-direction: column; gap: 8px"><img src="/assets/e1e5e3e23f1ec33a3437473b237dccc4.jpg" alt="" style="width: 100%; height: auto; display: block; border-radius: 10px; border: 1px solid #E2E2E2"></figure>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Qual a diferença para os passes que terminam na profundidade?</p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Estas dinâmicas, em vez de terminarem na profundidade, como na parte 1 deste post, terminam na amplitude, para que um cruzamento chegue dentro da área posteriormente.</p>
<figure style="margin: 8px 0; display: flex; flex-direction: column; gap: 8px"><img src="/assets/a2081c0279d2c0d6efe9606453fd334f.jpg" alt="" style="width: 100%; height: auto; display: block; border-radius: 10px; border: 1px solid #E2E2E2"></figure>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Os passes na horizontal também permitem uma possibilidade de ataque, quando a sequência vai por fora do bloco até chegar à amplitude e, consequentemente, dentro da área.</p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Assim como na postagem anterior, falaremos dos benefícios ofensivos a partir de uma desvantagem que a dinâmica gera na defesa. Quando dinâmicas como esta acontecem, a tendência da defesa é girar o quadril para o sentido da bola, como já citamos na parte 1 e isso gera dificuldades de manter referências dentro da área.</p>
<figure style="margin: 8px 0; display: flex; flex-direction: column; gap: 8px"><img src="/assets/bb12d0a64b1fa25cca655ca7fb07636e.jpg" alt="" style="width: 100%; height: auto; display: block; border-radius: 10px; border: 1px solid #E2E2E2"></figure>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Outro fator que pode ser considerado como desvantagem para a defesa neste momento, é a quebra de linha que pode ter acontecido no momento em que a bola estava na frente da área.</p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Este fator influencia diretamente no tempo gasto pelo defensor, para retornar na linha e reequilibrar o espaço da área.</p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Além de ter a desvantagem de tempo, existe a desvantagem de espaço, porque o defensor corre o risco de ter que abordar do atacante pelas costas no momento do retorno.</p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Vejam os exemplos a seguir:</p>
<figure style="margin: 8px 0; display: flex; flex-direction: column; gap: 8px"><img src="/assets/e1d4f327cad43f60fd6c7d3517c3f9f1.jpg" alt="" style="width: 100%; height: auto; display: block; border-radius: 10px; border: 1px solid #E2E2E2"></figure>
<figure style="margin: 8px 0; display: flex; flex-direction: column; gap: 8px"><img src="/assets/79f8afdbf644b5639c4ba6001d6117fc.jpg" alt="" style="width: 100%; height: auto; display: block; border-radius: 10px; border: 1px solid #E2E2E2"></figure>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Outro aspecto importante</p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Outro aspecto crucial, é a quantidade de toques utilizada pelo jogador que vai realizar o cruzamento, impacta diretamente na manutenção de vantagem, por exemplo, se o defensor tiver quebrado a linha quando a bola estava na frente da área (conforme mostrado na imagem 5). Caso o jogador da beirada domine a bola, consequentemente ele está oferecendo mais tempo ao defensor para retornar à área.</p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">O movimento de pescoço dos jogadores que já estão na linha também pode ser impactado pelo cruzamento de primeira, já que a manutenção da referência da bola neste momento tende a ser mais forte do que a necessidade de proteção das costas.</p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Por isso, é importante os jogadores que recebem a bola fora, consigam ter a possibilidade de cruzar a bola no primeiro toque, entendendo as boas possibilidades de vantagem neste momento.</p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Outra dinâmica interesse e bastante utilizada, é a utilização do impedimento como alternativa para o jogador que está atacando ficar em condição legal no momento que a bola entra na beirada e levar vantagem na relação com o defensor – veremos isso nos próximos textos.</p>
<div style="margin-top: 16px; background: #FFFFFF; border: 1px solid #E2E2E2; border-radius: 14px; padding: 24px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between"><span style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 17px; font-weight: 800">Gostou? Aprofunde com as masterclasses da EOJHub.</span><span style="font-size: 15px; color: #555555">Conteúdo novo todo mês, a partir do Plano Basic.</span></span><a href="/eojhub" style="display: inline-flex; justify-content: center; align-items: center; gap: 8px; text-decoration: none; font-weight: 700; font-size: 16px; padding: 15px 24px; border-radius: 8px; background: #A1C4E6; color: #111111; font-size: 15px; padding: 13px 20px">Ver planos</a></div>
</article>
