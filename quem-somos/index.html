<div style="flex: 2 1 560px; display: flex; flex-direction: column; gap: 18px">
<p style="margin: 0; font-size: 17px; line-height: 1.7; color: #333333">O Entendendo o Jogo foi criado em 2018, através do Instagram, com o objetivo de divulgar o conhecimento estudado e adquirido pelo Ítalo Resende (fundador do Entendendo o Jogo), no seu tempo livre, de forma mais resumida e simples, para que todas as pessoas interessadas em entender mais sobre o jogo de futebol pudessem ter contato com aquele conhecimento.</p>
<p style="margin: 0; font-size: 17px; line-height: 1.7; color: #333333">A partir de então, o Entendendo o Jogo foi se tornando cada vez mais impactante na disseminação do conhecimento específico da tática do jogo de futebol. Com este crescimento, tornou-se uma referência em cursos e formações voltadas para a parte tática do jogo, quando lançou o “Curso de Futebol: Situações de jogo”, durante a pandemia, e acumulou mais de 340 alunos participantes.</p>
<p style="margin: 0; font-size: 17px; line-height: 1.7; color: #333333">Atualmente, o Entendendo o Jogo é um ambiente de estudos gratuitos através do Instagram e de estudos com investimento através dos cursos, que seguem principalmente três temas que são pilares:</p>
<div style="display: flex; flex-wrap: wrap; gap: 10px"><span style="background: #E6EFF8; color: #3A6894; font-weight: 700; font-size: 15px; padding: 10px 16px; border-radius: 99px">Situações de jogo</span><span style="background: #E6EFF8; color: #3A6894; font-weight: 700; font-size: 15px; padding: 10px 16px; border-radius: 99px">Sistemas táticos</span><span style="background: #E6EFF8; color: #3A6894; font-weight: 700; font-size: 15px; padding: 10px 16px; border-radius: 99px">Capacidades táticas individuais</span></div>
</div></div></section>

<div style="display: flex; flex-direction: column; gap: 10px"><p style="margin: 0; color: #4A79A6; font-weight: 600; font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase">Nossos pilares</p><h2 id="vvm-t" style="margin: 0; font-weight: 800; font-size: 38px; line-height: 1.05; text-transform: uppercase">Valores, visão e missão</h2></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px"><div style="background: #111111; color: #FFFFFF; border-radius: 16px; padding: 30px; display: flex; flex-direction: column; gap: 14px; border-top: 4px solid #A1C4E6"><h3 style="margin: 0; font-size: 26px; font-weight: 800; text-transform: uppercase">Valores</h3><p style="margin: 0; font-size: 17px; line-height: 1.6; color: #E6E6E6">Acessibilidade. Atualização. Qualidade.</p></div><div style="background: #111111; color: #FFFFFF; border-radius: 16px; padding: 30px; display: flex; flex-direction: column; gap: 14px; border-top: 4px solid #A1C4E6"><h3 style="margin: 0; font-size: 26px; font-weight: 800; text-transform: uppercase">Visão</h3><p style="margin: 0; font-size: 17px; line-height: 1.6; color: #E6E6E6">Ser a maior referência de escola de formação de pessoas que se interessem em estudar tática de maneira profunda.</p></div><div style="background: #111111; color: #FFFFFF; border-radius: 16px; padding: 30px; display: flex; flex-direction: column; gap: 14px; border-top: 4px solid #A1C4E6"><h3 style="margin: 0; font-size: 26px; font-weight: 800; text-transform: uppercase">Missão</h3><p style="margin: 0; font-size: 17px; line-height: 1.6; color: #E6E6E6">Viabilizar o acesso, transformar o entendimento tático de jogo das pessoas e, consequentemente, oportunizá-las no mercado de trabalho através dos nossos conteúdos.</p></div></div>

<img src="/assets/9527a9f19ac2a623eaa3f9c35ae66cc1.jpg" alt="Ítalo Resende à beira do campo" style="flex: 1 1 420px; min-width: 0; max-width: 560px; aspect-ratio: 4 / 3; object-fit: cover; display: block; border-radius: 16px">

<p style="margin: 0; color: #A1C4E6; font-weight: 600; font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase">Fundador</p>
<h2 id="fund-t" style="margin: 0; font-weight: 800; font-size: 40px; line-height: 1; text-transform: uppercase">Ítalo Resende</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #DDDDDD">Ítalo Resende é auxiliar técnico de futebol profissional e já atuou como analista de desempenho. Possui graduação em Educação Física pela Universidade Federal de Viçosa (UFV), especialização em Futebol pelo Núcleo de Pesquisa e Estudos em Futebol (NUPEF) e Licença PRO de treinador pela CBF Academy.</p>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #DDDDDD">Atuou como treinador de categorias de base nos Estados Unidos, foi coordenador de análise de desempenho no futebol profissional do S. C. Aymorés, analista de jogo e Head of Analysis da OutlierFC (empresa especializada em análise individual, com clientes no Campeonato Brasileiro Série A, Premier League, La Liga e outros campeonatos). Foi Head of Analysis no futebol profissional do Madura United F.C. (Indonésia) e supervisor técnico/metodológico do Club Athletico Paranaense. Seus dois últimos clubes foram como auxiliar técnico da equipe profissional do Guarani e do Persija (Indonésia).</p>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #DDDDDD">Em 2018, criou o Entendendo o Jogo para ser um canal de comunicação entre ele e os seguidores, com o intuito de divulgar o conhecimento estudado, como forma de aprendizado e de compartilhamento, com uma rapidez e dinâmica que o seguidor não teria em outra plataforma.</p>
