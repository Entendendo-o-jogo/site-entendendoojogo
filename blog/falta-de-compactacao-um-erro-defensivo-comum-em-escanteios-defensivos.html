<h1 style="margin: 0; font-weight: 800; font-size: 42px; line-height: 1.1">Falta de compactação: um erro comum em escanteios defensivos</h1>
<p style="margin: 0; font-size: 15px; color: #555555">Por <strong style="color: #111111">Ítalo Resende</strong> · 18 de setembro de 2026 · 5 min de leitura</p>
<div style="position: relative; width: 100%; aspect-ratio: 21 / 9; border-radius: 16px; overflow: hidden; background: radial-gradient(120% 90% at 50% 40%, #1E2A36 0%, #111111 70%); color: #FFFFFF"><svg viewBox="0 0 160 90" preserveAspectRatio="xMidYMid slice" style="position: absolute; inset: 0; width: 100%; height: 100%" aria-hidden="true"><defs><marker id="ar" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#A1C4E6"></path></marker></defs><g fill="none" stroke="#A1C4E6" stroke-opacity="0.2" stroke-width="0.6"><rect x="6" y="6" width="148" height="78"></rect><line x1="80" y1="6" x2="80" y2="84"></line><circle cx="80" cy="45" r="11"></circle><rect x="6" y="26" width="20" height="38"></rect><rect x="134" y="26" width="20" height="38"></rect></g><path d="M58 45 L92 22 A40 40 0 0 1 92 68 Z" fill="#A1C4E6" fill-opacity="0.13"></path><circle cx="58" cy="45" r="4.2" fill="#A1C4E6" fill-opacity="0.95"></circle><circle cx="96" cy="47" r="4.2" fill="#FFFFFF" fill-opacity="0.8"></circle><path d="M50 39 A9 9 0 0 1 50 51" fill="none" stroke="#A1C4E6" stroke-width="0.9" stroke-opacity="0.9"></path><path d="M62 48 Q80 66 104 62" fill="none" stroke="#A1C4E6" stroke-opacity="0.85" stroke-width="0.9" marker-end="url(#ar)"></path><path d="M98 50 Q100 58 102 60" fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="0.8" stroke-dasharray="2.2 1.6" marker-end="url(#ar)"></path></svg><div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(17,17,17,0) 30%, rgba(17,17,17,0.9) 100%)"></div><div style="position: absolute; left: 36px; right: 36px; bottom: 36px; display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #A1C4E6">Texto tático</span><span style="font-size: 34px; font-weight: 800; line-height: 1.12; text-transform: uppercase">Falta de compactação: um erro comum em escanteios defensivos</span></div></div>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Este é um tema que foi debatido em uma das Masterclasses do PLANO BASIC do EOJhub</p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">As jogadas de bola parada deixaram de ser mero “detalhe” no futebol moderno para se tornarem <strong>armas táticas decisivas. </strong>Existem alguns pormenores que se relacionam neste momento de jogo e podem gerar muitas vantagens ofensivas, como é o caso dos escanteios abertos e das bolas desviadas para um segundo contato de finalização. Sabendo disso, muitas equipes utilizam desse conceito para aumentar as chances de sucesso nos escanteios de ataque, como foi a Argentina na Copa do Mundo.</p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Aliando as batidas de pé aberto, com os movimentos de MacAllister em direção ao primeiro jogador da zona (para desviar a bola) e entradas na zona de segundo poste (para aproveitarem a bola desviada), os “Hermanos” geraram várias situações claras de jogador livre, finalização e até mesmo gol desta dinâmica, como mostrado nos <a href="https://drive.google.com/drive/folders/1RXIPvKBJ3fF6FqR-AfgL2Q-ZzoNSWhqk?usp=sharing" style="color: #4A79A6; font-weight: 600">vídeos</a>.</p>
<figure style="margin: 8px 0; display: flex; flex-direction: column; gap: 8px"><img src="/assets/c035707c2dac53c5c8e61c473a142664.jpg" alt="" style="width: 100%; height: auto; display: block; border-radius: 10px; border: 1px solid #E2E2E2"></figure>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Imagem 1 – representação do padrão de movimento da Argentina em escanteios ofensivos</p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Para um melhor entendimentos dos 3 aspectos citados acima, é preciso entende-los separadamente:</p>
<ol style="margin: 0; padding-left: 24px; font-size: 18px; line-height: 1.75; color: #222222; display: flex; flex-direction: column; gap: 6px"><li>Batida de pé aberto: a batida aberta, possui uma curva natural para fora da direção do gol, em comparação com a batida fechada, que geralmente faz com que a defesa se posicione mais para fora da pequena área, com uma leve diagonal – mais para fora ainda – dos jogadores de defesa mais próximos de segundo poste. Esse aspecto já valida o objetivo ofensivo de buscar atacar esse espaço com jogadores que venham de trás, para aproveitar o espaço em profundidade.</li><li>Movimento do MacAllister: o segundo aspecto importante a se considerar, é o movimento do meia argentino em direção ao primeiro jogador da zona, com o intuito de buscar um desvio na bola, a fim de conseguir finalizar ou colocar a bola no jogador que está fazendo entrada no segundo poste, com vantagem em relação ao defensor.</li><li>Entradas no segundo poste: esse terceiro aspecto já foi explicado nos tópicos anteriores e, reforçando, tem o principal objetivo de aproveitar o espaço das costas dos jogadores que defendem, sem que sejam percebidos como ameaça, já que a maioria das bolas possui um primeiro ponto de contato que é o grande atrator deste momento.</li></ol>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Entendidas essas referências de ataque da Argentina, vocês podem olhar para o título e se perguntarem: qual é a relação da compactação defensiva com o ataque em escanteio dos argentinos? Então, é justamente pensando nesse desajuste defensivo que vamos explorar agora, que a seleção de Messi e companhia criou estes padrões de ataque vistos anteriormente. Por isso, foi proposto o entendimento de como o ataque explora esse “erro”, para em seguida entendermos como a defesa pode minimizar essa vantagem.</p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Como foi mencionado acima, a principal dificuldade defensiva neste tipo de escanteio, é coordenar os jogadores para ações que buscam o mesmo objetivo, principalmente pensando que esses escanteios possuem 2 pontos de contato com a bola. O 1º ponto de contato, é aquela ação ofensiva que nem sempre é suficiente para ir no gol e acaba gerando o 2º ponto de contato, que é de onde a finalização acontece.</p>
<figure style="margin: 8px 0; display: flex; flex-direction: column; gap: 8px"><img src="/assets/2e12d1a34018a2a1f9d6237c6aad05c7.jpg" alt="" style="width: 100%; height: auto; display: block; border-radius: 10px; border: 1px solid #E2E2E2"></figure>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Imagem 2 – representação ilustrativa dos 2 pontos de conta com a bola</p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Quando o primeiro contato com a bola acontece, a tendência é que a defesa tenha dificuldade de fazer o movimento de compactação da linha, principalmente através dos jogadores que estão mais próximos da trave, que precisam sair com mais velocidade, considerando que estão mais distantes da linha da bola – conforme mostra a imagem 3.</p>
<figure style="margin: 8px 0; display: flex; flex-direction: column; gap: 8px"><img src="/assets/7baeba39ce226b32da2a178c87d5e8b8.jpg" alt="" style="width: 100%; height: auto; display: block; border-radius: 10px; border: 1px solid #E2E2E2"></figure>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Imagem 3 – representação dos jogadores mais próximos do gol com dificuldade para saírem</p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Quando esta falta de coordenação acontece e a defesa não consegue se colocar em linha, as chances de o ataque conseguir ter o 2º ponto de contato sem impedimento aumentam. Por isso, é importante a defesa definir a referência de saída, que pode ser a linha da bola, a linha da pequena área, marca do pênalti ou outra referência que facilite a compactação dos jogadores defensivos.</p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Essa referência vai estar diretamente relacionada com a distância que a bola foi colocada do gol, devido a distância que os jogadores precisam percorrer (imagem 4). Por isso, é importante definir mais de uma referência porque, neste caso, a linha da bola não é possível de ser atingida e, mesmo assim, a defesa precisa se colocar em condição de proteger a profundidade a partir do alinhamento das suas peças.</p>
<figure style="margin: 8px 0; display: flex; flex-direction: column; gap: 8px"><img src="/assets/89fb9f69084a6ea47cee89def04b189d.jpg" alt="" style="width: 100%; height: auto; display: block; border-radius: 10px; border: 1px solid #E2E2E2"></figure>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Imagem 4 – representação da distância da linha da bola (um exemplo distante)</p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Em casos em que a linha do 1º contato é mais próxima do gol, o movimento da saída da defesa fica facilitado devido à distância mais curta que precisa percorrer. Isso é ainda mais comum em situações de batida de pé trocado, que, por mais que não tenham tanta incidência de 2 pontos de contato, quando acontece, coloca a trajetória do 1º contato mais próximo do gol.</p>
<figure style="margin: 8px 0; display: flex; flex-direction: column; gap: 8px"><img src="/assets/f3defc37845f2c998204a893f6ccb1bc.jpg" alt="" style="width: 100%; height: auto; display: block; border-radius: 10px; border: 1px solid #E2E2E2"></figure>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Imagem 5 – representação da linha de impedimento caso todos os jogadores de defesa estivessem na mesma referência em situações de batida de pé fechado</p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Em conclusão, percebemos que é um aspecto muito relevante a se considerar no momento ofensivo, no sentido de buscar alternativas para melhorar a coordenação dos fatores que o influenciam, como colocar os jogadores para entrarem nas costas da defesa saindo de uma distância maior e diminuindo as chances de impedimento, por exemplo; bem como no momento defensivo, que deve fornecer alternativas para evitar essa entrada em condição legal com possíveis ações de bloqueios além da coordenação da linha, por exemplo.</p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Se você busca evoluir no entendimento tático do futebol, o <strong>EOJhub</strong> é o seu lugar. Todas as semanas, entregamos conteúdos teóricos e práticos sobre indicadores por posição, sistemas táticos, bolas paradas e análise de jogo.</p>

<button type="button" data-eoj-cookies="recusado" style="font: inherit; font-weight: 600; background: transparent; color: #FFFFFF; border: 1px solid #555555; border-radius: 8px; padding: 10px 16px; cursor: pointer">Recusar</button>
<button type="button" data-eoj-cookies="aceito" style="font: inherit; font-weight: 700; background: #A1C4E6; color: #111111; border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer">Aceitar</button>
</div>
</div>
<script>
(function () {
  var box = document.getElementById('eoj-consent');
  var v = null; try { v = localStorage.getItem('eoj-cookies'); } catch (e) {}
  if (!v) { box.hidden = false; box.style.display = 'flex'; }
  window.eojCookies = function () { box.hidden = false; box.style.display = 'flex'; };
  box.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-eoj-cookies]'); if (!b) return;
    var c = b.getAttribute('data-eoj-cookies');
    try { localStorage.setItem('eoj-cookies', c); } catch (e) {}
    box.hidden = true; box.style.display = 'none';
    if (c === 'aceito') window.eojLoadGA();
    else if (window.__eojMkt) { try { location.reload(); } catch (e) {} }
  });
})();
</script>
</body>
</html>
