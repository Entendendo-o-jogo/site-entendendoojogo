<script>

  constructor(props) { super(props); this.state = { loading: true, erro: '', pl: null, clipes: {}, toast: '', gate: null, copiando: false, baixando: null }; }

    var self = this, cod = EOJB.param('c');

      .then(function (r) {
        if (!r[0]) return self.setState({ loading: false, erro: 'This playlist link doesn\'t exist or is no longer shared.' });
        var m = {}; r[1].forEach(function (c) { m[c.id] = c; });
        document.title = r[0].nome + ' — EOJ Library playlist';
        EOJB.ev('bib_playlist_vista', { clipes: (r[0].clipes || []).length });
        self.setState({ loading: false, pl: r[0], clipes: m, esc: r[2] });
      }).catch(function (e) { self.setState({ loading: false, erro: EOJB.msg(e) }); });
  }
  aviso(t) { var self = this; this.setState({ toast: t }); clearTimeout(this._t); this._t = setTimeout(function () { self.setState({ toast: '' }); }, 4000); }
  renderVals() {
    var self = this, st = this.state, pl = st.pl, cod = EOJB.param('c');
    var g = EOJB.gate(this, function () { if (self._depois) { var d = self._depois; self._depois = null; d(); } });
    var v = { loading: st.loading, erro: st.erro, tem: !!pl, toast: st.toast, nome: pl ? pl.nome : 'Playlist' };
    for (var k in g) v[k] = g[k];
    if (!pl) return v;
    var ids = (pl.clipes || []).filter(function (id) { return st.clipes[id]; });
    v.sub = [pl.autor ? 'Built by ' + pl.autor : '', ids.length === 1 ? '1 clip' : ids.length + ' clips'].filter(Boolean).join(' · ');
    v.vazia = ids.length === 0;
    v.itens = ids.map(function (id, i) { var c = st.clipes[id];
      return { n: i + 1, titulo: c.titulo, thumb: c.thumb || '', dur: c.duracao || '', k: EOJB.t(c.conceito || c.fase || c.subtema || ''),
        meta: [c.equipe, c.competicao, c.temporada].filter(Boolean).join(' · '), url: EOJB.u('/biblioteca/clipe?id=') + id + '&pl=' + encodeURIComponent(cod) }; });

      if (st.copiando) return; self.setState({ copiando: true });
      EOJB.novaPlaylist(pl.nome).then(function (nova) {
        return ids.reduce(function (p, id) { return p.then(function () { return EOJB.adicionar(nova.id, id); }); }, Promise.resolve());
      }).then(function () { EOJB.ev('bib_playlist_copia', { clipes: ids.length }); self.setState({ copiando: false }); self.aviso('Playlist saved to My area'); })
        .catch(function (e) { self.setState({ copiando: false }); self.aviso(EOJB.msg(e)); });
    }
    v.copiarLabel = st.copiando ? 'Saving…' : 'Save to my account';
    v.copiar = function () { if (!ids.length) return; if (!EOJB.user) { self._depois = copiar; return self.setState({ gate: 'cadastro', gateTitle: 'Save this playlist to your account' }); } copiar(); };
    function baixar() {
      if (st.baixando) return;
      if (ids.length > 1 && !confirm('Download the ' + ids.length + ' clips in this playlist? Files download one by one. If your browser asks, allow multiple downloads.')) return;
      self.setState({ baixando: 0 });
      EOJB.baixarVarios(ids, function (n) { self.setState({ baixando: n }); }).then(function (r) {
        self.setState({ baixando: null });

      });
    }
    v.baixarLabel = st.baixando != null ? 'Downloading ' + st.baixando + '/' + ids.length + '…' : 'Download all (' + ids.length + ')';
    v.baixar = function () { if (!ids.length) return; if (!EOJB.user) { self._depois = baixar; return self.setState({ gate: 'cadastro', gateTitle: 'Download the clips for free' }); } baixar(); };

  }
