<div style="display: flex; flex-direction: column; gap: 10px"><details style="background: #FFFFFF; border: 1px solid #E2E2E2; border-radius: 12px; padding: 0 22px"><summary style="cursor: pointer; padding: 20px 0; font-size: 17px; font-weight: 700; list-style-position: outside">Onde tiro minhas dúvidas do curso?</summary><p style="margin: 0 0 20px; font-size: 16px; line-height: 1.65; color: #444444">Você pode tirar suas dúvidas clicando no ícone do WhatsApp ou Instagram no final da página inicial do nosso site; ou entrando no nosso Instagram (@entendendoojogo), nos enviando um direct ou WhatsApp, que está disponível na área de contatos no nosso perfil.</p></details><details style="background: #FFFFFF; border: 1px solid #E2E2E2; border-radius: 12px; padding: 0 22px"><summary style="cursor: pointer; padding: 20px 0; font-size: 17px; font-weight: 700; list-style-position: outside">Posso assistir às aulas off-line?</summary><p style="margin: 0 0 20px; font-size: 16px; line-height: 1.65; color: #444444">Não é possível assistir às aulas offline, por enquanto.</p></details><details style="background: #FFFFFF; border: 1px solid #E2E2E2; border-radius: 12px; padding: 0 22px"><summary style="cursor: pointer; padding: 20px 0; font-size: 17px; font-weight: 700; list-style-position: outside">Posso interagir com o Professor nas aulas ao vivo?</summary><p style="margin: 0 0 20px; font-size: 16px; line-height: 1.65; color: #444444">Sim. Em todos os Cursos com aulas ao vivo, são destinados alguns momentos para a retirada de dúvidas e interações com os Professores. Caso o Aluno não consiga assistir ao vivo, pode nos encaminhar a dúvida e, posteriormente, a encaminharemos ao Professor.</p></details><details style="background: #FFFFFF; border: 1px solid #E2E2E2; border-radius: 12px; padding: 0 22px"><summary style="cursor: pointer; padding: 20px 0; font-size: 17px; font-weight: 700; list-style-position: outside">O que acontece se eu não comparecer a uma aula ao vivo?</summary><p style="margin: 0 0 20px; font-size: 16px; line-height: 1.65; color: #444444">Todos os nossos Cursos possuem aulas gravadas e disponibilizadas posteriormente, dentro do tempo informado, respectivamente. Em caso de Cursos com aulas ao vivo, portanto, o Aluno tem acesso à aula gravada no prazo de 48 horas após a sua realização.</p></details><details style="background: #FFFFFF; border: 1px solid #E2E2E2; border-radius: 12px; padding: 0 22px"><summary style="cursor: pointer; padding: 20px 0; font-size: 17px; font-weight: 700; list-style-position: outside">Quanto tempo os Cursos ficam disponíveis na plataforma?</summary><p style="margin: 0 0 20px; font-size: 16px; line-height: 1.65; color: #444444">Todos os Cursos lançados até o ano de 2022 possuem acesso ilimitado à plataforma. São os Cursos: Capacidades Táticas Individuais; Sistemas Táticos; Jogo de Posição; Aspectos Metodológicos de um Clube; Situações de Jogo; Preparação Física (Módulos 1 e 2). Os Cursos lançados a partir de 2023 terão acesso ilimitado apenas por 12 meses.</p></details><details style="background: #FFFFFF; border: 1px solid #E2E2E2; border-radius: 12px; padding: 0 22px"><summary style="cursor: pointer; padding: 20px 0; font-size: 17px; font-weight: 700; list-style-position: outside">Se eu me arrepender da compra, eu posso pedir reembolso?</summary><p style="margin: 0 0 20px; font-size: 16px; line-height: 1.65; color: #444444">Sim, todos os Cursos do Entendendo o Jogo possuem uma possibilidade de reembolso de até 7 dias após a compra do produto, caso haja a necessidade de devolução do mesmo.</p></details><details style="background: #FFFFFF; border: 1px solid #E2E2E2; border-radius: 12px; padding: 0 22px"><summary style="cursor: pointer; padding: 20px 0; font-size: 17px; font-weight: 700; list-style-position: outside">Os cursos possuem certificados?</summary><p style="margin: 0 0 20px; font-size: 16px; line-height: 1.65; color: #444444">Sim, todos os Cursos do Entendendo o Jogo possuem certificação de conclusão. Os certificados são gerados após o Aluno assistir todas as aulas que estão na plataforma e as marcar como “assistidas”.</p></details></div>
