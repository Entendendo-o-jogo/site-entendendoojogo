<div class="eoj-dep-row" style="display: flex; gap: 20px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 4px 2px 18px; align-items: stretch"><figure style="margin: 0; flex: 0 0 360px; scroll-snap-align: start; background: #FFFFFF; border: 1px solid #E2E2E2; border-radius: 14px; padding: 26px 26px 22px; display: flex; flex-direction: column; gap: 18px; box-sizing: border-box"><svg width="30" height="24" viewBox="0 0 30 24" aria-hidden="true" style="flex: 0 0 auto"><path d="M0 24V14.4C0 6.2 4.4 1.4 12 0l1.4 3.4C9 4.8 6.8 7.6 6.6 11.4H12V24H0zm17 0V14.4C17 6.2 21.4 1.4 29 0l1 3.4c-4.4 1.4-6.6 4.2-6.8 8H29V24H17z" fill="#A1C4E6"></path></svg><blockquote style="margin: 0; flex: 1 1 auto; font-size: 15px; line-height: 1.65; color: #333333">Participar da mentoria do Ítalo Resende foi uma experiência de grande aprendizado. Mais do que conteúdos sobre futebol, tive acesso a uma visão estratégica sobre liderança, gestão de pessoas e construção de um ambiente de alta performance. Foram insights que certamente agregam valor à minha atuação como treinador e diretor esportivo. Recomendo a todos que buscam evoluir de forma consistente na carreira.</blockquote><figcaption style="display: flex; align-items: center; gap: 14px; border-top: 1px solid #EDEDED; padding-top: 18px; min-height: 66px"><span style="width: 64px; height: 64px; border-radius: 10px; overflow: hidden; background: #A1C4E6; flex: 0 0 auto; display: block"><img src="/assets/42644cc01cf6629ccac3e269fde2d727.jpg" alt="Marcelo" style="width: 100%; height: 100%; object-fit: cover; object-position: center 20%; display: block; filter: grayscale(1) contrast(1.08); mix-blend-mode: multiply"></span><span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-weight: 700; font-size: 16px; color: #111111">Marcelo</span><span style="font-size: 14px; color: #555555">Treinador sub-16 e assistente técnico do time profissional</span><span style="font-size: 13px; font-weight: 600; color: #4A79A6">MLS NEXT (EUA)</span></span></figcaption></figure><figure style="margin: 0; flex: 0 0 360px; scroll-snap-align: start; background: #FFFFFF; border: 1px solid #E2E2E2; border-radius: 14px; padding: 26px 26px 22px; display: flex; flex-direction: column; gap: 18px; box-sizing: border-box"><svg width="30" height="24" viewBox="0 0 30 24" aria-hidden="true" style="flex: 0 0 auto"><path d="M0 24V14.4C0 6.2 4.4 1.4 12 0l1.4 3.4C9 4.8 6.8 7.6 6.6 11.4H12V24H0zm17 0V14.4C17 6.2 21.4 1.4 29 0l1 3.4c-4.4 1.4-6.6 4.2-6.8 8H29V24H17z" fill="#A1C4E6"></path></svg><blockquote style="margin: 0; flex: 1 1 auto; font-size: 15px; line-height: 1.65; color: #333333">Quando surgiu uma possibilidade de trabalhar com futebol, tive a indicação de fazer uma mentoria com o Italo. Foi a melhor decisão que tive. Ótimo conteúdo, com uma maneira leve e assertiva dos assuntos a serem abordados. Me ajudou muito no trabalho do dia a dia!</blockquote><figcaption style="display: flex; align-items: center; gap: 14px; border-top: 1px solid #EDEDED; padding-top: 18px; min-height: 66px"><span style="width: 64px; height: 64px; border-radius: 10px; overflow: hidden; background: #A1C4E6; flex: 0 0 auto; display: block"><img src="/assets/03eef4ad4f29bbd7ee3f456a078ce885.jpg" alt="Marcelo da Silva" style="width: 100%; height: 100%; object-fit: cover; object-position: center 20%; display: block; filter: grayscale(1) contrast(1.08); mix-blend-mode: multiply"></span><span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-weight: 700; font-size: 16px; color: #111111">Marcelo da Silva</span><span style="font-size: 14px; color: #555555">Auxiliar técnico</span><span style="font-size: 13px; font-weight: 600; color: #4A79A6">Cong An Ha Noi (Vietnã)</span></span></figcaption></figure><figure style="margin: 0; flex: 0 0 360px; scroll-snap-align: start; background: #FFFFFF; border: 1px solid #E2E2E2; border-radius: 14px; padding: 26px 26px 22px; display: flex; flex-direction: column; gap: 18px; box-sizing: border-box"><svg width="30" height="24" viewBox="0 0 30 24" aria-hidden="true" style="flex: 0 0 auto"><path d="M0 24V14.4C0 6.2 4.4 1.4 12 0l1.4 3.4C9 4.8 6.8 7.6 6.6 11.4H12V24H0zm17 0V14.4C17 6.2 21.4 1.4 29 0l1 3.4c-4.4 1.4-6.6 4.2-6.8 8H29V24H17z" fill="#A1C4E6"></path></svg><blockquote style="margin: 0; flex: 1 1 auto; font-size: 15px; line-height: 1.65; color: #333333">Falar da mentoria com o Italo é como algo essencial no meu cotidiano, não apenas a troca de experiências, mas principalmente de conhecimento são os diferenciais durante os nossos encontros. Também destaco a parte didática apresentada durante as explicações sobre diversas temáticas. Excelente profissional!</blockquote><figcaption style="display: flex; align-items: center; gap: 14px; border-top: 1px solid #EDEDED; padding-top: 18px; min-height: 66px"><span style="width: 64px; height: 64px; border-radius: 10px; overflow: hidden; background: #A1C4E6; flex: 0 0 auto; display: block"><img src="/assets/8d90d47ee3ab6b429947afeda84c568b.jpg" alt="Yuri Domingues" style="width: 100%; height: 100%; object-fit: cover; object-position: center 20%; display: block; filter: grayscale(1) contrast(1.08); mix-blend-mode: multiply"></span><span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-weight: 700; font-size: 16px; color: #111111">Yuri Domingues</span><span style="font-size: 14px; color: #555555">Treinador de futebol de base</span></span></figcaption></figure><figure style="margin: 0; flex: 0 0 360px; scroll-snap-align: start; background: #FFFFFF; border: 1px solid #E2E2E2; border-radius: 14px; padding: 26px 26px 22px; display: flex; flex-direction: column; gap: 18px; box-sizing: border-box"><svg width="30" height="24" viewBox="0 0 30 24" aria-hidden="true" style="flex: 0 0 auto"><path d="M0 24V14.4C0 6.2 4.4 1.4 12 0l1.4 3.4C9 4.8 6.8 7.6 6.6 11.4H12V24H0zm17 0V14.4C17 6.2 21.4 1.4 29 0l1 3.4c-4.4 1.4-6.6 4.2-6.8 8H29V24H17z" fill="#A1C4E6"></path></svg><blockquote style="margin: 0; flex: 1 1 auto; font-size: 15px; line-height: 1.65; color: #333333">A mentoria foi um momento muito rico e de muito aprendizado, pois estava me preparando para um desafio no futebol profissional. Foi a oportunidade de agregar conhecimentos e desenvolver meu plano de trabalho na análise de desempenho. Agradeço ao Italo pela oportunidade e disponibilidade em ministrar as aulas com muita excelência.</blockquote><figcaption style="display: flex; align-items: center; gap: 14px; border-top: 1px solid #EDEDED; padding-top: 18px; min-height: 66px"><span style="width: 64px; height: 64px; border-radius: 10px; overflow: hidden; background: #A1C4E6; flex: 0 0 auto; display: block"><img src="/assets/4fdb4865a1c969350f8f554069d62c44.jpg" alt="Isaac Lucas Silva" style="width: 100%; height: 100%; object-fit: cover; object-position: center 20%; display: block; filter: grayscale(1) contrast(1.08); mix-blend-mode: multiply"></span><span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-weight: 700; font-size: 16px; color: #111111">Isaac Lucas Silva</span><span style="font-size: 14px; color: #555555">Auxiliar técnico de futebol</span><span style="font-size: 13px; font-weight: 600; color: #4A79A6">Mamoré</span></span></figcaption></figure><figure style="margin: 0; flex: 0 0 360px; scroll-snap-align: start; background: #FFFFFF; border: 1px solid #E2E2E2; border-radius: 14px; padding: 26px 26px 22px; display: flex; flex-direction: column; gap: 18px; box-sizing: border-box"><svg width="30" height="24" viewBox="0 0 30 24" aria-hidden="true" style="flex: 0 0 auto"><path d="M0 24V14.4C0 6.2 4.4 1.4 12 0l1.4 3.4C9 4.8 6.8 7.6 6.6 11.4H12V24H0zm17 0V14.4C17 6.2 21.4 1.4 29 0l1 3.4c-4.4 1.4-6.6 4.2-6.8 8H29V24H17z" fill="#A1C4E6"></path></svg><blockquote style="margin: 0; flex: 1 1 auto; font-size: 15px; line-height: 1.65; color: #333333">Antes de falar da mentoria em si, gostaria de falar porque busquei fazê-la. Co
