<div style="max-width: 1240px; margin: 0 auto; padding: 72px 32px; display: flex; flex-direction: column; gap: 32px">
<p style="margin: 0; color: #4A79A6; font-weight: 600; font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase">About the book</p>
<h2 id="sobre-t" style="margin: 0; font-family: Montserrat, sans-serif; font-weight: 800; font-size: 36px; line-height: 1.05; text-transform: uppercase">Inside the book</h2>
<div class="lv-cols"><div class="lv-col"><div class="lv-card" style="background: #FFFFFF; border: 1px solid #E2E2E2; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 12px"><h3 style="margin: 0; font-size: 19px; font-weight: 800; text-transform: uppercase">On the idea of writing a book</h3><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">The book was born during the pandemic. Italo Resende had launched the “Game Situations” course, and Vinicius Xavier, one of the students, kept discussing situations from the course and from matches with him. The conversations led to debates that lasted for days.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">The idea for the book came up in one of those conversations. The authors watched many matches looking for situations, dynamics, advantages, disadvantages and details of each. The content became so rich that the project turned into a collection, and this is the first book.</p></div><div class="lv-card" style="background: #FFFFFF; border: 1px solid #E2E2E2; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 12px"><h3 style="margin: 0; font-size: 19px; font-weight: 800; text-transform: uppercase">Foreword by Paulo Calçade</h3><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">The idea was for the foreword to be written by someone influential in Brazilian football who values consuming and producing knowledge in the country. Paulo Calçade, ESPN journalist, student of the game and a highly respected critic in this movement, was the ideal choice.</p></div></div><div class="lv-col"><div class="lv-card" style="background: #FFFFFF; border: 1px solid #E2E2E2; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 12px"><h3 style="margin: 0; font-size: 19px; font-weight: 800; text-transform: uppercase">Technology serving knowledge: QR codes</h3><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">Beyond the written content, readers get illustrative videos with even more detail on the tactical situations discussed in the text.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">Every chapter has one or more QR codes. Just point your phone camera to watch videos related to what you have just read and reinforce it with real examples.</p></div><div class="lv-card" style="background: #FFFFFF; border: 1px solid #E2E2E2; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 12px"><h3 style="margin: 0; font-size: 19px; font-weight: 800; text-transform: uppercase">Championing Brazilian football</h3><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">As part of the movement to improve Brazilian football, every QR code video comes from matches involving a Brazilian team or the Brazilian national team.</p></div></div></div>
</div>
</section>

  if (!v) { box.hidden = false; box.style.display = 'flex'; }
  window.eojCookies = function () { box.hidden = false; box.style.display = 'flex'; };
  box.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-eoj-cookies]'); if (!b) return;
    var c = b.getAttribute('data-eoj-cookies');
    try { localStorage.setItem('eoj-cookies', c); } catch (e) {}
    box.hidden = true; box.style.display = 'none';
    if (c === 'aceito') window.eojLoadGA();
    else if (window.__eojMkt) { try { location.reload(); } catch (e) {} }
  });
})();
</script>
