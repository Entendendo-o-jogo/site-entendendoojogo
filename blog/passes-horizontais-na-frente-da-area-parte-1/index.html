<article style="max-width: 820px; margin: 0 auto; padding: 40px 32px 56px; display: flex; flex-direction: column; gap: 22px">
<nav aria-label="Você está em" style="font-size: 14px; color: #555555"><a href="/blog" style="color: #4A79A6; font-weight: 600; text-decoration: none">Blog</a> / Texto tático</nav>
<h1 style="margin: 0; font-weight: 800; font-size: 42px; line-height: 1.1">Passes horizontais na frente da área (parte 1)</h1>
<p style="margin: 0; font-size: 15px; color: #555555">Por <strong style="color: #111111">Ítalo Resende</strong> · 13 de abril de 2023 · 2 min de leitura</p>
<img src="/assets/2c4f8e9e6e04da84960220f0866a54e4.jpg" alt="" style="width: 100%; height: auto; display: block; border-radius: 14px">
<figure style="margin: 8px 0; display: flex; flex-direction: column; gap: 8px"><img src="/assets/07c1fa0c24fb4e0036107d5c51caa03e.jpg" alt="" style="width: 100%; height: auto; display: block; border-radius: 10px; border: 1px solid #E2E2E2"></figure>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">O que o passe na frente da área pode gerar?</p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Estes passes podem ser considerados passes de atração para a linha defensiva, já que a tendência é que a linha defensiva gire o quadril em direção à bola e tenha a atenção atraída pela bola. Com isso, os jogadores de ataque tendem a infiltrar no espaço utilizando este movimento de quadril/atração, sem que a defesa consiga ter tempo para controlar profundidade.</p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Existem, basicamente, 2 formas de receber a bola na profundidade.</p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">A primeira delas, é a recepção feita pelo próprio jogador que fez o passe na horizontal. Neste caso, o fator de atração é menor do que no exemplo a seguir, porque o 3º homem pode sair de uma zona que fica ainda mais longe do campo visual de quem é responsável pela cobertura do espaço nas costas.</p>
<figure style="margin: 8px 0; display: flex; flex-direction: column; gap: 8px"><img src="/assets/fa03e74ce2ff4e9ebfdb5265a47f8e96.jpg" alt="" style="width: 100%; height: auto; display: block; border-radius: 10px; border: 1px solid #E2E2E2"></figure>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Recepção feita pelo 3º homem</p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Quando a recepção é realizada por um 3º homem, o fator de atração pode ser maior, porque os 2 primeiros jogadores envolvidos estarão no campo de visão dos defensores, o que pode gerar uma sensação de conforto; enquanto o terceiro jogador rompe no espaço.</p>
<figure style="margin: 8px 0; display: flex; flex-direction: column; gap: 8px"><img src="/assets/a2591c21cb3b27da6852dacf0e620411.jpg" alt="" style="width: 100%; height: auto; display: block; border-radius: 10px; border: 1px solid #E2E2E2"></figure>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Vejam alguns exemplo abaixo:</p>
<figure style="margin: 8px 0; display: flex; flex-direction: column; gap: 8px"><img src="/assets/ddb93c08b9c2ed17243f39ef02302148.jpg" alt="" style="width: 100%; height: auto; display: block; border-radius: 10px; border: 1px solid #E2E2E2"></figure>
<figure style="margin: 8px 0; display: flex; flex-direction: column; gap: 8px"><img src="/assets/ffe1258dc5d2ba7bd34ed8267a783523.jpg" alt="" style="width: 100%; height: auto; display: block; border-radius: 10px; border: 1px solid #E2E2E2"></figure>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Outro aspecto importante</p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Outro fator fundamental nesse tipo de situação é a velocidade de ação do jogador que recebe a bola na horizontal na frente da área.</p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Como o jogador que está rompendo contra a última linha possui o constrangimento temporal da linha de impedimento, a ação de quem recebe deve ser em um tempo similar ou inferior ao momento de quem chega no espaço.</p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Caso o passe seja mais rápido que o movimento, pode ser que o jogador da ruptura não tenha chegado no ponto ideal de encontro com a bola.</p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Caso o receptor resolva dominar a bola, pode gerar mais atração, mas também pode fazer com que a bola seja demorada para ir à profundidade e o jogador a receba impedido.</p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Por isso, é importante que os jogadores que recebam a bola neste espaçø frontal à área, tenham a percepção prévia do tempo necessário para o jogador (que vai fazer a corrida), atingir o ponto ideal para receber a bola.</p>
<p style="margin: 0; font-size: 18px; line-height: 1.75; color: #222222">Angulação do passe em relação à possibilidade de finalização também vai ser importante para as chances de sucesso aumentarem, visto que um passe muito diagonal para fora pode dificultar a finalização no gol.</p>
