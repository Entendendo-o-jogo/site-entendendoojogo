<p style="margin: 0; font-size: 17px; line-height: 1.7; color: #333333">Entendendo o Jogo was created in 2018 on Instagram to share the knowledge Ítalo Resende (its founder) was studying and acquiring in his free time, in a more concise and simple way, so that anyone interested in understanding football better could access it.</p>
<p style="margin: 0; font-size: 17px; line-height: 1.7; color: #333333">From then on, Entendendo o Jogo became increasingly influential in spreading specialist knowledge of football tactics. With this growth it became a reference in tactical courses and education, launching the “Football Course: Game Situations” during the pandemic, which brought together more than 340 students.</p>
<p style="margin: 0; font-size: 17px; line-height: 1.7; color: #333333">Today, Entendendo o Jogo offers free learning through Instagram and paid learning through its courses, which follow three core pillars:</p>

<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #DDDDDD">Ítalo Resende is a professional football assistant coach and a former performance analyst. He holds a degree in Physical Education from the Federal University of Viçosa (UFV), a specialisation in Football from the Football Research and Studies Centre (NUPEF) and the CBF Academy PRO coaching licence.</p>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #DDDDDD">He coached youth teams in the United States, was performance analysis coordinator for S. C. Aymorés' professional team, and match analyst and Head of Analysis at OutlierFC (a company specialised in individual analysis, with clients in Brazil's Série A, the Premier League, La Liga and other leagues). He was Head of Analysis for Madura United F.C. (Indonesia) and technical/methodology supervisor at Club Athletico Paranaense. His last two clubs were as first-team assistant coach at Guarani and Persija (Indonesia).</p>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #DDDDDD">In 2018 he created Entendendo o Jogo as a channel to communicate with his followers and share what he was studying, as a way of learning and sharing, with a speed and dynamism followers would not find on other platforms.</p>
