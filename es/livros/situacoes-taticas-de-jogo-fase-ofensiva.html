<h1 style="margin: 0; font-weight: 800; font-size: 50px; line-height: 1.02; text-transform: uppercase">Situações Táticas de Jogo: Fase Ofensiva</h1>
<p style="margin: 0; color: #A1C4E6; font-weight: 700; font-size: 17px; text-transform: uppercase; letter-spacing: 0.04em">Italo Resende y Vinicius Xavier · prólogo de Paulo Calçade</p>
<p style="margin: 0; font-size: 18px; line-height: 1.6; color: #CFCFCF; max-width: 600px">El primer libro de la colección: las situaciones tácticas de la fase ofensiva, de la primera fase de construcción a la ocupación del área.</p>
<div style="display: flex; flex-wrap: wrap; gap: 20px; margin-top: 4px"><div style="border-top: 2px solid #A1C4E6; padding-top: 12px; display: flex; flex-direction: column; gap: 2px; min-width: 150px; flex: 1 1 150px"><span style="font-weight: 800; font-size: 20px">4 capítulos</span><span style="font-size: 14px; color: #CFCFCF">de la construcción a la ocupación del área</span></div><div style="border-top: 2px solid #A1C4E6; padding-top: 12px; display: flex; flex-direction: column; gap: 2px; min-width: 150px; flex: 1 1 150px"><span style="font-weight: 800; font-size: 20px">Códigos QR</span><span style="font-size: 14px; color: #CFCFCF">con videos en cada capítulo</span></div><div style="border-top: 2px solid #A1C4E6; padding-top: 12px; display: flex; flex-direction: column; gap: 2px; min-width: 150px; flex: 1 1 150px"><span style="font-weight: 800; font-size: 20px">Fútbol brasileño</span><span style="font-size: 14px; color: #CFCFCF">en todos los ejemplos en video</span></div></div>
<div style="display: flex; flex-direction: column; gap: 14px; margin-top: 8px; background: #1C1C1C; border: 1px solid #B3261E; border-radius: 12px; padding: 20px 22px">
<span style="display: flex; align-items: center; gap: 10px"><span style="background: #B3261E; color: #FFFFFF; font-weight: 800; font-size: 14px; letter-spacing: 0.1em; padding: 6px 12px; border-radius: 6px">AGOTADO</span><span style="font-size: 16px; font-weight: 600">Este libro está agotado por el momento.</span></span>
<span style="font-size: 15px; color: #CFCFCF; line-height: 1.55">Mientras tanto, conoce el segundo libro de los autores, Sistemas Táticos.</span>
<div style="display: flex; flex-wrap: wrap; gap: 12px"><a href="/es/livros/sistemas-taticos" style="display: inline-flex; justify-content: center; align-items: center; gap: 8px; text-decoration: none; font-weight: 700; font-size: 16px; padding: 15px 24px; border-radius: 8px; background: #A1C4E6; color: #111111">Conoce Sistemas Táticos</a><a href="#sumario" style="display: inline-flex; justify-content: center; align-items: center; gap: 8px; text-decoration: none; font-weight: 700; font-size: 16px; padding: 15px 24px; border-radius: 8px; border: 1.5px solid #4A4A4A; color: #FFFFFF; padding: 14px 22px">Ver índice</a></div>

<section aria-labelledby="sobre-t">
<div style="max-width: 1240px; margin: 0 auto; padding: 72px 32px; display: flex; flex-direction: column; gap: 32px">
<p style="margin: 0; color: #4A79A6; font-weight: 600; font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase">Sobre el libro</p>
<h2 id="sobre-t" style="margin: 0; font-family: Montserrat, sans-serif; font-weight: 800; font-size: 36px; line-height: 1.05; text-transform: uppercase">Por dentro de la obra</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(440px, 1fr)); gap: 20px; align-items: start"><div style="background: #FFFFFF; border: 1px solid #E2E2E2; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 12px"><h3 style="margin: 0; font-size: 19px; font-weight: 800; text-transform: uppercase">Sobre la idea de escribir un libro</h3><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">El libro surgió en la pandemia. Italo Resende había lanzado el curso “Situaciones de Juego”, y Vinicius Xavier, uno de los alumnos, siempre discutía con él situaciones del curso y del juego. Las conversaciones generaban debates que duraban días.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">En una de esas conversaciones surgió la idea del libro. Los autores vieron muchos partidos en busca de situaciones, dinámicas, ventajas, desventajas y detalles de cada una. El contenido quedó tan robusto que el proyecto se convirtió en una colección, y esta es la primera obra.</p></div><div style="background: #FFFFFF; border: 1px solid #E2E2E2; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 12px"><h3 style="margin: 0; font-size: 19px; font-weight: 800; text-transform: uppercase">Tecnología al servicio del conocimiento: códigos QR</h3><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">Más allá del contenido escrito, el lector accede a videos ilustrativos con aún más detalles sobre las situaciones tácticas discutidas en el texto.</p><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">En cada capítulo hay uno o más códigos QR. Basta con apuntar la cámara del celular para ver los videos relacionados con lo que acabas de leer y fijar el contenido con ejemplos reales.</p></div><div style="background: #FFFFFF; border: 1px solid #E2E2E2; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 12px"><h3 style="margin: 0; font-size: 19px; font-weight: 800; text-transform: uppercase">Valorización del fútbol brasileño</h3><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">Para formar parte del movimiento de mejora del fútbol nacional, todos los videos de los códigos QR provienen de partidos con un equipo brasileño o con la selección brasileña.</p></div><div style="background: #FFFFFF; border: 1px solid #E2E2E2; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 12px"><h3 style="margin: 0; font-size: 19px; font-weight: 800; text-transform: uppercase">Prólogo de Paulo Calçade</h3><p style="margin: 0; font-size: 16px; line-height: 1.7; color: #333333">La idea era que el prólogo lo escribiera alguien relevante en el fútbol brasileño, que valorara el consumo y la producción de conocimiento en el país. Paulo Calçade, periodista de ESPN, estudioso del fútbol y crítico de gran valor en este movimiento, fue el nombre ideal.</p></div></div>
</div>
</section>
